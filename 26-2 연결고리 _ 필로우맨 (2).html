und":["없음"],"meaning":"박지철의 가장 진지한 신념을 한재권이 웃음거리로 만든다. 한재권과 박지철의 관계가 다시 한 번 드러난다. 이름이 스스로 무릎을 꿇고 다가가는 모습이 다음 장면의 질문으로 이어진다.","lines":[{"k":"a","x":"( 재권이 등장한다. )","tag":"씬 시작"},{"k":"d","sp":["한재권"],"role":"","x":"뭐하는 짓이야?"},{"k":"d","sp":["박지철"],"role":"","x":"이 새끼한테 건전지 맛 좀 보여주려고요."},{"k":"d","sp":["한재권"],"role":"","x":"근데 뭘 망설여?"},{"k":"d","sp":["박지철"],"role":"","x":"얘기 좀 하느라고요"},{"k":"d","sp":["한재권"],"role":"","x":"무슨 얘기? 야 너... 그 늙으면 아이들이 과자가 어쩌니 존경이 어쩌니 하는 말도 안 되는 지랄을 또 떨고 있었냐?"},{"k":"d","sp":["박지철"],"role":"","x":"아이... 씹할"},{"k":"a","x":"(놀라며)","tag":"대사 중"},{"k":"d","sp":["한재권"],"role":"","x":"(놀라며) 뭐? 너 이 새끼 오늘만 벌써 두 번째야 알아?"},{"k":"d","sp":["박지철"],"role":"","x":"... 저새끼 고문 좀 해야겠으니까 비키세요."},{"k":"a","x":"( 재권은 책상에 앉아 자백서를 마저 다 읽는다. 이름은 천천히 지철에게 다가가 무릎을 꿇는다. )","tag":"이 대사 후"}],"pos":["I:ts>fr","R:xr>tr","J:tm"],"role":{}},{"id":"3-08","t":"“처음 무릎 꿇으라고 한 사람이 누구였습니까?”","pl":5,"light":["(직전 씬 조명 유지) 고문기가 눈에 띄도록 조명을 비춤"],"sound":["없음"],"meaning":"이름이 던진 질문 하나에 형사의 숨은 상처가 드러나는 장면이다. 이름이 ‘이야기를 짓는 사람의 눈’으로 사람의 상처를 읽어 낸다. 박지철이 아이들을 지키려는 이유가 자기 어린 시절에서 왔다는 것을 암시한다.","lines":[{"k":"d","sp":["이이름"],"role":"","x":"박지철 형사님, 당신한테 처음으로 무릎 꿇으라고 했던 사람이 누구였습니까? 당신 어머니였나요, 아님 아버지?"},{"k":"a","x":"( 지철이 순간 완전히 얼어버린다. 재권의 입이 딱 벌어진다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"맙소사!"},{"k":"d","sp":["이이름"],"role":"","x":"제가 맞혀 볼까요. 아버지였죠?"},{"k":"d","sp":["한재권"],"role":"","x":"박 형사야, 너 이놈한테 아빠 이야기까지 떠들었냐. 정말 왜 그래?"},{"k":"d","sp":["박지철"],"role":"","x":"아닙니다. 반장님. 제가 이 새끼한테 그런 이야기를 왜 합니까."},{"k":"d","sp":["한재권"],"role":"","x":"또 그 미친 새끼 얘기 한 거 아냐?"},{"k":"a","x":"(재권에게)","tag":"대사 중"},{"k":"d","sp":["박지철"],"role":"","x":"(재권에게) 그런 식으로 자꾸 긁으실 겁니까? 성장기 문제니 뭐니 제발 그만 하시라고요!"},{"k":"d","sp":["한재권"],"role":"","x":"그럼 아빠한테 좆나 두들겨 맞은 어린 시절이라고 할까? 그럴 수는 없잖아."},{"k":"a","x":"( 지철이 살짝 떨기 시작한다. )","tag":"이 대사 후"},{"k":"d","sp":["박지철"],"role":"","x":"이 새끼한테 얼마나 더 많은 정보를 주시고 싶으신 겁니까? 반장님"},{"k":"d","sp":["한재권"],"role":"","x":"정말 자기 어린 시절을 핑계로 징징거리는 인간들을 보는 거, 지겨워서 그래. 아주 지긋지긋해."},{"k":"a","x":"( 지철이 말을 하면서 고문기를 이름에게 연결한다. )","tag":"이 대사 후"},{"k":"d","sp":["박지철"],"role":"","x":"반장님이라고 해도 넘지 말아야 할 선이라는 게 있는 겁니다."},{"k":"d","sp":["한재권"],"role":"","x":"난 이 새끼 자백서를 마저 읽겠네. 한 가지 거짓이라도 놓쳐서는 안 되니까. 난 내 일을 하는 거야. 누구처럼 자기의 어린 시절에 대한 복수를 위해 쓰레기들을 고문하는 게 아니라."},{"k":"a","x":"(작게 중얼거린다)","tag":"대사 중"},{"k":"d","sp":["박지철"],"role":"","x":"(작게 중얼거린다) 씨발 진짜..."},{"k":"d","sp":["한재권"],"role":"","x":"할 거면 빨리 하지, 박 형사, 삼십 분 후엔 죽여야 되는데. 시간 없다."},{"k":"a","x":"( 지철이 건전지를 연결한다. )","tag":"이 대사 후"}],"pos":["I:fr","R:tr","J:tm"],"role":{}},{"id":"3-09","t":"아버지의 최후 — 한재권의 폭로","pl":5,"light":["(직전 씬 조명 유지) 고문기가 눈에 띄도록 조명을 비춤"],"sound":["없음"],"meaning":"박지철도 이름처럼 부모(아버지)를 베개로 죽인 사람이었다. 아이를 학대한 어른을 증오한 형사와 이름이 거울처럼 서로를 마주보는 순간이다. 박지철이 귀를 막고 자기 머리를 치는 동작은 그가 받은 상처가 아직도 현재형이라는 것을 보여 준다.","lines":[{"k":"d","sp":["이이름"],"role":"","x":"박지철 형사님, 아버님은 지금 어디 계시죠?"},{"k":"d","sp":["박지철"],"role":"","x":"반장님, 가만히 있어요. 입 닥치고 가만히 있어요."},{"k":"d","sp":["한재권"],"role":"","x":"난 아무 말도 안 해. 자백서 읽느라 바빠."},{"k":"d","sp":["이이름"],"role":"","x":"감옥에 있나?"},{"k":"d","sp":["박지철"],"role":"","x":"너도 입 닥쳐, 이 변태새끼야"},{"k":"d","sp":["이이름"],"role":"","x":"안 닥치면 어쩌실 건데? 고문하고 사형시키게요? (사이) 감옥에 있나?"},{"k":"d","sp":["박지철"],"role":"","x":"아 씨발, 집중이 안 되잖아."},{"k":"d","sp":["한재권"],"role":"","x":"감옥에 없어. 없지."},{"k":"d","sp":["박지철"],"role":"","x":"내 말 못 들었어요!"},{"k":"d","sp":["이이름"],"role":"","x":"경찰이 못 잡았어요?"},{"k":"d","sp":["한재권"],"role":"","x":"잡을 수가 없었지"},{"k":"d","sp":["박지철"],"role":"","x":"반장님 제발 좀! 빌어먹을, 일을 할 수가 없다고요."},{"k":"d","sp":["한재권"],"role":"","x":"어쩌나~ 입이 마음대로 움직이는 걸."},{"k":"d","sp":["박지철"],"role":"","x":"자 마지막 선을 연결해야 되거든요. 마지막 선을"},{"k":"d","sp":["이이름"],"role":"","x":"경찰들이 왜 잡을 수가 없었죠? 왜 잡을 수 없었냐니까요?!"},{"k":"a","x":"( 지철이 마지막 선을 연결하고 건전지를 켜려고 하던 거의 마지막 순간에 재권이 말하기 시작한다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"그야 박 형사가 죽여 버렸기 때문이지. 당연한 거 아니야?"},{"k":"a","x":"( 지철이 살짝 웃으며 또 떨기 시작한다. 건전지를 켤 수가 없다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"뭐 그렇다고 살인이라고 할 순 없지. 그지? 음... 정당방위가 좀 더 적당한 말인가 보다. 하지만 난 그냥 살인이라고 하지. 쟬 좀 놀리려고. 아니 여덟 살 때부터 아빠가 침대로 기어들어왔다면, 나라도 죽였을 거야, 안 그래?"},{"k":"a","x":"( 지철이 손으로 귀를 덮는다. 귀를 막던 양 손으로 자신의 머리를 수차례 친다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"음. 쟤도 아빠가 잘 때 가서 베개로 눌러 죽였대, 그러고 보니 둘이 아주 닮은 점이 많네."},{"k":"a","x":"( 재권이 자백서를 테이블 위에 올려놓는다. )","tag":"이 대사 후"}],"pos":["I:fr","R:tr","J:tm"],"role":{}},{"id":"3-10","t":"박지철의 반발 — “상부에 보고하겠습니다”","pl":5,"light":["(직전 씬 조명 유지) 고문기가 눈에 띄도록 조명을 비춤"],"sound":["없음"],"meaning":"1막에서 약속된 ‘착한 형사 / 나쁜 형사’ 역할이 깨지는 순간이다. 박지철이 처음으로 한재권에게 정면으로 대든다. 그러나 대든 이유가 이름이 아니라 자기 과거를 건드렸기 때문이라는 점이 눈에 띈다.","lines":[{"k":"a","x":"대본에 명시된 동선·행동 지문 없음","tag":"씬 시작"},{"k":"d","sp":["박지철"],"role":"","x":"(사이) 이 일, 상부에 정식으로 보고하겠습니다. 수사 방식도 전부 문제 삼을 겁니다. 처음부터 제대로 된 수사도 아니었고, 초점도 없었잖아요. 멀쩡히 작성하던 서류는 찢어버리고, 그것도 전부 장난이었다고 했죠. 이런 식으로 사람 갖고 노는 게 수사입니까?"},{"k":"d","sp":["한재권"],"role":"","x":"터무니없는 말로 피의자를 당황하게 만들고, 동요시켜라. 그거 수사 지침에 다 나와있는 기법인데. 박 형사, 이제 제대로 질문을 좀 해야겠으니까, 그 전기 고문기는 좀 치워주겠나? 제정신인 상태에서 대화를 나누어야겠거든."},{"k":"d","sp":["박지철"],"role":"","x":"서장님께 당신을 이 사건에서 배제하고, 절 이 사건의 책임자로 선임해 달라고 요청할 겁니다. 담당자가 바뀌는 건 드문 일도 아니니까요. 당신은 대가를 치르게 될 거고, 내가 이 사건을 매듭지을 겁니다. 아직 미해결로 남아있는 부분까지 전부 다, 내가 다 정리할 거라고."},{"k":"d","sp":["한재권"],"role":"","x":"그래, 그럼 우리 박지철 반장님이 뭐부터 하실지 한 번 볼까?"},{"k":"d","sp":["박지철"],"role":"","x":"당신이 들어와서 말도 안 되는 이야기를 해대기 전부터 난 계획이 있었어. 첫 번째 할 일은 이 새끼를 이 전기로 고문해 주는 거지."},{"k":"d","sp":["한재권"],"role":"","x":"왜?"},{"k":"d","sp":["박지철"],"role":"","x":"왜? 이 개새끼가 아이들을 좆나게 죽였으니까!"}],"pos":["I:fr","R:tr","J:tm"],"role":{}},{"id":"3-11","t":"한재권의 ‘공식 질문’ — 소녀는 살아 있었나?","pl":5,"light":["(직전 씬 조명 유지) 고문기가 눈에 띄도록 조명을 비춤"],"sound":["없음"],"meaning":"이름이 자기가 쓴 이야기를 자백했지만, 소녀가 살았는지 죽었는지는 대답하지 못한다. 그만큼 이 자백이 ‘이야기를 베낀 것’일 뿐 직접 본 일이 아니라는 것을 한재권이 간파한다. 3막의 반전이 시작되는 지점이다.","lines":[{"k":"d","sp":["한재권"],"role":"","x":"이봐, 내가 첫 번째로 할 일은 그 벙어리 소녀와 관계된 여러 가지 질문을 하는 거야. 첫 번째 질문은 '이이름 씨. 아, 곧 반장님 되실 분이니 인수인계 겸 형식적으로 물어보겠네. 그 \"어린 예수\"이야기에 따라 형과 함께 소녀의 머리에 가시면류관을 씌운 게 사실입니까?'"},{"k":"d","sp":["이이름"],"role":"","x":"예, 사실입니다"},{"k":"d","sp":["한재권"],"role":"","x":"그렇다면, 나의 두 번째 질문은 소녀를 십자가에 박아 세운 것도, 사실입니까?'"},{"k":"d","sp":["이이름"],"role":"","x":"예, 모두 사실입니다."},{"k":"d","sp":["박지철"],"role":"","x":"그건 다 아는 사실이잖아요"},{"k":"d","sp":["한재권"],"role":"","x":"그렇군요. 그렇게 하고 나서 다시 커다란 창을 소녀의 가녀린 허리에 꽂은 것도 사실입니까?"},{"k":"d","sp":["이이름"],"role":"","x":"저도 유감스럽지만, 사실입니다."},{"k":"d","sp":["한재권"],"role":"","x":"그러고 나서 소녀를 매장시켰나요?"},{"k":"d","sp":["이이름"],"role":"","x":"예"},{"k":"d","sp":["박지철"],"role":"","x":"그걸 누가 몰라요?"},{"k":"d","sp":["한재권"],"role":"","x":"당신 이야기에 따르면, 그녀를 묻었을 때, 살아있었던 것으로 되어 있는데, 실제로 소녀를 매장했을 때는 살아있었나요, 아니면 죽어있었나요?"},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 뭐라고요?"},{"k":"d","sp":["한재권"],"role":"","x":"그 벙어리 소녀를 매장했을 때, 살아있었어, 죽어있었어?"},{"k":"a","x":"( 이름이 답을 하려고 생각해보지만, 떠오르는 답이 없다. )","tag":"이 대사 후"},{"k":"a","x":"(조용히)","tag":"대사 중"},{"k":"d","sp":["이이름"],"role":"","x":"(조용히) 잘 모르겠습니다."},{"k":"d","sp":["한재권"],"role":"","x":"뭐?"},{"k":"d","sp":["이이름"],"role":"","x":"잘 모르겠다고요."},{"k":"d","sp":["한재권"],"role":"","x":"잘 몰라? 그러니까 살아있었는지 죽었었는지 모른다. 하. 박 형사? 서장님께 고자질 하러 가는 길에, 이왕이면 감식반도 들러 최대한 빨리 출동해 달라고 이야기 좀 해 줄래? 그리고 땅을 팔 때, 혹시 소녀가 살아있을지 모르니까, 최대한 조심히, 그러나 신속하게 진행하라고 전해줘, 알았지? 고맙다, 애송이 새끼야."},{"k":"a","x":"( 지철이 재권을 보다가, 급하게 뛰어 나간다. 재권이 천천히 이름에게 다가간다. )","tag":"이 대사 후"}],"pos":["I:fr","R:tr>fr","J:tm>xr"],"role":{}},{"id":"3-12","t":"“자백받는 것과 사실 확인은 달라”","pl":5,"light":["(직전 씬 조명 유지) 고문기가 눈에 띄도록 조명을 비춤"],"sound":["없음"],"meaning":"한재권이 처음으로 ‘사실 확인’을 말한다. 이 나라의 수사가 진실보다 자백을 중요하게 여겨 왔다는 것을 한재권이 스스로 짚는 한 줄이다. 한재권이 박지철과 다른 면(더 노련한 면)을 보여 주는 순간이기도 하다.","lines":[{"k":"d","sp":["한재권"],"role":"","x":"어떻게 모를 수가 있지?"},{"k":"d","sp":["이이름"],"role":"","x":"숨이 그리 많이 남아 있지는 않아서, 아마 지금쯤은 확실히 죽었을 겁니다. 아니 그렇게 심하게 당하고도 살리는 없지 않습니까?"},{"k":"d","sp":["한재권"],"role":"","x":"죽었다는 거야? 아님 죽었을 거 같다는 거야? 난 잘 모르겠네. 소녀를 그런 식으로 못 박아서 매장시켜본 적이 있어야 말이지."},{"k":"a","x":"( 재권이 건전지 선을 태평스럽게 만진다. 이름은 전기 고문을 당할 줄 알고 긴장한다. 재권이 선을 빼고는 자리로 돌아간다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"죽었을지도 모르지. 하지만 확인한 건 아니잖아. 넌 '어린 예수 이야기대로 죽였습니다'라고만 했어. 그걸로 박 형사는 만족했겠지. 하지만 난 수사관이야. 자백을 받는 것과 사실을 확인하는 건 다르다고."},{"k":"d","sp":["이이름"],"role":"","x":"분명 죽었을 겁니다."},{"k":"d","sp":["한재권"],"role":"","x":"과연 그럴까? 아니 근데 왜 아직도 무릎을 꿇고 있나? 보면 볼 수록 멍청하군."},{"k":"a","x":"( 재권이 의자로 와 앉으라고 손짓을 한다. 이름이 마지막 선을 스스로 떼어 내고는 자리에 와 앉는다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"자, 시간도 때울 겸 내 이야기를 한 번 해볼까."},{"k":"d","sp":["이이름"],"role":"","x":"예."}],"pos":["I:fr>ts","R:fr>tr"],"role":{}},{"id":"3-13","t":"한재권의 이야기 「기찻길 위의 작은 귀머거리 소년」","pl":5,"light":["(직전 씬 조명 유지) 고문기가 눈에 띄도록 조명을 비춤"],"sound":["없음"],"meaning":"한재권이 ‘나는 사람을 구한다’는 자기 믿음을 이야기로 보여 준다. 이름이 이야기의 빈틈(우연인지 의도인지)을 짚자 한재권이 화를 낸다. 1막에서 이름의 이야기를 ‘암시’로 해석하던 사람이 자기 이야기가 해석당하자 폭발하는 장면이다.","lines":[{"k":"d","sp":["한재권"],"role":"","x":"제목이... 아, 그래. '길고도 긴 기찻길 위에, 작은 귀머거리 소년의 이야기'."},{"k":"d","sp":["이이름"],"role":"","x":"이야기를 쓰셨어요?"},{"k":"d","sp":["한재권"],"role":"","x":"옛날 옛적, 귀가 들리지 않는 소년이 기찻길을 걷고 있었어. 뒤에서 기차가 달려왔지만 소년은 듣지 못했지. 높은 탑의 현자만 그걸 보고 있었어."},{"k":"a","x":"(재권이 책상 위 종이를 힐끗 바라본다.)","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"현자가 어떻게 소년이 귀머거리인지 알죠?"},{"k":"d","sp":["한재권"],"role":"","x":"(사이) 뭐?"},{"k":"d","sp":["이이름"],"role":"","x":"어떻게 알았냐고요."},{"k":"d","sp":["한재권"],"role":"","x":"소년이... 보청기를 하고 있었거든."},{"k":"a","x":"(이름이 웃자 재권이 헛기침한다.)","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"현자가 달려가도 기차보다 빠를 순 없었어. 대신 종이 한 장을 꺼냈지."},{"k":"a","x":"(재권이 책상 위의 종이를 집어 비행기를 접는다.)","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"그리고 종이비행기를 만들어 창밖으로 던졌어."},{"k":"a","x":"(재권이 종이비행기를 날린다.)","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"현자는 비행기를 던진 뒤 돌아보지도 않았어. 소년은 날아온 종이비행기를 잡으려고 선로 밖으로 나왔고, 바로 그때 기차가 지나갔지. 그렇게 소년은 살았어."},{"k":"a","x":"(이름이 떨어진 종이비행기를 눈으로 따라간다.)","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"그거 꽤 그럴듯한 이야긴데요."},{"k":"d","sp":["한재권"],"role":"","x":"꽤? 니 쓰레기 같은 이야기들을 전부 합친 것보다 훨씬 훌륭하지."},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 그런데 이 이야기가 반장님의 세계관을 어떻게 보여주는 거죠?"},{"k":"d","sp":["한재권"],"role":"","x":"아직도 몰라? 현자는 나, 소년은 내 동료들을 상징해. 위험에 빠진 동료들을 내 판단으로 구하지만, 정작 고맙다는 말은 못 들어. 그래도 상관없지. 누군가 살아남았으니까."},{"k":"a","x":"(재권이 자신의 가슴을 손가락으로 가리킨다.)","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 그럼 현자는 소년이 비행기를 잡을 걸 알고 던진 거예요?"},{"k":"d","sp":["한재권"],"role":"","x":"당연하지."},{"k":"d","sp":["이이름"],"role":"","x":"전 그냥 우연인 줄 알았는데요."},{"k":"d","sp":["한재권"],"role":"","x":"아니지. 현자는 소년을 살리려고 일부러 비행기를 던진 거야."},{"k":"d","sp":["이이름"],"role":"","x":"근데 던지고 쳐다보지도 않았다고 하지 않으셨나요?"},{"k":"d","sp":["한재권"],"role":"","x":"그건 비행기를 워낙 잘 던지니까 볼 필요도 없었던 거지."},{"k":"d","sp":["이이름"],"role":"","x":"하지만 소년이 그 비행기를 잡으러 갈지는 몰랐던 거잖아요."},{"k":"a","x":"(재권이 이름을 노려보다 시선을 피한다.)","tag":"이 대사 후"},{"k":"a","x":"(재권이 잠시 말을 멈춘다.)","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"그게 아니라... 소년들은 종이비행기를 좋아하니까 당연히 잡으러 갔을 거라고!"},{"k":"d","sp":["이이름"],"role":"","x":"그렇다면 조금만 다르게 설명했어도 더 분명해졌을 것 같습니다."},{"k":"d","sp":["한재권"],"role":"","x":"닥쳐! 너 같은 새끼한테 문학 강의 들을 생각 없으니까!"},{"k":"d","sp":["이이름"],"role":"","x":"전 그저, 도움을 드리려던 /"}],"pos":["I:ts","R:tr"],"role":{}},{"id":"3-14","t":"성냥 위협과 처형 절차 설명","pl":5,"light":["(직전 씬 조명 유지) 고문기가 눈에 띄도록 조명을 비춤"],"sound":["없음"],"meaning":"한재권이 ‘약속’을 아주 중요하게 생각한다고 말하는 것은 1막에서 “형은 무사할 거야, 내가 보장하지”라고 한 말과 같은 말투다. 지금 이 장면에서 말한 ‘정확한 10초’가 마지막에 어떻게 되는지를 관객이 기억하게 된다.","lines":[{"k":"d","sp":["한재권"],"role":"","x":"중요한 건 삼 일 전 묻힌 그 소녀가 살아 있었냐, 죽어 있었냐는 거야. 그리고 날 더 자극하면 약속이고 뭐고 네 이야기들을 불태워 버릴 테니 조심해."},{"k":"a","x":"( 재권이 이야기 한 묶음과 성냥을 같이 든다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"(사이) 니가 내 이야기가 맘에 안 드는 건 소년이 죽지 않아서야, 씹할!"},{"k":"a","x":"(성냥을 보고 다급하게)","tag":"대사 중"},{"k":"d","sp":["이이름"],"role":"","x":"(성냥을 보고 다급하게) 저 이야기 진심으로 맘에 들었습니다. 제가 만약에 그걸 썼다면 얼마나 좋았을까요, 정말 질투심이 날 만큼 뛰어난 작품입니다"},{"k":"d","sp":["한재권"],"role":"","x":"(사이) 정말?"},{"k":"d","sp":["이이름"],"role":"","x":"그럼요, 정말입니다."},{"k":"a","x":"( 사이, 재권이 이야기들을 내려놓는다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"뭐 자네 이야기를 태우려던 거는 아니었네. 난 약속을 굉장히 중요하게 생각하는 사람이거든."},{"k":"d","sp":["이이름"],"role":"","x":"존경합니다. 반장님께 제 생각이 중요한 문제가 아닐 거라는 건 알지만, 어쨌든 존중합니다."},{"k":"d","sp":["한재권"],"role":"","x":"하하. 이렇게 정도 들었는데, 아쉽지? 이십 분 후에 널 쏴야 된다는 게 아주 쬐금 유감인데."},{"k":"a","x":"( 재권이 웃는다. 이름이 꽤 오랜만에 다시 죽음에 대해 잠시 생각한다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"어... 이제 전 어떻게 되는 거죠?"},{"k":"d","sp":["한재권"],"role":"","x":"일단 벙어리 소녀 소식부터 듣고 나면... 옆방으로 가서, 머리에 두건을 씌우고 그 다음에 총을 쏠 거야."},{"k":"d","sp":["이이름"],"role":"","x":"왜 옆방이죠? 여기가 아니라?"},{"k":"d","sp":["한재권"],"role":"","x":"옆방 바닥이 닦기가 더 쉬워."},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 그냥 내키시면 아무 때나 느닷없이 쏘시는 건가요. 아니면, 기도할 시간 같은 거라도 주시나요?"},{"k":"d","sp":["한재권"],"role":"","x":"내가 느닷없이 쏘고 싶으면, 자네에게 이런 걸 알려주겠나? 아니 천재 작가에 정신병자, 살인마라는 새끼가 이렇게 멍청해서야! (사이) 두건을 쓰는 순간부터 정확하게 10초의 시간을 줄 거야. 그러니까 너도 무슨 이상한 의식 같은 거 한다고 시간 끌지 마."},{"k":"d","sp":["이이름"],"role":"","x":"감사합니다."},{"k":"d","sp":["한재권"],"role":"","x":"천만에"},{"k":"a","x":"( 재권이 두건을 테이블 위, 이름 앞자리에 내려놓는다. 사이","tag":"이 대사 후"}],"pos":["I:ts","R:tr"],"role":{}},{"id":"3-15","t":"“소녀는 살아 있었습니다”","pl":5,"light":["P.47에서 사용한 희미한 초록빛을 순간적으로 재사용"],"sound":["\"죽어있었지?\" → \"아니요.\" 직후 낮은 충격음 1회"],"meaning":"가장 큰 반전이다. ‘어린 예수대로 죽였다’는 이름의 자백이 거짓이라는 것이 드러난다. 앞에서 ‘안전한 이야기’라고 나온 초록 돼지가 현실에 나타나고, 초록빛 조명이 다시 켜지면서 관객이 그 연결을 눈으로 보게 된다.","lines":[{"k":"a","x":"문이 열린다. 지철이 등장한다. 얼굴은 질려있고, 놀라서 입이 잘 안 떨어진다. 이름에게 서서히 다가온다. )","tag":"씬 시작"},{"k":"d","sp":["한재권"],"role":"","x":"소녀는 찾았나?"},{"k":"a","x":"( 지철이 이름에게 다가오자, 이름이 겁에 질린다. 지철은 이름의 어깨를 움켜잡고, 천천히 뚫어져라 내려다본다. )","tag":"이 대사 후"},{"k":"a","x":"(조용히)","tag":"대사 중"},{"k":"d","sp":["박지철"],"role":"","x":"(조용히) 너... 너, 도대체 뭐하는 새끼야? 뭐하는 놈이냐고?"},{"k":"a","x":"( 이름이 대답을 할 수가 없다. 지철이 그를 살짝 놓아주자 제 위치로 돌아간다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"박 형사, 소녀는 찾았나?"},{"k":"d","sp":["박지철"],"role":"","x":"예, 찾았습니다."},{"k":"d","sp":["한재권"],"role":"","x":"죽어있었지?"},{"k":"d","sp":["박지철"],"role":"","x":"아니요."},{"k":"a","x":"( 이름이 놀라서 입에 손을 갔다 댄다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"뭐, 그럼 살아있었어?"},{"k":"d","sp":["박지철"],"role":"","x":"소원의 우물가 뒤쪽 작은 장난감 집에서 발견되었습니다. 세 마리 돼지들과 함께 있었으며, 거기엔 물과 먹을 것이 아주 많았습니다. 돼지 먹이까지도요. 지금은 혹시 몰라 병원에서 검사를 받고 있습니다. 그리고 저랑 약속한 게 하나 있는데요. 반장님께 꼭 물어봐 달라고 했습니다."},{"k":"a","x":"( 재권이 둘을 쳐다본다. 어이가 없다. 사이. )","tag":"이 대사 후"},{"k":"d","sp":["박지철"],"role":"","x":"그, 아기 돼지를 자기가 키워도 되냐고..."},{"k":"a","x":"( 재권은 이해가 되지 않는다는 듯 서류들을 뒤진다. )","tag":"이 대사 후"},{"k":"d","sp":["박지철"],"role":"","x":"그 소녀와 함께 커다란 초록색 페인트 통이 함께 발견 되었답니다. 왜 기차 터널에 쓰는 그 야광 초록색 있잖습니까. 흔해빠진 거. 그리고 저 새끼 말대로, 소원의 우물 뒤에서 두 구의 시체가 발견 되었습니다. 그러니 저 새끼는 우리가 알지도 못하는 살인 사건 두개를 자백했고, 실제로는 죽지도 않는 여자아이의 살인도 자백한 셈입니다."}],"pos":["I:ts","R:tr","J:xr>ts"],"role":{}},{"id":"3-16","t":"머리카락 색 질문 — 이름의 거짓 자백이 무너지다","pl":5,"light":["(직전 씬 조명 유지) P.47에서 사용한 희미한 초록빛을 순간적으로 재사용"],"sound":["없음"],"meaning":"이름의 거짓 자백이 ‘머리카락 색’이라는 아주 작은 사실 하나로 무너진다. 박지철이 ‘형사의 촉’이 꿈틀거린다며 한재권을 흉내 내는 장면은 박지철이 한재권에게 한 방을 먹이는 순간이기도 하다. 이름이 부모는 자기가 죽였다고 거듭 말하는 것은 그것만큼은 진짜 자기가 한 일이라는 뜻이다.","lines":[{"k":"d","sp":["한재권"],"role":"","x":"왜지? 왜..."},{"k":"d","sp":["박지철"],"role":"","x":"반장님은 어린 소녀가 살아있었다는 게 기쁘지도 않으세요? 이 새끼도 아이가 살아 있어 기뻐하는 것 같은데. 반장님은 서류 작업 다시 하는 게 그저 귀찮은가 보네."},{"k":"a","x":"( 재권이 서류 속에서 어떤 이야기 하나를 찾는다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"아이를 초록색으로 칠하고 아기 돼지들과 함께 놓았다면, 이건 분명히..."},{"k":"d","sp":["박지철"],"role":"","x":"작은 초록색 아기 돼지 이야기를 행동으로 옮긴 거죠. 멋지십니다 반장님. 그 초록색 페인트와 아기 돼지들을 보고 대단한 추측하셨네요. 근데 문제는 왜? 아닐까요? 문제는 왜 이 아이만 죽이지 않았느냐는 거죠? 왜 죽이지도 않고 죽였다고 자백 했을까요?"},{"k":"d","sp":["한재권"],"role":"","x":"쉬, 지금 어떤 단서가 있는지 이야기를 다시 읽어 보고 있는 중이거든"},{"k":"a","x":"(웃는다)","tag":"대사 중"},{"k":"d","sp":["박지철"],"role":"","x":"(웃는다) 그냥 이 새끼한테 물어보죠!"},{"k":"d","sp":["한재권"],"role":"","x":"내가 읽고 있다고 했잖아!"},{"k":"a","x":"(이이름에게)","tag":"대사 중"},{"k":"d","sp":["박지철"],"role":"","x":"(이이름에게) 야, 소녀가 왜 살아있는지 우리한테 설명해 줄 수 있냐?"},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 아니요, 모르겠습니다. 하지만, 살아있다니 정말 다행이에요."},{"k":"d","sp":["박지철"],"role":"","x":"그 마음은 믿어주지. 하나만 더 물어보자, 이건 내 촉에서 나오는 질문인데, 아 오늘따라 형사의 촉이 마구 꿈틀거리네. 반장님의 탐정다운 면모가 나한테 다 옮겨와 버렸나봐. 니가 발가락을 잘라 죽인 그 소년, 머리카락 색깔이 뭐였나?"},{"k":"d","sp":["이이름"],"role":"","x":"뭐라고요?"},{"k":"d","sp":["박지철"],"role":"","x":"머리카락 색깔이 뭐였냐고?"},{"k":"d","sp":["이이름"],"role":"","x":"검은 색이요. 짙은 갈색이었던 것 같기도 하고요."},{"k":"d","sp":["박지철"],"role":"","x":"그래, 무난한 대답이네. 그런데 어쩌냐, 할머니 염색약을 뒤집어 써서 머리가 완전히 붉었거든. 논두렁에서 발견된 소녀에 대해서도 질문해 줄까?"},{"k":"d","sp":["이이름"],"role":"","x":"아닙니다."},{"k":"d","sp":["박지철"],"role":"","x":"아니겠지. 왜냐면 넌 둘 다 죽이지 않았으니까, 그지?"},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 예"},{"k":"d","sp":["박지철"],"role":"","x":"두 아이들을 본 적조차 없지, 그지?"},{"k":"d","sp":["이이름"],"role":"","x":"네"},{"k":"d","sp":["박지철"],"role":"","x":"형한테 죽이라고 시킨 적 있나?"},{"k":"d","sp":["이이름"],"role":"","x":"사실 오늘에서야 이 아이들에 대해 알게 되었습니다."},{"k":"d","sp":["박지철"],"role":"","x":"그럼 부모도 형이 죽인 건가?"},{"k":"d","sp":["이이름"],"role":"","x":"부모는 제가 죽였습니다."},{"k":"d","sp":["박지철"],"role":"","x":"지금 너한테 씌울 수 있는 확실한 혐의는 니 형 살인뿐이야. 그런데 사정을 감안하면, 널 사형시킬 이유가 별로 없어. 그러니 부모를 살인했다는 거, 다시 한 번 생각해 보고 말할 기회를 줄..."},{"k":"d","sp":["이이름"],"role":"","x":"부모는 제가 죽였습니다. (사이) 제가 확실히 죽였습니다."},{"k":"d","sp":["박지철"],"role":"","x":"그래, (사이) 하지만 아이들을 죽인 건 아니지?"},{"k":"a","x":"( 이름이 머리를 떨구고 고개를 끄덕인다. )","tag":"이 대사 후"},{"k":"d","sp":["박지철"],"role":"","x":"들으셨죠, 반장님"}],"pos":["I:ts","R:tr","J:tm"],"role":{}},{"id":"3-17","t":"거짓 자백의 이유와 약속 뒤집기","pl":6,"light":["재권이 성냥을 가져오고 불을 붙이는 동작에 맞춰 짧은 주황빛 또는 붉은 조명 사용.","(성냥에서 불이 켜지는 것을 표현하는 조명, 재권만을 주목할 수 있도록 하는 조명)"],"sound":["없음"],"meaning":"이름이 이야기를 지키려고 보탠 거짓이 오히려 이야기를 태울 ‘정당한 이유’로 바뀐다. ‘약속’이라는 말이 이름을 위한 약속이 아니라 이름을 막는 도구로 바뀐다.","lines":[{"k":"a","x":"( 지철이 담배에 불을 붙인다. 재권이 진정을 되찾고 의자 뒤쪽으로 기댄다. )","tag":"씬 시작"},{"k":"d","sp":["한재권"],"role":"","x":"아주 잘했네, 박 형사"},{"k":"d","sp":["박지철"],"role":"","x":"감사합니다. 반장님"},{"k":"d","sp":["한재권"],"role":"","x":"그건 그렇고, 그 소녀가 살아있어서 나도 기뻤네. 일하면서 내 개인적인 감정을 보이고 싶지 않았을 뿐이야."},{"k":"d","sp":["박지철"],"role":"","x":"아~ 정말요."},{"k":"d","sp":["한재권"],"role":"","x":"(사이) 이건 그냥 개인적으로 궁금해서 물어보는 건데, 왜 아이들을 살인했다고 자백했나?"},{"k":"a","x":"(북받쳐 침을 삼키며)","tag":"대사 중"},{"k":"d","sp":["이이름"],"role":"","x":"부모님, 그리고 형(북받쳐 침을 삼키며)(사이) 까지, 죽였다 자백했으니 어차피 사형은 당할 텐데 죄 몇 개 뒤집어 쓴다고 뭐 달라질 건 없잖아요. 또 이러면 내 이야기는 남으니까. 전 제 이야기를 꼭 지키고 싶어요. (사이) 제게 지금 중요한 건 그것뿐입니다."},{"k":"d","sp":["한재권"],"role":"","x":"음... 그렇다면 정말 안됐네, 그지?"},{"k":"d","sp":["이이름"],"role":"","x":"뭐가 안됐다는 거죠?"},{"k":"d","sp":["한재권"],"role":"","x":"그 이야기들을 보호해 주는 조건은 니가 이 끔찍한 사건에 대해 모든 것을 진실대로 자백하는 것이었어. 지금 아이들을 죽이지 않았다는 것이 명백하고, 이제 돼지 주인이 된 초록색 소녀 마저도 전부 자백이 진실하지 않았다는 걸 증명하고 있잖아. 그지? 그러므로, 약속에 따라 이야기들도 다 태워야만 하는 거지. 안 그래?"},{"k":"a","x":"( 재권이 철제용기를 꺼내더니 거기다 기름을 붓고 성냥을 가져온다. )","tag":"이 대사 후"}],"pos":["I:ts","R:tr","J:jw"],"role":{}},{"id":"3-18","t":"예·아니오 질문 — “의무가 있습니다”","pl":6,"light":["(직전 씬 조명 유지) 재권이 성냥을 가져오고 불을 붙이는 동작에 맞춰 짧은 주황빛 또는 붉은 조명 사용.","(성냥에서 불이 켜지는 것을 표현하는 조명, 재권만을 주목할 수 있도록 하는 조명)"],"sound":["없음"],"meaning":"질문을 한 줄씩 쌓아서 ‘이야기를 태울 이유’를 박지철 자신의 입으로 말하게 만드는 한재권의 방식이다. 박지철의 “슬프게”라는 괄호 설명은 규칙과 마음 사이에서 갈등하는 모습을 보여 준다.","lines":[{"k":"d","sp":["이이름"],"role":"","x":"정말 그러시려는 건 아니죠?"},{"k":"d","sp":["한재권"],"role":"","x":"저기 니 두건 있지. 지금 써. 난 불을 붙일 거니까."},{"k":"d","sp":["이이름"],"role":"","x":"박지철 형사님 제발..."},{"k":"d","sp":["한재권"],"role":"","x":"박 형사, 대답해봐. 우리가 이 자가 진실만을 자백한다면, 그의 이야기를 태우지 않기로 약속했나, 하지 않았나?"},{"k":"d","sp":["박지철"],"role":"","x":"반장님, 너무 하십니다."},{"k":"d","sp":["한재권"],"role":"","x":"다시 한 번 묻겠다. 예 아니오로만 대답해. 우리가 피의자가 진실만을 자백한다면, 그의 이야기를 태우지 않기로 약속했나, 하지 않았나?"},{"k":"d","sp":["박지철"],"role":"","x":"예, 약속했습니다."},{"k":"d","sp":["한재권"],"role":"","x":"그가 죽이지도 않은 그 소년을 죽였다고 자백했나, 안 했나?"},{"k":"d","sp":["박지철"],"role":"","x":"했습니다."},{"k":"d","sp":["한재권"],"role":"","x":"그가 죽이지도 않은 소녀에게 면도날을 먹였다고 자백을 했나, 안 했나?"},{"k":"d","sp":["박지철"],"role":"","x":"했습니다."},{"k":"d","sp":["한재권"],"role":"","x":"또 그가 죽지도 않은 그 초록색 소녀를 죽였다고 자백했나, 안 했나?"},{"k":"d","sp":["박지철"],"role":"","x":"자백했습니다."},{"k":"d","sp":["한재권"],"role":"","x":"그렇다면, 우리는 피의자의 이야기들을 태울 의무가 있나 없나?"},{"k":"d","sp":["이이름"],"role":"","x":"박지철 형사님..."},{"k":"a","x":"(슬프게)","tag":"대사 중"},{"k":"d","sp":["박지철"],"role":"","x":"(슬프게) 의무가 있습니다."}],"pos":["I:ts","R:tr","J:jw"],"role":{}},{"id":"3-19","t":"이야기를 불에 — 박지철이 원고를 받아 쥐다","pl":6,"light":["(직전 씬 조명 유지) 재권이 성냥을 가져오고 불을 붙이는 동작에 맞춰 짧은 주황빛 또는 붉은 조명 사용.","(성냥에서 불이 켜지는 것을 표현하는 조명, 재권만을 주목할 수 있도록 하는 조명)"],"sound":["없음"],"meaning":"박지철이 이름의 사정을 말로 이해한다고 밝히는 첫 장면이다. 그래도 이야기가 마음에 든다고는 하지 않는다. 불길 앞에서 원고를 받아 쥐는 이 동작은 마지막에 원고를 지키는 행동의 시작으로 볼 수 있다.","lines":[{"k":"d","sp":["한재권"],"role":"","x":"저기 사 백 개쯤 되는 저 이야기들을 다 태운다면, 리버타드에 실렸다는 그 이야기 하나만 빼고 모두 사라지는 게 되겠군. 평생 노력한 결과물이 이야기 하나라..."},{"k":"a","x":"( 재권이 이야기 원고의 무게를 느껴본다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"뭐 남는 건 별로 없군. 여기 이야기에다가 기름을 좀 더 치자고. 날 추운데."},{"k":"d","sp":["이이름"],"role":"","x":"박지철 형사님 제발 좀..."},{"k":"d","sp":["한재권"],"role":"","x":"두건이나 써 얼른."},{"k":"a","x":"( 재권이 철제용기에 불을 붙인다. 이야기는 계속 들고 있다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"박지철 형사님!!!"},{"k":"d","sp":["한재권"],"role":"","x":"(사이) 박 형사?"},{"k":"d","sp":["박지철"],"role":"","x":"(사이) 전부 너의 잘못만은 아니야. 니가 아이들을 죽이지 않았다는 것도 알았고, 형을 죽여야만 했던 너의 그 심정도 이해할 수 있어. 부모를 죽인 것도 정당한 이유가 있었던 거잖아. 안타까운 일이야. 사형시키는 죄수에게 이런 감정을 느낀 건 처음이야. 하지만 씹할, 니 그 이야기들은 처음부터 맘에 안 들었어, 알지?"},{"k":"a","x":"( 지철이 재권에게서 이야기 원고를 받는다. )","tag":"이 대사 후"}],"pos":["I:ts","R:tr","J:tm"],"role":{}},{"id":"3-20","t":"두건과 10초 — 이름의 마지막 말, 총성","pl":6,"light":["① 완전한 정적 이후, 이름 쪽으로 서서히 조명을 비추어 시선 집중시킴","② 총성이 울릴 때만 암전 → 이어지는 박지철 \"아니 정말 오늘 왜 그래요?\" 대사 직전에 취조실 조명을 어둡게 복귀"],"sound":["① 총성 직후 다른 효과음과 음악은 전부 OFF","② 카운트다운 \"십, 구, 팔…\"은 배우 목소리만으로 긴장감 형성. 총성과 암전의 효과가 더 강해짐."],"meaning":"앞에서 약속한 ‘십 초’가 지켜지지 않는 순간이다. 카운트다운이 ‘사’에서 끊기며 총성이 나는 것은 약속이 말뿐이었음을 보여 준다. 이름이 ‘좋은 작가였다’고 과거형으로 말하고 한재권이 그 ‘였다’를 짚는 것은 잔인하고 정확한 마무리다.","lines":[{"k":"d","sp":["박지철"],"role":"","x":"이제 시간이 다 됐다. 두건 써라."},{"k":"a","x":"( 이름이 두건을 쓰려다 멈춘다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"아까 저한테 옆방으로 데리고 가서, 거기서 두건을 쓴다고 하지 않았나요?"},{"k":"d","sp":["한재권"],"role":"","x":"아, 아니야, 여기서 쏘는 거 맞아. 그냥 장난 좀 쳐 본거니까 신경 쓰지 마. 저쪽 아무데나 멀리만 가서 무릎 꿇어, 피가 튀면 잘 안 지거든."},{"k":"d","sp":["이이름"],"role":"","x":"아까 두건을 쓰고 나면 십 초를 준다고 하셨죠? 그건 지켜주실 거죠? 아니면 그것도 장난치신 건가요?"},{"k":"d","sp":["한재권"],"role":"","x":"음...."},{"k":"d","sp":["박지철"],"role":"","x":"십 초는 줄게 걱정 마."},{"k":"d","sp":["한재권"],"role":"","x":"그래 십 초 주지. 그냥 좀 재미있게 해 보려고 장난친 거야."},{"k":"a","x":"( 이름이 바닥에 무릎을 꿇는다. 재권이 총을 꺼내들어 장전한다. 이름이 슬픈 눈으로 지철을 쳐다본다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"전 꽤 훌륭한 작가였습니다. (사이) 제 꿈은 그것밖에 없었어요. (사이) 그래. 난 좋은 작가였어. 좋은 작가."},{"k":"d","sp":["한재권"],"role":"","x":"(사이) 그래, 거기서 중요한 말은 좋은 작가 '였다'. 잘 가."},{"k":"a","x":"( 이름이 두건을 쓴다. 재권이 조준한다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"십, 구, 팔, 칠, 육, 오, 사..."},{"k":"a","x":"( 재권이 이름의 머리를 쏜다. 이름이 바닥에 쓰러진다. 두건에서 피가 배어 나오기 시작한다. )","tag":"이 대사 후"}],"pos":["I:ts>ctr","R:tr","J:tm"],"role":{}},{"id":"3-21","t":"“사건 종결 잘 했잖아” — 한재권의 퇴장","pl":6,"light":["(직전 씬 조명 유지) 총성이 울릴 때만 암전 → 이어지는 박지철 \"아니 정말 오늘 왜 그래요?\" 대사 직전에 취조실 조명을 어둡게 복귀"],"sound":["없음"],"meaning":"한재권이 쓰는 ‘까까’ 말은 3-06에서 박지철이 했고 3-07에서 한재권이 비웃은 바로 그 표현이다. 두 형사 모두 ‘아이들을 구하는 사람’이라는 이야기로 자기 일을 정당화한다는 것을 보여 준다.","lines":[{"k":"d","sp":["박지철"],"role":"","x":"아니 정말 오늘 왜 그래요?"},{"k":"d","sp":["한재권"],"role":"","x":"뭐가?"},{"k":"d","sp":["박지철"],"role":"","x":"십 초 준다고 약속했잖아요. 너무 비열한 거 아니에요?"},{"k":"d","sp":["한재권"],"role":"","x":"박 형사, 무릎 꿇고 두건 쓴 놈 쏴 죽이는데, 비열하지 않게 쏠 방법도 있니?"},{"k":"d","sp":["박지철"],"role":"","x":"그래도요."},{"k":"d","sp":["한재권"],"role":"","x":"잘 들어, 너 오늘 투덜대는 거, 참을 만큼 다 참아 줬다. 아니 정말 왜 그래? 사건 종결 잘 했잖아. 진실도 다 밝혔고. 안 그래?"},{"k":"d","sp":["박지철"],"role":"","x":"그런가 보네요."},{"k":"d","sp":["한재권"],"role":"","x":"일흔 살 됐을 때, 애들한테 까까 하나 더 받을 수 있는 일 했다고. 안 그래?"},{"k":"a","x":"( 지철이 한숨을 쉰다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"자, 서류 잘 정리하고, 이 방 깨끗하게 청소해 놔. 그리고 저 이야기들은 다 태워. 알았지? 난 벙어리 소녀 부모와 이야기를 좀 해 봐야겠어. 아기 돼지에 대해 경고할 것도 있고."}],"pos":["I:ctr","R:tr>xr","J:tm"],"role":{}},{"id":"3-22","t":"이름의 마지막 이야기 — 필로우맨의 후일담","pl":6,"light":["재권 퇴장 후 취조실 조명 유지 → 이름이 일어나면 현실과 다른 희미한 핀조명으로 전환","여름이 문틈에서 나올 때 조명은 아주 어둡게","여름과 이름을 비추던 조명이 희미해지며 아웃"],"sound":["없음"],"meaning":"죽은 이름이 직접 형을 위한 마지막 이야기를 들려준다. 필로우맨이 “지금 목숨을 끊는 편이 더 행복하다”고 권하지만 여름은 거절한다. 동생이 쓸 이야기를 듣고 싶다는 이유로 고문과 죽음을 스스로 받아들이는 쪽을 택한다. 2막 1장에서 이름이 형을 희생시킨 것처럼 보였던 것과 반대되는 이야기다.","lines":[{"k":"a","x":"(재권이 퇴장한다. 지철이 자신의 손에 들려진 이야기들을 한 번 쳐다본다. 죽은 이름이 서서히 일어나서, 두건을 벗는다. 총알에 엉망이 된 피투성이 얼굴이 보인다. 잠시 주변을 둘러보다 말하기 시작한다.)","tag":"씬 시작"},{"k":"a","x":"(여름이 문틈에서 얼굴을 내민다. 천천히 모습을 드러낸다. 조명이 아주 어둡다.)","tag":"씬 시작"},{"k":"a","x":"(여름과 이름을 비추던 조명이 희미해진다.)","tag":"씬 시작"},{"k":"d","sp":["이이름"],"role":"","x":"죽기 전에 주어졌던 마지막 칠과 사분의 삼초 동안, 저는 형을 위해 마지막 이야기를 머리 속에서 만들어 보았습니다. 그건 새로운 이야기라기보다는 필로우맨의 후일담 같은 거였죠."},{"k":"d","sp":["이이름"],"role":"","x":"여름은 칠년의 고문이 시작되려던 바로 그 전 날. 몸 전체가 푹신푹신한 베개로 된 필로우맨을 만났습니다. 그는 여름 옆에 앉아 소년이 앞으로 겪게 될 끔찍한 인생에 대해 말해 주었습니다. 사랑하는 동생 손에 차가운 바닥에서 발버둥치며 죽게 될 그 엄청난 결말까지 전부 다. 그리곤 물어보았죠. 그렇게 힘들게 살지 말고 자신의 도움으로 지금 스스로 목숨을 끊는다면 그게 더 행복한 거 아니겠냐고? 그러자 여름이 물었습니다."},{"k":"d","sp":["이여름"],"role":"","x":"하지만 지금 스스로 목숨을 끊는다면, 내 동생은 내가 고문당하는 소리를 듣지 못하겠네요, 그죠?"},{"k":"d","sp":["이이름"],"role":"","x":"‘그렇지’라고 필로우맨은 말했습니다."},{"k":"d","sp":["이여름"],"role":"","x":"만약에 동생이 내가 고문당하는 소리를 듣지 못한다면, 앞으로 쓰게 될 이야기들도 모두 사라지는 건가요?"},{"k":"d","sp":["이이름"],"role":"","x":"‘그렇단다’라고 필로우맨이 대답했습니다. 여름은 잠시 생각에 잠기더니..."},{"k":"d","sp":["이여름"],"role":"","x":"그렇다면, 네 생각에는 그냥 그렇게 원래대로 살아가는 게 좋을 거 같아. 난 고문 받고, 동생은 그 소리를 듣고... 왜냐면 난 이름이가 쓸 그 이야기들을 꼭 듣고 싶어요. 그 이야기들을 정말 좋아하게 될 거 같거든요. (손을 활짝 펼쳐보이며) 아주 많이요."}],"pos":["I:ctr","R:tr>xr","J:tm","Y:door"],"role":{}},{"id":"3-23","t":"박지철의 결말 — 태우지 않고 보관하다","pl":6,"light":["(직전 씬 조명 유지) 지철 쪽 희미한 불빛만 남김","지철이 불을 끌 때 짧은 암전"],"sound":["없음"],"meaning":"이름이 약속으로 바랐던 ‘이야기 보관’이 한재권이 깬 약속 대신 박지철의 선택으로 이뤄진다. 지철은 이야기가 이렇게 끝난 것을 현실의 반전이라 부르고, 그래서 더 작품에 어울린다고 말한다. 계산이 아니라 마음에서 나온 선택이라는 점이 중요하다.","lines":[{"k":"a","x":"(지철이 원고를 읽기 시작한다.)","tag":"씬 시작"},{"k":"a","x":"(지철이 파일을 덮고, 사건 파일박스에 이야기들을 넣는다.)","tag":"씬 시작"},{"k":"d","sp":["박지철"],"role":"","x":"사실 이야기는 여기서 그렇게 음울하게 끝내야 하는 게 맞습니다. 여름은 그 끔찍한 고문들을 견디고, 이름은 이야기들을 써갔지만, 결국 그 이야기들조차 형편없는 경찰들에 의해 불태워져 이 세상에서 사려져갔다는 그런 결말 말이죠. 이름은 분명 이야기를 그렇게 끝내려 했습니다. 3초 빨리 발사된 총알만 아니었으면. 어쩌면 이야기가 그렇게 끝나지 않은 게 다행일지도 모릅니다. 그건 실제로 일어난 일과는 많이 달랐거든요. 저는 저조차 끝내 알 수 없는 이유로, 이야기를 태우지 않기로 결심했고, 이 이야기들은 사건 파일과 함께 50년 동안 봉인되었다가 오늘 여러분 앞에 살아났습니다."},{"k":"d","sp":["박지철"],"role":"","x":"이름이 의도했던 그 음울한 결말을 완전히 망쳐버린 이 현실의 반전, 하지만 왠지.... 왠지.... 이 결말이 전체적으로는 작품에 더 잘 어울린다는 생각을 지울 수가 없습니다."}],"pos":["I:ctr","J:tm","Y:door"],"role":{}},{"id":"3-24","t":"마지막 — “이건 해피엔딩이야, 그치?”","pl":7,"light":["짧은 암전. 두 배우가 무대 중앙에 자리한 뒤 핀조명 ON","아주 희미한 빛이 남아 있도록 하고 천천히 페이드. “그치?” 이후 완전한 암전"],"sound":["없음"],"meaning":"마지막 질문이 관객에게도 던져진다. 2막 1장에서 형제가 ‘해피엔딩이 무엇인가’를 두고 다투던 대화에 대한 답처럼 들린다. 두 형제는 죽었지만 이야기는 남았고, 소녀 한 명이 살았다. 극은 이것을 해피엔딩이라고 말해 주지도, 아니라고 말해 주지도 않는다.","lines":[{"k":"a","x":"(지철이 파일박스를 내려다본다.)","tag":"씬 시작"},{"k":"a","x":"(희미한 조명 속 여름과 이름의 조명이 켜진다.)","tag":"씬 시작"},{"k":"a","x":"(이름이 잠시 여름을 바라본다.)","tag":"씬 시작"},{"k":"d","sp":["이여름"],"role":"","x":"이름아."},{"k":"d","sp":["이여름"],"role":"","x":"이건 해피엔딩이야, 그치?"}],"pos":["I:ctr","J:tm","Y:door>fr"],"role":{}}];

 h+='<div class="card"><h3 style="margin-top:0">기록 목록 ('+L.length+')</h3>'+(L.length?L.map(noteRow).join(''):'<span class="mut">아직 기록이 없습니다.</span>')+'</div>';
 h+='<div class="card"><h3 style="margin-top:0">대본과 무대 사이 확인할 점</h3><ul>'+CHK.map(function(x){return'<li>'+esc(x)+'</li>'}).join('')+'</ul></div>';
 h+='<h3>씬별 의미</h3>'+ACTS.map(function(a){return'<details class="card"><summary>'+a[0]+'</summary>'+SC.filter(function(s){return s.id.indexOf(a[1])==0}).map(function(s){return'<p><b><a href="#" onclick="go(\'scene\',\''+s.id+'\');return false">'+s.id+'</a> '+esc(s.t)+'</b><br>'+esc(s.meaning)+'</p>'}).join('')+'</details>'}).join('');
 return h}
function declutter(root){root.querySelectorAll('svg').forEach(function(sv){
 if(sv.dataset.dc)return;var T=[].slice.call(sv.querySelectorAll('text.lb')).filter(function(t){return t.textContent.indexOf('관객석')<0});
 if(!T.length||!T[0].getBBox().width)return;sv.dataset.dc=1;
 function R(e){var b=e.getBBox();return{x:b.x-2,y:b.y-1,w:b.width+4,h:b.height+2}}
 function hit(a,b){return a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h}
 var P=[];sv.querySelectorAll('.ob,text:not(.lb)').forEach(function(e){P.push(R(e))});
 T.sort(function(a,b){return(b.classList.contains('pl')?1:0)-(a.classList.contains('pl')?1:0)});
 var D=[[0,0],[0,-14],[0,14],[0,-28],[0,28],[0,-42],[0,42],[-44,0],[44,0],[-44,-14],[44,-14],[-44,14],[44,14],[0,-56],[0,56],[-88,0],[88,0],[-88,-14],[88,-14],[-88,14],[88,14]];
 T.forEach(function(t){var b=R(t),ok=null;
  for(var i=0;i<D.length&&!ok;i++){var c={x:b.x+D[i][0],y:b.y+D[i][1],w:b.w,h:b.h};
   if(c.x<27||c.x+c.w>735||c.y<102||c.y+c.h>412)continue;
   if(!P.some(function(r){return hit(c,r)}))ok=D[i]}
  ok=ok||[0,0];if(ok[0]||ok[1])t.setAttribute('transform','translate('+ok[0]+' '+ok[1]+')');
  P.push({x:b.x+ok[0],y:b.y+ok[1],w:b.w,h:b.h})})})}
function render(){var nv=document.getElementById('nav');nv.innerHTML=TABS.map(function(t){return'<button class="'+(tab==t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>'}).join('');
 var v=document.getElementById('v');v.innerHTML=tab=='home'?home():tab=='scene'?sceneTab():tab=='light'?cueTab('light','조명팀 큐시트',''):tab=='sound'?cueTab('sound','음향팀 큐시트',''):tab=='props'?propsTab():tab=='actor'?actorTab():planTab();declutter(v);showLn()}
lsLoad();var hs=(location.hash||'').slice(1);if(/^scene-/.test(hs)){tab='scene';sid=hs.slice(6)}else if(TABS.some(function(t){return t[0]==hs}))tab=hs;
if(!SC.some(function(s){return s.id==sid}))sid=SC[0].id;
render();initDb();
</script></body></html>
