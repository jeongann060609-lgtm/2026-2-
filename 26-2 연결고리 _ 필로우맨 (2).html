<script>
var SC=[{"id":"1-1-01","t":"눈가리개를 쓴 채 시작","pl":0,"light":["테이블과 이이름을 비추는 좁은 백색 핀조명"],"sound":["암전 중 초침 소리 시작 → 한재권과 박지철 등장 직전 철문 잠금 해제음 → 입장하는 발소리 → 첫 대사가 시작되면 초침 소리 점차 감소 → 한재권이 눈가리개를 벗겨줄 때 완전히 OFF"],"meaning":"관객이 처음 보는 모습이 ‘눈이 가려진 채 시키는 대로 앉아 있는 사람’이다. 이름은 아무도 시키지 않았는데도 눈가리개를 계속 쓰고 있었다. 이 나라에서 사람이 얼마나 겁먹고 순종하게 되었는지를 첫 장면에서 보여 준다. 좁은 불빛과 초침 소리는 ‘갇혀 있다’, ‘시간이 없다’는 압박을 만든다.","lines":[{"k":"a","x":"( 경찰 취조실. 이이름이 무대 중앙에 눈가리개를 쓴 채 의자에 앉아 있다. 한재권과 박지철이 반대편에 등장해 앉는다. 한재권은 많은 서류들이 들어 있는 두꺼운 폴더를 들고 들어온다. )","tag":"씬 시작"},{"k":"d","sp":["한재권"],"role":"","x":"아니 왜 그걸 하고 있나?"},{"k":"d","sp":["이이름"],"role":"","x":"네?"},{"k":"a","x":"( 한재권이 눈가리개를 빼준다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"누가 이걸 씌워놨냐고?"},{"k":"d","sp":["이이름"],"role":"","x":"저기 어떤 남자가..."},{"k":"d","sp":["한재권"],"role":"","x":"그렇다고 이걸 계속 쓰고 있었어? 멍청하게"},{"k":"d","sp":["이이름"],"role":"","x":"벗으면 안 되는 건 줄 알았습니다."},{"k":"d","sp":["한재권"],"role":"","x":"좀 모자란가?"},{"k":"d","sp":["이이름"],"role":"","x":"네... 네?"}],"pos":["I:ts","R:xr>tr","J:xr>tm"],"role":{}},{"id":"1-1-02","t":"자기소개와 박지철의 위협","pl":0,"light":["(직전 씬 조명 유지) 테이블과 이이름을 비추는 좁은 백색 핀조명"],"sound":["없음"],"meaning":"이름은 “적은 아니었으면 한다”고 말할 만큼 몸을 낮추고, 박지철은 처음부터 폭력을 말하고, 한재권은 느긋하다. 이 세 사람의 역할 차이가 여기서 한 번에 정해진다.","lines":[{"k":"d","sp":["한재권"],"role":"","x":"여긴 박지철, 난 한재권이라고 하네."},{"k":"d","sp":["이이름"],"role":"","x":"제가 하고 싶은 말은, 형사님들을 진심으로 존경한다는 겁니다. 어떻게든 도울 방법만 있다면, 뭐든지 하겠습니다."},{"k":"d","sp":["한재권"],"role":"","x":"뭐, 듣기 나쁜 이야긴 아니군."},{"k":"d","sp":["이이름"],"role":"","x":"전.. 그... 그런 놈은 아니거든요. 아시죠?"},{"k":"d","sp":["한재권"],"role":"","x":"몰라, 어떤 놈?"},{"k":"d","sp":["이이름"],"role":"","x":"왜 경찰들을 경멸하는 놈들 있잖아요. 전 단 한 번도 경찰들의 눈에 띌 만한 짓을 한 적이 없습니다. 그리고 저는 /"},{"k":"d","sp":["박지철"],"role":"","x":"'단 한 번도 경찰들의 눈에 띌 만한 짓을 한 적이 없습니다.' 이번만 예외라는 말인가?"},{"k":"d","sp":["이이름"],"role":"","x":"예?"},{"k":"d","sp":["박지철"],"role":"","x":"그러니까, 지금까지는 한 번도 경찰의 눈에 띌 만한 짓을 한 적이 없었다 이 말 아니냐고?"},{"k":"d","sp":["이이름"],"role":"","x":"제가 그럼 지금 경찰의 눈에 띌 만한 짓이라도 했단 말인가요?"},{"k":"d","sp":["박지철"],"role":"","x":"아니면 여기 왜 왔겠어?"},{"k":"d","sp":["이이름"],"role":"","x":"제 도움이 필요하셔서 부른 줄 알았습니다."},{"k":"d","sp":["박지철"],"role":"","x":"우리가 친구냐. 도우러 오게. 지금 여기 친구들이랑 소풍 온 줄 아나 본데,"},{"k":"d","sp":["이이름"],"role":"","x":"친구는 아니겠죠."},{"k":"d","sp":["박지철"],"role":"","x":"널 체포해서, 가두고, 눈가리개까지 씌워 놓았는데. 그래도 우리가 니 친구처럼 느껴져? 완전 미친놈 아냐!"},{"k":"d","sp":["이이름"],"role":"","x":"친구는 아닐지 몰라도, 적은 아닙니다. 아니 적은 아니었으면 합니다."},{"k":"d","sp":["박지철"],"role":"","x":"그만 나불대고 이빨이나 꽉 깨물어. 대갈통이나 좆나 갈겨 주려니까."},{"k":"d","sp":["이이름"],"role":"","x":"예?"},{"k":"d","sp":["박지철"],"role":"","x":"반장님, 제가 지금 말을 똑바로 못하고 있습니까? 내가 더듬었나?"},{"k":"d","sp":["한재권"],"role":"","x":"아니, 더듬은 적 없네. 아주 선명히 잘 들려."},{"k":"d","sp":["박지철"],"role":"","x":"그렇다는데."},{"k":"d","sp":["이이름"],"role":"","x":"저... 질문하시면 제가 아는 대로 다 말씀드릴 테니까.. 그럴 필요까진 없습 /"},{"k":"d","sp":["박지철"],"role":"","x":"질문? 우리가 언제 질문했냐? 널 얼마큼 손봐주고 시작할지, 그게 내 질문이다. 이 새끼야."},{"k":"d","sp":["한재권"],"role":"","x":"그래, 뭐 시작 치고는 나쁘지 않네, 그지?"}],"pos":["I:ts","R:tr","J:tm"],"role":{}},{"id":"1-1-03","t":"한재권의 혼잣말과 박지철의 가죽 재킷","pl":0,"light":["객석을 향한 방백에만 한재권 핀조명 ON → 이이름에게 말하는 \"자네가 여기 왜 왔을까?\" 직전에 핀조명 OFF → 기존 취조실 조명 복귀"],"sound":["손이 책상에 닿는 순간 둔탁한 타격 효과음 1회"],"meaning":"관객에게 잠깐 말을 거는 순간이다. 관객이 형사 쪽 속마음을 엿보는 자리에 서게 된다. 박지철이 재킷을 손에 끼는 동작은 곧 폭력이 나온다는 신호다.","lines":[{"k":"a","x":"( 재권이 파일 닫으며 객석 향해 독백 )","tag":"씬 시작"},{"k":"a","x":"( 지철은 이름을 노려보며, 벽 쪽으로 가서 가죽 재킷을 손에 낀다. )","tag":"씬 시작"},{"k":"a","x":"대본에 대사 없음","tag":"씬 시작"}],"pos":["I:ts","R:tr","J:tm>jw"],"role":{}},{"id":"1-1-04","t":"“여기 반장이 누구야?”","pl":0,"light":["(직전 씬 조명 유지) 객석을 향한 방백에만 한재권 핀조명 ON → 이이름에게 말하는 \"자네가 여기 왜 왔을까?\" 직전에 핀조명 OFF → 기존 취조실 조명 복귀"],"sound":["없음"],"meaning":"때리고 싶어 하는 박지철을 한재권이 말 한마디로 눌러 세운다. 이 상관과 부하 관계는 3막까지 계속 이어진다.","lines":[{"k":"d","sp":["한재권"],"role":"","x":"자네가 여기 왜 왔을까? 아니 너도 뭐 짚이는 데가 있을 거 아냐? 안 그래?"},{"k":"a","x":"(가죽 재킷을 낀 손으로 주먹을 꽉 쥔다.)","tag":"대사 중"},{"k":"d","sp":["박지철"],"role":"","x":"(가죽 재킷을 낀 손으로 주먹을 꽉 쥔다.) 잡소리 다 집어치우고, 저거 손부터 좀 봅시다."},{"k":"d","sp":["이이름"],"role":"","x":"네?"},{"k":"d","sp":["한재권"],"role":"","x":"박 형사, 여기 반장이 누구야? 자네야 나야? (사이)"},{"k":"a","x":"( 지철이 입을 꾹 다물고 고개를 돌린다. 홧김에 책상을 친다. )","tag":"이 대사 후"},{"k":"a","x":"(이름을 향해)","tag":"대사 중"},{"k":"d","sp":["한재권"],"role":"","x":"(이름을 향해) 그래. 신경 쓸 거 없네. 내 말만 들으면 돼."}],"pos":["I:ts","R:tr","J:jw"],"role":{}},{"id":"1-1-05","t":"압수된 이야기와 “검열이라고 할 것도 없지”","pl":0,"light":["객석을 향한 방백에만 한재권 핀조명 ON → 이이름에게 말하는 \"자네가 여기 왜 왔을까?\" 직전에 핀조명 OFF → 기존 취조실 조명 복귀."],"sound":["없음"],"meaning":"이름은 이야기를 지키려는 사람인데, 겁이 나서 “태워 버리지 뭐”라고 쉽게 말한다. 이 말은 3막에서 실제로 이야기가 불에 타게 되는 상황과 이어진다.","lines":[{"k":"d","sp":["한재권"],"role":"","x":"그건 그렇고, 자네가 왜 여기 오게 됐을까?"},{"k":"d","sp":["이이름"],"role":"","x":"저도 계속 생각해 봤는데, 잘 모르겠습니다."},{"k":"d","sp":["한재권"],"role":"","x":"진짜 모르겠어?"},{"k":"d","sp":["이이름"],"role":"","x":"예, 전 단 한 번도 법을 어겨본 적이 없습니다. 굳이 생각해 본다면, 저와 연관된 뭔가가 있나 싶긴 합니다만..."},{"k":"d","sp":["한재권"],"role":"","x":"무슨 연관?"},{"k":"d","sp":["이이름"],"role":"","x":"절 데려올 때 제 이야기들을 압수하셨잖아요. 압수해 가신 제 이야기들 말고는 짚이는 게 없습니다."},{"k":"d","sp":["한재권"],"role":"","x":"그래 없지. (사이) 니가 여기 온 이유와 그 이야기 사이에 무슨 연관이 있을까? 글을 쓰는 게 죄는 아니잖아 그지?"},{"k":"d","sp":["이이름"],"role":"","x":"예. 그렇죠."},{"k":"d","sp":["한재권"],"role":"","x":"몇 가지만 조심한다면..."},{"k":"d","sp":["이이름"],"role":"","x":"그럼요."},{"k":"d","sp":["한재권"],"role":"","x":"왜, 국가의 안보를 위협하는 왜 그런 놈들 있잖아, 검열이라고 할 것도 없지."},{"k":"d","sp":["이이름"],"role":"","x":"검열이라고 생각한 적 없습니다."},{"k":"d","sp":["한재권"],"role":"","x":"상식적인 선만 지켜 준다면, 이야기를 짓는 거야 아무 문제될 게 없지."},{"k":"d","sp":["이이름"],"role":"","x":"전적으로 동의합니다. 정치나 사상을 떠드는 이야기보다 그냥 이야기를 들려줘야죠. 한 위대한 작가가 말했습니다. \"작가의 유일한 의무는 이야기를 들려주는 것이다.\" 그게 제 신념입니다. 제 글엔 정치적인 의도도 없어요. 혹시 오해할 만한 내용이 있다면 당장 지우겠습니다. 씹할, 태워 버리지 뭐!"},{"k":"a","x":"( 정적이 흐른다, 재권이 그를 뚫어져라 쳐다보기 시작한다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"제가 뭐 말실수라도..."}],"pos":["I:ts","R:tr","J:jw"],"role":{}},{"id":"1-1-06","t":"‘이이름’이라는 이름 장난","pl":0,"light":["(직전 씬 조명 유지) 객석을 향한 방백에만 한재권 핀조명 ON → 이이름에게 말하는 \"자네가 여기 왜 왔을까?\" 직전에 핀조명 OFF → 기존 취조실 조명 복귀."],"sound":["없음"],"meaning":"웃음 p":["이이름"],"role":"","x":"네?"},{"k":"d","sp":["박지철"],"role":"","x":"아니 지금 그는.. 다음에 뭐라고 말하려다 말았잖아."},{"k":"d","sp":["한재권"],"role":"","x":"아빠는 무얼 상징하는 인물이지?"},{"k":"d","sp":["이이름"],"role":"","x":"그는 나쁜 아빠를 상징하죠. 폭력을... 휘두르니까요. 아니 갑자기 상징은 왜..."},{"k":"d","sp":["한재권"],"role":"","x":"나쁜 아빠라... 나쁜 아빠로서 또 무슨 짓을 하는데?"},{"k":"d","sp":["이이름"],"role":"","x":"이야기가 말하는 건 그저 아빠가 딸을 괴롭힌다는 거죠. 결론은 읽는 사람 각자의 몫입니다."},{"k":"d","sp":["박지철"],"role":"","x":"그럼 결론은 각자 맘대로 생각해도 된다는 거네?"},{"k":"d","sp":["이이름"],"role":"","x":"네?"},{"k":"d","sp":["박지철"],"role":"","x":"방금 니가 그랬잖아."},{"k":"d","sp":["이이름"],"role":"","x":"아니요, 아니 맞습니다."},{"k":"d","sp":["박지철"],"role":"","x":"니가 우리 맘대로 생각하라며!"},{"k":"d","sp":["이이름"],"role":"","x":"그럼요"},{"k":"d","sp":["박지철"],"role":"","x":"뭐?"},{"k":"d","sp":["이이름"],"role":"","x":"그러시면 된다고요."},{"k":"d","sp":["박지철"],"role":"","x":"야 이새끼야!"}],"pos":["I:ts","R:tr","J:jw>tm"],"role":{}},{"id":"1-1-10","t":"한재권의 설명과 박지철의 폭행","pl":0,"light":["기존 차가운 조명을 조금 강하게 → 조명은 강하게 밝히지 않고 어둡게 유지 → 한재권의 헛기침 직후 조명 복귀"],"sound":["박지철이 이이름을 때리는 시늉을 하는 순간에 짧고 둔탁한 타격 효과음을 동기화 → 한재권의 헛기침 직후 타격음 종료"],"meaning":"실제로 때리지 않고 소리와 불빛으로 폭력을 느끼게 하는 방식이다. 한재권의 헛기침 한 번에 폭력이 멈춘다는 것은, 이 폭력을 조절하는 사람이 한재권이라는 뜻이다.","lines":[{"k":"a","x":"( 지철이 자리에서 일어나서 흥분을 가라앉히려 한다. )","tag":"씬 시작"},{"k":"d","sp":["한재권"],"role":"","x":"지철이가 그런 말을 싫어해. 정답이 없다느니, 각자 생각하라느니. 뭐든 정답이 딱 나와야 직성이 풀리는 친구거든. 형사 중엔 그런 놈들이 많아. 답부터 정해놓고 사람 잡는 게 마음이 편하거든. 오래 버티기도 하고. (사이) 자! 우리가 내려야 할 첫 번째 결론은 도대체 니가 애들이 학대당하는 이야기를 정확하게 몇 개나 썼느냐 하는 거야."},{"k":"d","sp":["이이름"],"role":"","x":"좀 됩니다. 좀 돼요."},{"k":"d","sp":["박지철"],"role":"","x":"'좀 돼요'? 좀 돼요! 씹할! 내가 처음 읽은 이야기 스무 개가 전부 다 학대하고 겁탈하고 아주 생 지랄을 하는 이야기던데!"},{"k":"d","sp":["이이름"],"role":"","x":"하지만, 무슨 의도가 있었던 건 아닙니다. 아니, 지금 무슨 의도로 그런 말을 하시는 거죠?"},{"k":"a","x":"(기가 차고 짜증스럽게)","tag":"대사 중"},{"k":"d","sp":["박지철"],"role":"","x":"무슨 의도! (기가 차고 짜증스럽게)"},{"k":"d","sp":["이이름"],"role":"","x":"아이들이 뭘 상징하기라도 한다는 말을 하고 싶으신 겁니까? 민중이라던가. 뭐 그런..."},{"k":"a","x":"(다가서며)","tag":"대사 중"},{"k":"d","sp":["박지철"],"role":"","x":"(다가서며) 왜, 그냥 내 입에 말까지 만들어 넣지 그러냐 이 개새끼야! 난 무슨 의도 같은 거 없어! 아까는 씨발 우리 맘대로 결론을 내린다고 지랄하더니"},{"k":"d","sp":["이이름"],"role":"","x":"그런 게 아닙니다."},{"k":"d","sp":["박지철"],"role":"","x":"이젠 아주 내 말까지 막으려고 드네, 손 안 내려 이 새끼야!"},{"k":"a","x":"( 지철이 이름의 멱살을 잡고 당겨 의자에서 넘어뜨린다. 이름이 웅크린다. 지철이 웅크린 이름을 발로 밀친다. 쓰러진 이름의 멱살을 쥔다. 재권이 광경을 보고 한숨을 쉰다. )","tag":"이 대사 후"},{"k":"a","x":"( 얼굴로 내지를 주먹을 등 뒤로 당길 즈음, 재권이 헛기침을 한다.)","tag":"이 대사 후"},{"k":"a","x":"( 지철이 멈춘다, 숨을 거칠게 쉬다가는 자리에 돌아가 삐딱하게 앉는다. )","tag":"이 대사 후"},{"k":"a","x":"(이름에게)","tag":"대사 중"},{"k":"d","sp":["한재권"],"role":"","x":"(이름에게) 좋아. 자네도 가서 앉지."},{"k":"a","x":"( 이름이 고통에 겨워하며 돌아가 앉는다. )","tag":"이 대사 후"}],"pos":["I:ts>fr","R:tr","J:tm>fr"],"role":{}},{"id":"1-1-11","t":"“난 착한 형사, 쟤가 나쁜 형사”","pl":0,"light":["한재권 핀 조명 → 객석을 본 이후로는 다시 원래의 조명으로 돌아옴"],"sound":["없음"],"meaning":"‘착한 형사 / 나쁜 형사’라는 수법을 관객에게 먼저 알려 준다. 그래서 관객은 이후 한재권이 친절해 보여도 그대로 믿기 어려워진다.","lines":[{"k":"a","x":"(객석 보며 짧은 방백 처리)","tag":"대사 중"},{"k":"d","sp":["한재권"],"role":"","x":"아 한 가지 얘기해 주는 걸 깜박했는데, 난 착한 형사고, 쟤가 나쁜 형사야 (객석 보며 짧은 방백 처리)"}],"pos":["I:ts","R:tr","J:tm"],"role":{}},{"id":"1-1-12","t":"「작은 사과맨」 — 아빠의 죽음까지","pl":0,"light":["잠에서 깰 때부터 조명 밝기 낮추기 → 한재권과 이름의 얼굴에만 희미한 조명을 남겨둠"],"sound":["없음"],"meaning":"이야기가 ‘나쁜 아빠가 벌 받았다’로 끝난 것처럼 보이다가, 이름이 “끝이 아니다”라고 말하며 뒤집는다. 이름이 이야기의 구조를 얼마나 정교하게 짜는 작가인지 보여 준다.","lines":[{"k":"a","x":"대본에 명시된 동선·행동 지문 없음","tag":"씬 시작"},{"k":"d","sp":["한재권"],"role":"","x":"(사이) 자 우리 작품 이야기로 돌아가자고, 그러니까 이 소녀를 아빠가 학대하는데, 여기까진 아까 얘기했지... 그런데 어느 날 소녀가 사과를 사람 모양으로 깎아서 작은 사과맨을 여러 개 만든다. 그리고 그걸 아빠에게 선물한다. 소녀는 이건 하나밖에 없는 딸이 어린 시절을 기억하라고 만든 거니 먹어 없애면 절대 안 된다고 말하지. 하지만, 이 못된 아빠는 딸의 말을 들은 적이 없었거든. 이번에도 당연히 이걸 그냥 통째로 삼키게 되고, 사과조각 속에 들어있던 면도날 때문에 아빠가 죽는다."},{"k":"d","sp":["이이름"],"role":"","x":"이야기는 거기서 그렇게 인과응보로 끝나는 듯이 보이지만, 끝이 아니죠. 이야기는 계속됩니다."},{"k":"d","sp":["한재권"],"role":"","x":"소녀는 그날 밤, 잠에서 깨어난다. 그 사과맨들이 소녀의 가슴 위로 걸어 올라와서는 그녀의 입을 억지로 벌리고 시끄럽게 떠든다."}],"pos":["I:ts","R:tr","J:tm"],"role":{}},{"id":"1-1-13","t":"「작은 사과맨」의 마지막 — “니가 우리 친구를 죽였어!”","pl":0,"light":["'끝.'을 기점으로 수사실 조명으로 돌아온다."],"sound":["\"니가 우리 친구를 죽였어\" 대사에 맞춘 충격음 죽였어에 충격음 한 번 주기"],"meaning":"이야기 속 장면을 두 사람이 몸으로 잠깐 연기하는 대목이다. 이름이 한재권의 읽는 소리에 맞춰 몸이 반응한다는 건, 이름 안에 이 이야기가 그만큼 깊이 들어 있다는 표현이다. 이야기와 현실이 겹쳐 보이게 만드는 연출이다.","lines":[{"k":"a","x":"( 재권은 파일에서 시선을 떼지 않은 채 이야기를 읽어 내려간다. 이름은 그의 말을 따라가며 조금씩 입을 벌리는 시늉을 한다. 두 사람이 동시에 천천히 객석을 향해 고개를 돌린다. )","tag":"씬 시작"},{"k":"a","x":"( 두 사람이 객석을 향해 고개를 돌리면, 조명이 한층 어두워진다. )","tag":"씬 시작"},{"k":"a","x":"(작은 목소리)","tag":"대사 중"},{"k":"d","sp":["한재권"],"role":"","x":"(작은 목소리) 니가 우리 친구를 죽였어!"},{"k":"a","x":"(작은 목소리)","tag":"대사 중"},{"k":"d","sp":["이이름"],"role":"","x":"(작은 목소리) 니가 우리 친구를 죽였어!"},{"k":"a","x":"( 재권은 아무 일도 없었다는 듯 다시 파일로 시선을 돌린다. 이름은 목을 움켜쥐고 몇 차례 기침하다가 책상 위로 고개를 떨어뜨린다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"라고 말하고는 그녀의 입속으로 들어간다. 소녀는 자기 자신의 피에 숨이 막혀 질식사한다. 끝."},{"k":"a","x":"( 고개를 들고, 재권과 지철의 반응을 살핀다. 어깨를 으쓱인다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"나름대로 이야기를 꼰 거죠. 꿈인 것처럼 보이지만, 그건 아니고요. 왜요? 뭐, 썩 뛰어난 작품은 아니라고 했잖아요."}],"pos":["I:ts","R:tr","J:tm"],"role":{}},{"id":"1-1-14","t":"형 이야기와 박지철의 퇴장","pl":0,"light":["지철이 문으로 향할 때 문 쪽 조명 집중 → 원래 취조실 조명 복귀"],"sound":["퇴장과 동시에 철문 닫힘 소리 → 군홧발 소리가 멀어짐 → 멀리서 다른 철문이 열리거나 닫히는 소리"],"meaning":"형을 데려간다는 말 한마디가 이름을 가장 크게 흔든다. 문소리가 멀어졌다가 다른 문소리가 들리는 것으로 ‘바로 옆에 다른 방이 있다’는 공간감을 만든다.","lines":[{"k":"d","sp":["박지철"],"role":"","x":"형은 아직도 학교 다니지?"},{"k":"d","sp":["이이름"],"role":"","x":"예?"},{"k":"d","sp":["박지철"],"role":"","x":"너보다 나이도 많은데 아직 학교 다니냐고."},{"k":"d","sp":["이이름"],"role":"","x":"특수학교입니다. 학업이 좀 늦어져서요."},{"k":"d","sp":["박지철"],"role":"","x":"특수학교... (사이)"},{"k":"a","x":"( 지철이 서서 문 쪽으로 간다. )","tag":"이 대사 후"},{"k":"d","sp":["박지철"],"role":"","x":"그러니까 생각나는 게 하나 있는데. 자네 형하고 이야기를 좀 해봐야겠어."},{"k":"a","x":"( 지철 퇴장. 재권이 씩 웃는다. 이름은 어쩔 줄 몰라 하며 겁에 질린다. )","tag":"이 대사 후"}],"pos":["I:ts","R:tr","J:tm>door"],"role":{}},{"id":"1-1-15","t":"“형은 옆방에 있네”","pl":0,"light":["\"형은 옆방에 있네.\" 직후 조명 아주 약하게 1회 흔들림 → 이이름이 \"지금 당장 보내줘, 형은 아무 죄가 없어!\"라고 소리칠 때도 짧게 밝기 변화 (강한 깜빡거림 X)"],"sound":["없음"],"meaning":"이름이 가장 걱정하는 것은 자기가 아니라 형이다. 여기서 한재권이 한 “내가 보장하지”라는 약속은 곧 깨진 것처럼 보이고, 3막에서도 ‘약속’이 중요한 말로 돌아온다.","lines":[{"k":"d","sp":["이이름"],"role":"","x":"제 형은 학교에 있는데요."},{"k":"d","sp":["한재권"],"role":"","x":"'그러니까 생각나는 게 있는데.' 이거 우리 형사들 말버릇이야. 뭐 생각나는 게 좆도 없어도 일단 그렇게 말하고 보거든. 웃기지."},{"k":"d","sp":["이이름"],"role":"","x":"제 형은 학교에 있다고요."},{"k":"d","sp":["한재권"],"role":"","x":"형은 옆방에 있네."},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 하지만, 형은 겁이 많아요. /"},{"k":"d","sp":["한재권"],"role":"","x":"정말 쫀 건 자네 같은데."},{"k":"d","sp":["이이름"],"role":"","x":"예."},{"k":"d","sp":["한재권"],"role":"","x":"뭐가 무서운 거야?"},{"k":"a","x":"(흥분한 목소리로)","tag":"대사 중"},{"k":"d","sp":["이이름"],"role":"","x":"형이 낯선 곳에 혼자 있다는 거요. 박지철 형사가 형을 때리거나, 어, 다시 돌아와서 날 때릴까 봐도 겁나지만 차라리 그건 괜찮아요... 제 이야기가 맘에 안 드신다면 저에게 책임을 물어주십시오. 제 형은 이야기들과는 아무 상관이 없을 뿐더러, 이 상황을 이해하지도 못할 겁니다. 정말이라고요. 형을 이렇게 잡아들이는 건 부당하다고 생각합니다! 지금 풀어줘. 씹할 지금 당장 형을 풀어주라고. (흥분한 목소리로)"},{"k":"d","sp":["한재권"],"role":"","x":"흥분했군."},{"k":"d","sp":["이이름"],"role":"","x":"에이! 씹할 지금 당장 보내줘, 형은 아무 죄가 없어!"},{"k":"d","sp":["한재권"],"role":"","x":"조용히 해! (사이) 어디라고 소리를 질러. 우리가 미친놈들처럼 보이나?"},{"k":"d","sp":["이이름"],"role":"","x":"... 아닙니다."},{"k":"d","sp":["한재권"],"role":"","x":"그래, 우린 미친놈들이 아니야, 가끔 미친놈들을 다루긴 하지만. (사이) 형은 무사할 거야, 내가 보장하지."}],"pos":["I:ts","R:tr"],"role":{}},{"id":"1-1-16","t":"「사거리의 세 사형대」 — ‘주제’ 논쟁","pl":0,"light":["(직전 씬 조명 유지) \"형은 옆방에 있네.\" 직후 조명 아주 약하게 1회 흔들림 → 이이름이 \"지금 당장 보내줘, 형은 아무 죄가 없어!\"라고 소리칠 때도 짧게 밝기 변화 (강한 깜빡거림 X)"],"sound":["없음"],"meaning":"작가가 ‘쓴 것’과 작가가 ‘한 일’이 어디서 갈리는지를 두고 벌이는 핵심 논쟁이다. 한재권은 ‘암시’와 ‘숨은 뜻’을 계속 끌어내고, 이름은 ‘의도 없음’으로 버틴다.","lines":[{"k":"a","x":"( 재권이 파일에서 다른 이야기를 하나 꺼낸다. )","tag":"씬 시작"},{"k":"d","sp":["한재권"],"role":"","x":"'사거리의 세 사형대' 너의 그 주제가 안 보이는 작품이네."},{"k":"d","sp":["이이름"],"role":"","x":"주제요?"},{"k":"d","sp":["한재권"],"role":"","x":"왜 그 일관되신 주제 있잖아. 불쌍한 애들이 좆 되는 주제."},{"k":"d","sp":["이이름"],"role":"","x":"그건 제 주제가 아닙니다. 그냥 이야기 몇 개가 그렇게 나온 거지, 그게 절대 주제는 아니라고요."},{"k":"d","sp":["한재권"],"role":"","x":"음, 다른 이야기들보다 간접적일지는 몰라도 여기도 분명히 그 주제가 보여."},{"k":"d","sp":["이이름"],"role":"","x":"제 이야기에 주제 같은 건 없습니다. 제가 쓴 이야기만 한 사오 백 개는 될 겁니다. 그 중에 애들이 등장하는 건 스무 개 정도도 안 될걸요."},{"k":"d","sp":["한재권"],"role":"","x":"살해된 애들이 등장하는 게 그 정도겠지."},{"k":"d","sp":["이이름"],"role":"","x":"설사 그렇다고 칩시다. 제 이야기 속에서 아이들이 살해당하는 게 무슨 문제라도 된단 말입니까? 그게 뭐 사람들에게 아이들을 살해하고 다녀도 좋다고 하는 것도 아니지 않습니까?"},{"k":"d","sp":["한재권"],"role":"","x":"나는 자네가 애들을 죽이고 다니라고 했다고 한 적 없는데. (사이) 사실은 그게 바로 자네가 진짜 하고 싶은 말 아니야?"},{"k":"d","sp":["이이름"],"role":"","x":"말도 안 되는 소리 좀 그만해요. 지금 무슨 장난을 치는 건지 모르겠지만... 난 그 어떤 말을 하려 한 적도 없어요. 그게 제 작품의 본질입니다."},{"k":"d","sp":["한재권"],"role":"","x":"그래, 알았어, 본질... 그러니까 작가의 의무는 /"},{"k":"d","sp":["이이름"],"role":"","x":"바로 그겁니다."},{"k":"d","sp":["한재권"],"role":"","x":"이 이야기 말이야. '세 개의 사형대' /"},{"k":"d","sp":["이이름"],"role":"","x":"설사 거기 아이들이 등장했다고 하더라도 그건 어떤 의도가 있어서 그런 건 아닙니다."}],"pos":["I:ts","R:tr"],"role":{}},{"id":"1-1-17","t":"“내 말을 끊지 마” — 말하는 법까지 통제","pl":0,"light":["(직전 씬 조명 유지) \"형은 옆방에 있네.\" 직후 조명 아주 약하게 1회 흔들림 → 이이름이 \"지금 당장 보내줘, 형은 아무 죄가 없어!\"라고 소리칠 때도 짧게 밝기 변화 (강한 깜빡거림 X)"],"sound":["없음"],"meaning":"이 나라에서는 이야기를 검열하기 전에 ‘말하는 사람’부터 통제한다는 것을 몸으로 보여 주는 장면이다. 이름이 계속 사과하는 모습도 앞의 눈가리개 장면과 같은 결이다.","lines":[{"k":"a","x":"대본에 명시된 동선·행동 지문 없음","tag":"씬 시작"},{"k":"d","sp":["한재권"],"role":"","x":"자네 꼭 명심할 게 하나 있네. 내가 말할 때는 내 말을 끝까지 듣는 거야. 알았어?"},{"k":"d","sp":["이이름"],"role":"","x":"죄송합니다."},{"k":"d","sp":["한재권"],"role":"","x":"너에게 정확하게 뭔가 질문을 했을 때, 아님 내가 눈으로 '뭔가 이제 말해봐'라는 눈빛을 보냈을 때, 그럴 때는 이야기를 시작해도 돼. 하지만 이렇게 내가 말하고 있는 중에는 /"},{"k":"d","sp":["이이름"],"role":"","x":"알겠습니다. 죄송합니다."},{"k":"d","sp":["한재권"],"role":"","x":"씨발 이 돌대가리 새끼가, 야! 너 지금 내 말을 끊지 말라고 하고 있는데, 또 말을 끊어! 누가 물어봤어? 내가 언제 말해보란 눈빛을 보냈냐고!"},{"k":"d","sp":["이이름"],"role":"","x":"아닙니다."},{"k":"d","sp":["한재권"],"role":"","x":"그래, 안 그랬지? (사이) 자! '안 그랬지?' 이런 거는 정확한 질문이야. 내가 지금 뭔가 말해보라는 눈빛 보내는 거 봤지? 이해가 되나? 이럴 때만 말하란 말이야."},{"k":"d","sp":["이이름"],"role":"","x":"죄송합니다. 좀 긴장했나 봅니다."},{"k":"d","sp":["한재권"],"role":"","x":"그래 긴장 좀 해야지,"},{"k":"d","sp":["이이름"],"role":"","x":"왜요?"}],"pos":["I:ts","R:tr"],"role":{}},{"id":"1-1-18","t":"「사거리의 세 사형대」 — 줄거리와 “암시가 있다”","pl":0,"light":["(직전 씬 조명 유지) \"형은 옆방에 있네.\" 직후 조명 아주 약하게 1회 흔들림 → 이이름이 \"지금 당장 보내줘, 형은 아무 죄가 없어!\"라고 소리칠 때도 짧게 밝기 변화 (강한 깜빡거림 X)"],"sound":["\"총을 빼들더니\" 직후 짧은 금속성 총기 조작음 추가 → 이후 서술이 이어질 때 음향 종료","(실제 총성 대신 장전음만 사용하여 이야기 속 긴장감 강조)"],"meaning":"이름이 “더 잔혹한 죄는 없다”고 자신 있게 말한 뒤 “그럼 있나요?” 하고 흔들리는 모습이 보인다. 한재권은 어떤 이야기든 ‘암시’로 읽어 죄로 만들 수 있다고 보여 준다.","lines":[{"k":"d","sp":["한재권"],"role":"","x":"(사이) '사거리의 세 사형대', 이 이야기를 통해 무슨 말을 하고 싶었던 거야?"},{"k":"d","sp":["이이름"],"role":"","x":"그 이야기에도 특별한 주제가 있는 건 아닙니다. 그건 하나의 정답이 없는 수수께끼 같은 거죠."},{"k":"d","sp":["한재권"],"role":"","x":"내가 보기엔 정답이 있어, 내가 좀 머리가 좋거든."},{"k":"d","sp":["이이름"],"role":"","x":"제 의도는 독자가 저마다 답을 찾게 하는 겁니다. 하지만 진짜 정답은 없어요. 이야기 속의 두 경우보다 더 잔혹한 죄는 없으니까요."},{"k":"d","sp":["한재권"],"role":"","x":"더... 없다?"},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 그럼 있나요?"},{"k":"a","x":"( 재권이 이야기를 다시 훑어 내려가면서 요약한다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"한 남자가 꿈에서 깨어나니 사형대 감옥에 갇혀 있었어. 죄를 지은 기억은 있지만 무슨 죄인지는 몰랐지. 맞은편 사형대엔 강간범의 해골과 늙은 살인마가 있었어. 남자가 살인마에게 자기 죄명이 뭔지 묻자, 노인은 현수막을 읽고 얼굴에 침을 뱉었지."},{"k":"a","x":"(재권이 손가락으로 원고의 한 줄을 짚는다.)","tag":"이 대사 후"},{"k":"a","x":"(재권이 잠시 이름을 바라본다.)","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"지나가던 수녀들은 강간범을 위해 기도하고 살인마에겐 음식을 주었어. 하지만 남자의 죄명을 보곤 울면서 달아났지. 강도 하나는 살인마를 풀어주더니, 남자의 죄명을 읽고는 웃으며 총을 쐈어. 남자가 외쳤지. \"제가 무슨 죄를 지었단 말입니까? 제가 지옥에 가게 될까요?\" 강도의 대답은 나지막한 웃음뿐이었어."},{"k":"a","x":"(이름이 잠시 재권의 반응을 살핀다.)","tag":"이 대사 후"},{"k":"a","x":"(재권이 원고를 덮는다.)","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"이 이야기에는 아무런 문제가 없는 것 같은데, 그죠?"},{"k":"d","sp":["한재권"],"role":"","x":"이야기에 문제 같은 건 없어. 하지만 여기서 확실히 알 수 있는 사실은 이걸 쓴 새끼가 사이코 변태 쓰레기라는 거지. 아, 그리고 이 이야기는 뭔가를 암시하고 있는 것 같거든."},{"k":"d","sp":["이이름"],"role":"","x":"암시요?"},{"k":"d","sp":["한재권"],"role":"","x":"그래 암시"},{"k":"d","sp":["이이름"],"role":"","x":"아~"},{"k":"d","sp":["한재권"],"role":"","x":"자네가 겉으로는 어떤 이야기를 하는 척하면서, 그 이면 저 뒤로는 뭔가 딴 이야기를 숨기고 있다는 거지."} m"],"role":{}},{"id":"1-1-23","t":"“형을 보여 달라” 요구와 상자 열기","pl":0,"light":["이이름이 상자를 열 때 이이름의 얼굴과 상반신에 조명"],"sound":["이이름이 상자를 여는 순간 충격음 1회"],"meaning":"이름이 겁에 질려 있다가 화가 나서 스스로 상자를 연다. 관객은 이름의 표정을 통해 상자 안의 것을 먼저 느낀다.","lines":[{"k":"d","sp":["이이름"],"role":"","x":"형을 봐야겠습니다."},{"k":"d","sp":["박지철"],"role":"","x":"지금 형을 만나겠다고 요구하는 건가?"},{"k":"d","sp":["이이름"],"role":"","x":"그래, 요구한다. 씹할, 형이 괜찮은지 봐야겠어."},{"k":"a","x":"(일어나서)","tag":"대사 중"},{"k":"d","sp":["이이름"],"role":"","x":"(일어나서) 나한텐 형을 볼 권리가 있어 /"},{"k":"d","sp":["한재권"],"role":"","x":"앉아."},{"k":"d","sp":["박지철"],"role":"","x":"이젠 없어. 권리는 무슨, 넌 아무 권리도 없어."},{"k":"d","sp":["이이름"],"role":"","x":"권리가 왜 없어. 누구에게나 권리는 있어."},{"k":"d","sp":["한재권"],"role":"","x":"상자 열어봐."},{"k":"d","sp":["이이름"],"role":"","x":"네?"},{"k":"d","sp":["박지철"],"role":"","x":"니 권리는 조금 있다가 알려줄게"},{"k":"d","sp":["한재권"],"role":"","x":"상자나 열어봐."},{"k":"d","sp":["이이름"],"role":"","x":"니가 어떤 인간인지 아주 잘 /"},{"k":"a","x":"(소리친다)","tag":"대사 중"},{"k":"d","sp":["한재권"],"role":"","x":"(소리친다) 그 좆같은 상자 열어봐!"},{"k":"d","sp":["이이름"],"role":"","x":"씨발 이 좆같은 상자가 도대체 뭔데 그렇게!"},{"k":"a","x":"( 이름이 화가 나서 상자를 열어본다. 그리고 안을 보고는 경악한다. 모서리 쪽으로 가서 떨기 시작한다. )","tag":"이 대사 후"}],"pos":["I:ts>cl","R:tr","J:tm"],"role":{}},{"id":"1-1-24","t":"상자 속 증거 — 면도날과 발가락 다섯 개","pl":0,"light":["이이름이 대사 끝났을 때 얼굴에 집중이 가도록 함"],"sound":["없음"],"meaning":"이름이 쓴 이야기 속 장면이 현실의 물건이 되어 책상 위에 쏟아지는 순간이다. 극 전체에서 가장 큰 충격 장면 중 하나다.","lines":[{"k":"d","sp":["이이름"],"role":"","x":"저게 뭐야?"},{"k":"d","sp":["한재권"],"role":"","x":"와서 앉지."},{"k":"d","sp":["이이름"],"role":"","x":"저게 뭔데요?"},{"k":"a","x":"( 지철이 돌진해서 이름을 끌어다 다시 앉힌다. 그의 머리를 잡아 상자 안을 보게 만든다. )","tag":"이 대사 후"},{"k":"d","sp":["박지철"],"role":"","x":"'저게 뭔데요?' 잘 알면서 왜 그래. 이거 네 집에서 나온 물건이야."},{"k":"d","sp":["이이름"],"role":"","x":"아니야!"},{"k":"d","sp":["박지철"],"role":"","x":"니 형이 이미 다 불었어..."},{"k":"d","sp":["이이름"],"role":"","x":"아니야!"},{"k":"d","sp":["박지철"],"role":"","x":"저 저능아가 어떻게 혼자 이런 일을 저지르겠어? 그 논두렁에서 지원 양이 어떻게 죽었는지 알아? 두 개의 면도날이 사과 조각 안에 들어 있는 채로 목구멍에서 발견됐어. 웃기지 않아? 그리고"},{"k":"a","x":"( 재권이 상자 안으로 손을 넣는다. )","tag":"이 대사 후"},{"k":"d","sp":["박지철"],"role":"","x":"그리고 도영 군은 어떻게 죽었을까?"},{"k":"a","x":"( 그 안에서 다섯 개의 발가락을 꺼낸다. 쏟는다.)","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"엄지발가락, 둘째발가락, 셋째발가락, 넷째발가락, 새끼발가락."},{"k":"d","sp":["박지철"],"role":"","x":"그 어린 소년의 발가락 다섯 개가 너희 집에서 나왔는데, 그래도 니가 상관이 없어?"},{"k":"a","x":"(울면서)","tag":"대사 중"},{"k":"d","sp":["이이름"],"role":"","x":"(울면서) 난 그냥 이야기를 썼을 뿐이야"}],"pos":["I:cl>ts","R:tr","J:tm"],"role":{}},{"id":"1-1-25","t":"“처먹여” 소동과 가짜 피","pl":0,"light":["한재권의 \"그리고 그 손에 있는 피,\" 대사를 시작할 때 박지철에게 짧은 핀 조명 적용"],"sound":["없음"],"meaning":"‘가짜 티가 난다’는 대사가 직접 들어 있어서, 관객은 지금까지 본 폭력과 비명이 어디까지 진짜인지 헷갈리게 된다. 한재권이 발가락을 관객에게 하나씩 보여 주는 동작은 관객까지 증거를 직접 보게 만든다.","lines":[{"k":"d","sp":["박지철"],"role":"","x":"와, 얘 봐라. 이게 안 들킬 거라고 생각했어?"},{"k":"d","sp":["한재권"],"role":"","x":"처먹여."},{"k":"a","x":"( 지철이 이름을 세게 잡아 일으킨다. )","tag":"이 대사 후"},{"k":"d","sp":["박지철"],"role":"","x":"우릴 좆으로 보는 거지. 벙어리 소녀는 어디 있어? 어? 어디 있냐고?"},{"k":"a","x":"( 지철이 이름의 입에다가 발가락을 쳐 넣으려 한다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"아이, 박지철 형사야. 뭐하는 짓이야? 그걸 진짜 먹이면 어떡해."},{"k":"d","sp":["박지철"],"role":"","x":"방금 먹이라고 했잖아요."},{"k":"d","sp":["한재권"],"role":"","x":"그냥 겁주란 이야기지. 증거를 없애면 어떡하려고 그래! 정신이 있는 거야?"},{"k":"d","sp":["박지철"],"role":"","x":"씹할, 정신은 무슨 놈의 정신? 아무렇게나 말하지 맙시다. 특히 성장기에 문제가 있었다니 뭐니, 잘 알지도 못하면서 떠들지 말라고."},{"k":"d","sp":["한재권"],"role":"","x":"성장기에 문제가 있었던 건 사실이잖아."},{"k":"d","sp":["박지철"],"role":"","x":"그만 하십시오 진짜!"},{"k":"d","sp":["한재권"],"role":"","x":"그리고 그 손에 있는 피, 가짜 티가 너무 나잖아."},{"k":"d","sp":["박지철"],"role":"","x":"에이, 씹할!"},{"k":"a","x":"( 지철이 흥분해서 무대 앞 발가락들을 던지고 퇴장한다. 재권이 발가락을 하나하나 관객에게 들어보이며 상자 안에 다시 넣는다. )","tag":"이 대사 후"}],"pos":["I:ts","R:tr","J:tm>xr"],"role":{}},{"id":"1-1-26","t":"한재권의 마지막 압박, 이름의 침묵 선언, 암전","pl":0,"light":["이이름이 고개를 떨어뜨리는 순간 암전"],"sound":["한재권이 상자를 가지고 퇴장하면 철문 잠기는 소리"],"meaning":"1막 1장을 닫는 장면이다. 이름은 ‘이야기를 지키려는 사람’에서 ‘형 때문에 입을 다무는 사람’으로 바뀐다. 한재권이 “작가를 죽이는 건 상징적”이라고 말하는 것은 이름의 운명을 미리 말해 주는 대사이기도 하다.","lines":[{"k":"d","sp":["한재권"],"role":"","x":"저렇게 흥분을 잘해서야"},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 무슨 말인지 하나도 모르겠어요."},{"k":"a","x":"(외우지 말고 현재시간으로)","tag":"대사 중"},{"k":"d","sp":["한재권"],"role":"","x":"그래? 월요일, 현재 시간 5시 15분 (외우지 말고 현재시간으로). 자네 집에서 증거물이 나왔고, 형한테서 자백도 받았어. 이제 자네 자백만 남았지. 얼간이를 죽이는 건 흔한 일이지만, 작가를 죽이는 건 좀 달라. 상징적이거든. (사이) 무슨 상징이냐고? 사실 난 정확히 알고 있지."},{"k":"a","x":"( 재권이 단어 사이사이 파일 끝으로 이름을 찌른다. )","tag":"이 대사 후"},{"k":"d","sp":["한재권"],"role":"","x":"'어린.... 아이를... 건들면... 너도... 좆된다... 새끼야. (사이) 자, 그 벙어리 여자 애는 어디 있어. 니 형이 그 이야기를 들려주는 즐거움은 동생한테 양보하고 싶었던 것 같은데."},{"k":"d","sp":["이이름"],"role":"","x":"당신의 말도 안 되는 이야기는 그만 듣고 싶습니다. 이제 제가 얘기할 차례네요. 당신들이 저와 제 형에게 살해 혐의를 씌우려는 이유는 두 가지인 것으로 추측됩니다. 하나, 제가 쓴 이야기들이 당신들 맘에 들지 않았다는 것, 둘, 어떤 이유에서건 당신들이 사는 이 세상에 지체아들이 활보하고 다니는 게 싫다는 것! 형을 만나게 해 주기 전까지는 입도 뻥긋 안 할 거니까, 어디 날 고문하려면 마음껏 해봐. 지금부터 한마디도 안 한다고!"},{"k":"d","sp":["한재권"],"role":"","x":"(사이) 그래, 좋아 (사이) 가서 전기 고문기부터 가져와야겠군."},{"k":"a","x":"( 한재권이 상자를 갖고 퇴장한다. 문 잠기는 소리가 들린다. 이름의 고개가 내려간다. 암전. )","tag":"이 대사 후"}],"pos":["I:ts","R:tr>door"],"role":{}},{"id":"1-2-01","t":"어린이 방이 드러남","pl":1,"light":["방을 나누어서 이름의 방은 따뜻하게, 옆방은 완전 암흑)"],"sound":["따뜻하지만 조금 불길한 오르골풍 음악으로 변경. 장조로 시작하더라도 반복 구간에 불협화음이나 단조 분위기를 섞어 기괴한 느낌 표현. 1막 2장 조명이 켜지고 어린아이 방이 드러나는 순간 음악 ON."],"meaning":"앞 장은 차갑고 하얀 취조실이었는데 여기서는 따뜻한 동화 같은 방으로 확 바뀐다. 그런데 첫 대사부터 ‘사랑이 실험의 첫 단계’라고 말하기 때문에 따뜻함 속에 불안이 섞여 있다. 방과 옆방의 구분은 이 극의 가장 중요한 공간 장치다.","lines":[{"k":"a","x":"( 이름이 장난감과 그림물감, 필기도구, 종이 등이 있는 한 어린아이의 방으로 보이는 곳 침대에 앉아 있다. 옆방에는 그것과 거의 똑같은 방이 (어쩌면 유리로 된 방이다) 완전한 어둠 속에 가려져 있다. 이름이 자신과 다이아몬드로 장식한 엄마, 턱수염을 기르고 안경을 쓴 아빠가 등장하는 짧은 이야기를 들려주기 시작한다.)","tag":"씬 시작"},{"k":"d","sp":["이이름"],"role":"","x":"옛날 옛적, 부모의 사랑을 듬뿍 받고 자란 소년이 있었습니다. 부모는 소년이 글을 쓰도록 격려했고, 소년은 밝고 아름다운 이야기를 만들었죠. 하지만 소년은 몰랐습니다. 그 사랑이 부모가 준비한 실험의 첫 단계였다는 걸."},{"k":"a","x":"( 엄마와 아빠가 이름을 꼬옥 안아 주고는 시야에서 사라진다. )","tag":"이 대사 후"}],"pos":["I:rug","R:p1>xr","J:p2>xr"],"role":{"I":"소년·낭독자","R":"아빠","J":"엄마"}},{"id":"1-2-02","t":"일곱 번째 생일 밤 — 악몽의 시작","pl":1,"light":["① 따뜻한 조명이 서서히 다시 차갑고 어두운 조명","② 기존 조명을 조금 어둡게, 따뜻한 빛을 줄이고, 차가운 빛 비중을 높임. \"끔찍한 소리를 듣는거야?\" 라는 문장을 읽기 시작할 때 진행"],"sound":["엄마아빠가 이름을 안아준 뒤 사라질 때 따뜻한 음악 줄어들기 → \"소년에게 악몽이 찾아오기 시작한 것은\" 대사부터 낮은 드릴 소리 ON → 이후 비명소리까지 유지"],"meaning":"한 사람(이름)이 어린 소년과 이야기꾼을 오가며 연기하고, 박지철이 엄마 역도 맡는다. 어린 이름이 끔찍한 소리를 ‘선택받은 재능’이라고 믿게 되는 과정이 이 극에서 이름이 가진 상처의 시작이다. “와, 신난다”라는 아이의 대답이 가장 섬뜩한 부분이다.","lines":[{"k":"a","x":"(이름을 다독이고 퇴장한다.)","tag":"위치 미표시"},{"k":"a","x":"(엄마에게 소년의 목소리로)","tag":"대사 중"},{"k":"d","sp":["이이름"],"role":"","x":"소년의 일곱 번째 생일 밤부터 악몽이 시작됐습니다. 굳게 잠긴 옆방에서 드릴 소리와 아이의 비명이 들려왔거든요. 그 소리는 매일 밤 계속됐습니다. (엄마에게 소년의 목소리로) '엄마, 어젯밤 그 소리는 뭐야?'"},{"k":"d","sp":["박지철"],"role":"엄마","x":"우리 귀여운 아들, 그건 네 상상력이 너무 풍부해서, 장난을 치는 거야."},{"k":"a","x":"(소년의 목소리로)","tag":"대사 중"},{"k":"a","x":"(소년의 목소리로)","tag":"대사 중"},{"k":"d","sp":["이이름"],"role":"","x":"(소년의 목소리로) 아, 그렇구나. 엄마, 그럼 다른 아이들도 나처럼 밤마다 끔찍한 소리를 듣는 거야?"},{"k":"d","sp":["박지철"],"role":"엄마","x":"아니, 아니야. 너처럼 선택받은 재능을 가진 아이들만 그렇단다."},{"k":"d","sp":["이이름"],"role":"","x":"(소년의 목소리로) '와, 신난다.'"},{"k":"d","sp":["박지철"],"role":"엄마","x":"늦었다, 이제 자야지? (이름을 다독이고 퇴장한다.)"}],"pos":["I:rug","J:p1"],"role":{"I":"소년·낭독자","J":"엄마"}},{"id":"1-2-03","t":"옆방의 붉은 불빛 — 고문당하는 아이","pl":1,"light":["(직전 씬 조명 유지) 기존 조명을 조금 어둡게, 따뜻한 빛을 줄이고, 차가운 빛 비중을 높임. \"끔찍한 소리를 듣는거야?\" 라는 문장을 읽기 시작할 때 진행"],"sound":["없음"],"meaning":"관객이 처음으로 ‘옆방’을 눈으로 보는 순간이다. 같은 집 안에서 한쪽은 이야기를 밝게 키우고 한쪽은 어둡게 키운다. 이름이 쓴 이야기의 ‘어두움’이 어디서 왔는지를 보여 준다.","lines":[{"k":"a","x":"( 악몽 속의 어떤 한 순간, 붉은 조명의 옆방에서는 두 번의 점멸등에 맞춰 고문당하는 아이와 부모의 모습이 보인다. 불이 꺼져도 끊기지 않는 고문과 비명소리. )","tag":"씬 시작"},{"k":"d","sp":["이이름"],"role":"","x":"왜 이야기 속에 보면 늘 그렇듯이, 부모의 사랑과 격려 덕에 소년의 이야기는 점점 더, 점점 더 훌륭해져 갔습니다. 반면 옆방에서 들려오는 고문소리는 소년의 이야기를 점점 더, 점점 더 어둡게 만들어 갔죠."}],"pos":["I:rug","Y:cageB","R:cageA","J:cageF"],"role":{"I":"소년·낭독자","Y":"학대받던 형","R":"아빠","J":"엄마"}},{"id":"1-2-04","t":"열네 번째 생일 — 피로 쓴 편지","pl":1,"light":["① '편지와 이름 손 쪽으로 희미하게 집중' 구체화. 종이가 문 밑으로 들어오면 문 아래로 시선 집중 → 이름이 편지를 집어 읽을 때 손과 얼굴에 약한 핀조명","② 편지와 이름 손 쪽으로 희미하게 집중하도록 조명 집중"],"sound":["① \"이 편지는 모두 붉은 피로 쓰였습니다\"에서 아주 짧은 비명과 둔탁한 충격음. 편지를 읽는 대사 중에는 큰 타격음을 반복하지 않도록 함","② 고문실과 어울리는 음향으로 사람 비명소리, 사람 때리는 소리 등등"],"meaning":"형이 처음으로 직접 말을 거는 순간이다. ‘피로 쓴 글’이라는 설정은 이 극의 질문, 즉 ‘글은 고통에서 나오는가’를 가장 눈에 띄게 보여 준다.","lines":[{"k":"d","sp":["이이름"],"role":"","x":"그러던 어느 날, 소년의 열네 번째 생일이 찾아왔습니다. 그날은 소년이 이야기 경연대회 본선에 올라 내일의 발표만을 기다리고 있던 날이기도 했죠. 그날 밤, 잠긴 문 밑으로 누군가 종이 한 장을 밀어 넣었습니다..."},{"k":"a","x":"( 빨간 글씨가 쓰인 종이 한 장이 문 밑으로 들어온다. 이름이 그걸 집어 들고 읽는다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"'우리 부모는 지난 7년 동안 너한텐 사랑만을, 나한테는 고문만을 해 왔어. 그 모든 것은 특별한 이유도 없는 그들만의 예술적인 실험이야. 이 실험은 아주 성공적이었지. 넌 이제 더 이상 밝고 따듯한 이야기를 쓰지 않고. 그지?' 마지막에는 사인이 있었습니다. '너의 형이' 이 편지는 모두 붉은 피로 쓰였습니다."}],"pos":["I:rug"],"role":{"I":"소년·낭독자"}},{"id":"1-2-05","t":"도끼로 문을 찍다 — 부모의 ‘연기’","pl":1,"light":["도끼가 문에 닿는 순간 짧은 암전 → 엄마·아빠의 모습이 드러날 때 조명 ON."],"sound":["도끼가 문에 닿는 순간 타격 효과음"],"meaning":"비명이 부모의 연기와 돼지 피였다는 장면이다. 다만 이것은 이름이 ‘글로 쓴 버전’이고, 현실은 이 뒤에 다르게 나온다. 아이의 공포가 부모의 ‘실험 성공’으로 끝나고 모두 웃는 모습이 가장 섬뜩한 부분이다.","lines":[{"k":"a","x":"( 이름이 옆 방문을 도끼로 찍어 열어버린다. )","tag":"씬 시작"},{"k":"a","x":"( 배경 가벽에 도끼로 찍은 순간 암전. 이이름이 옆방으로 넘어간다 )","tag":"씬 시작"},{"k":"d","sp":["이이름"],"role":"","x":"소년은 방문을 도끼로 찍어 열었습니다."},{"k":"a","x":"( 엄마 아빠에게 조명이 들어온다. 그들은 아래에 묘사되는 것처럼 방 안에서 드릴과 녹음기를 가지고 있다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"... 방 안에는 부모님이 앉아서 미소를 짓고 있었죠. 아빠는 드릴로 뭔가를 고치고 있었고, 엄마는 베개에 눌린 것 같은 아이의 비명을 연기하고 있었습니다. 두 사람 사이에는 들통에 든 돼지 피가 있었죠. 아빠가 그 종이 뒷면을 좀 보라고 말했습니다. 거기에는 소년이 아동 문학 경연대회에서 일등상을 받게 된다는 소식이 적혀 있었습니다. 그들은 모두 함께 웃었습니다. 실험의 두 번째 단계도 성공적으로 끝난 셈이었죠."},{"k":"a","x":"( 이름이 엄마 아빠와 함께 자기 방으로 돌아온다. 엄마 아빠가 이이름의 양 옆에 눕는다. 조명이 어두워진다. )","tag":"이 대사 후"}],"pos":["I:rug>cageF","R:cageA","J:cageB"],"role":{"I":"소년·낭독자","R":"아빠","J":"엄마"}},{"id":"1-2-06","t":"이사 후 성장, 옛집, 시체 발견, 이야기를 태움","pl":1,"light":["① 시체와 어울리는 차가운 조명 on","(시체에게 집중할 수 있도록)","② 라이터를 불태운다는 것을 강조하는 조명 → 부모를 베개로 누르는 마지막 행동에서만 조명을 서서히 암전","( 이때는 시체와 어울리는 조명과 반대되도록 따뜻한 느낌의 조명으로 )"],"sound":["① 시체를 발견했을 때 낮은 베이스의 충격음 1번","② 시체 발견 시 충격음 1회"],"meaning":"이름의 가장 큰 죄책감이 나오는 장면이다. 이름은 이야기를 지키려는 사람인데, 처음에는 가장 아름다운 이야기를 태운 사람이다. 3막에서 이름의 이야기가 태워질 위기에 놓이는 것과 거울처럼 이어진다.","lines":[{"k":"d","sp":["이이름"],"role":"","x":"그 일 이후 그들은 다른 집으로 이사를 했습니다. 소년은 비명과 악몽이 사라졌음에도, 어둡고 비틀린 이야기들을 계속 썼습니다. 소년은 부모님께 감사를 드렸습니다. 괴짜 같은 그들의 장난기 덕에 뛰어난 이야기를 쓰게 되었으니까요. 그 후로 몇 년, 소년의 작품이 처음으로 출판되었을 때, 소년은 문득 자신이 어렸을 때 살았던 그 집을 찾아가고 싶어졌습니다. 가지고 놀던 장난감, 그림물감 등이 먼지만 쌓인 채 방 안 그대로 남아 있었습니다..."},{"k":"a","x":"( 이름이 옆방에 들어가 본다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"그리고는 옆 방문을 열었습니다. 그곳 역시 녹이 슨 드릴과 자물쇠, 전기선 등이 흐트러져 남아 있었죠. 소년은 어렸을 때의 그 엉뚱한 악몽을 생각하며 웃었습니다. 하지만, 그 웃음은 오래 가지 못했습니다."},{"k":"a","x":"( 침대가 이상하게 울퉁불퉁하게 느껴진다. 소년이 매트리스를 당기자 그 안에는 한 소년의 끔찍한 시체가 있다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"옆방 매트리스 밑에는 열네 살 소년의 시체가 있었습니다. 시체의 손엔 피로 쓴 이야기가 쥐어져 있었죠. 끔찍한 고통 속에서 형이 쓴 그 이야기는, 놀랍게도 이름이 읽어본 것 중 가장 따뜻하고 아름다웠습니다. 자신은 결코 쓸 수 없을 만큼 훌륭한 작품이었죠."},{"k":"a","x":"( 이름이 라이터를 꺼내 이야기를 불태운다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"소년은 그 이야기를 태우고, 시체 위에 매트리스를 다시 덮었습니다. 그리고 다시는 이 사실을 이야기 하지 않았습니다. 부모에게도, 출판업자들에게도, 그 누구에게도. 부모의 마지막 실험도 모두 끝이 났던 셈이었죠."}],"pos":["I:mid>bedF","Y:bed"],"role":{"I":"소년·낭독자","Y":"학대받던 형"}},{"id":"1-2-07","t":"“글로 쓴 결말은 이랬지만 현실은 달랐다”","pl":1,"light":["(직전 씬 조명 유지) 라이터를 불태운다는 것을 강조하는 조명 → 부모를 베개로 누르는 마지막 행동에서만 조명을 서서히 암전","( 이때는 시체와 어울리는 조명과 반대되도록 따뜻한 느낌의 조명으로 )"],"sound":["없음"],"meaning":"지금까지 들은 이야기가 ‘이름이 지어낸 결말’이었다고 이름이 직접 밝히고, 진짜 이야기로 넘어가는 문이다. 관객은 방금까지 본 것을 믿어도 되는지 다시 따져 보게 된다.","lines":[{"k":"a","x":"( 옆방에 조명이 살짝 들어온다, 침대에는 엄마와 아빠가 자고 있다. )","tag":"씬 시작"},{"k":"d","sp":["이이름"],"role":"","x":"이이름의 이야기 '작가와 작가의 형제'는 그렇게 멋진 음침한 결말로 끝이 났지만, 현실은 이것과 전혀 달랐습니다. 현실의 이야기도 결코 행복한 결말은 아니었지만 거기에는 그가 숨길 수밖에 없었던 진실이 있었죠. 앞에까지는 똑같고, 달라지기 시작한 부분은 당연히... 소년이 피로 쓰인 편지를 보고, 문을 부수는 순간부터죠..."}],"pos":["I:mid","R:bed","J:bed2"],"role":{"I":"소년·낭독자","R":"아빠","J":"엄마"}},{"id":"1-2-08","t":"현실 — 형은 살아 있었고, 이름은 부모를 죽였다","pl":1,"light":["(직전 씬 조명 유지) 라이터를 불태운다는 것을 강조하는 조명 → 부모를 베개로 누르는 마지막 행동에서만 조명을 서서히 암전","( 이때는 시체와 어울리는 조명과 반대되도록 따뜻한 느낌의 조명으로 )"],"sound":["없음"],"meaning":"이름이 ‘이야기 속 아이’에서 ‘부모를 직접 죽인 사람’으로 바뀌는 장면이다. 이름이 2막 1장에서 “난 칠 년 동안 자식을 고문한 사람들을 죽인 것”이라 말하는 근거가 여기서 나온다. 극의 제목과 이어지는 ‘베개’가 처음 쓰이는 순간이기도 하다.","lines":[{"k":"a","x":"( 암전 후 시체를 향해 손을 뻗는 이름. 죽은 줄 알았던 시체가 이름의 팔목을 붙잡는다. )","tag":"씬 시작"},{"k":"d","sp":["이이름"],"role":"","x":"... 소년은 자신의 형을 발견했습니다. 살아있었지만, 이미 뇌가 너무 손상되어 정상이 아니었습니다. 그날 밤, 부모들이 잠자는 사이, 열네 번째 생일 맞은 그 소년은 아빠의 얼굴을 베개로 눌러 한참을 기다렸고..."},{"k":"a","x":"( 이름이 아빠를 베개로 눌러 질식시킨다. 아빠가 몸을 부르르 떨다 죽는다. 소년이 엄마의 어깨를 살짝 두드리자 엄마가 졸린 눈을 비비며 일어난다. 엄마는 입을 벌린 채 죽어있는 아빠의 모습을 본다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"... 그리고 엄마를 살짝 깨운 후, 아빠의 파랗게 죽어 있는 모습을 보게 할 시간을 잠깐 준 후, 엄마의 얼굴에도 베개를 눌러 놓고는 잠시 기다렸습니다."},{"k":"a","x":"( 이름이 멍한 표정으로 비명을 질러대는 엄마의 얼굴에 베개로 눌러 질식시킨다. 엄마의 몸이 강렬하게 떨리지만, 소년은 한 번 더 힘을 주어 꽉 누른다. 조명이 서서히 암전된다. )","tag":"이 대사 후"}],"pos":["I:bedF","R:bed","J:bed2","Y:cageB"],"role":{"I":"소년·낭독자","Y":"학대받던 형","R":"아빠","J":"엄마"}},{"id":"2-1-01","t":"감옥 — 비명 소리를 흉내 내는 여름","pl":2,"light":["옆방 자물쇠가 열리는 소리가 들리면 문 쪽으로 차가운 핀조명 ON → 지철이 이름을 감옥에 던져 넣는 순간 문과 두 배우가 보이도록 조명 확장 → 이름이 바닥에 쓰러지면 1~2초 동안 서서히 원래 감옥 조명으로 복귀.","(감옥에 어울리는 차갑고 약한 조명, 잠시 동안만 감옥이라는 장소를 설명하기 위해서 불이 꺼졌다 켜졌다 하는듯한 낡은 느낌의 조명."],"sound":["고문소리 희미하게 들려오도록 함"],"meaning":"이름이 고문당하는 소리를 형이 박자와 흉내 놀이처럼 받아들이는 충격적인 장면이다. 1막에서 이름이 상상했던 ‘고통받는 형’의 모습과 정반대다. 또 여름이 기억하려고 애쓰는 이야기가 ‘작은 초록 돼지’라는 점은 3막에서 크게 돌아온다.","lines":[{"k":"a","x":"( 감옥. 여름이 의자에 앉아, 옆방에서 들려오는 비명소리에 맞춰 허벅지를 손으로 딱딱 때리고 있다. 이름은 옆방에서 고문을 받으며 비명을 지르고 있다. 블랭킷이 놓인 얇은 매트리스와 베개 하나가 방바닥에 놓여있다. )","tag":"씬 시작"},{"k":"d","sp":["이여름"],"role":"","x":"'옛날 옛적에.. 한 기나긴 고지의 땅에..."},{"k":"a","x":"( 이름이 다시 비명을 지른다. 여름이 비명을 흉내 낸다. 비명소리가 사라질 때까지 길게. )","tag":"이 대사 후"},{"k":"d","sp":["이여름"],"role":"","x":"'옛날 옛적, 한 기나긴 고지의 땅에, 그러니까 작은 초록 돼지가... 아니 아니지.. 머나먼 고지의 땅에, 초록 돼지가 살았습니다. (사이) 그래, 머나먼 곳에, 한 작은 초록 돼지가..."},{"k":"a","x":"( 이름의 비명, 여름이 또 흉내 낸다, 이번에는 더 짜증을 낸다. )","tag":"이 대사 후"},{"k":"d","sp":["이여름"],"role":"","x":"야! 이이름! 조용히 좀 해. 그렇게 소리 지르면 작은 초록 돼지 이야기가 생각이 안 난단 말이야! (사이) 그 다음에 초록 돼지가 뭘 했더라?"},{"k":"a","x":"( 이름의 비명, 여름이 한숨을 쉰다. )","tag":"이 대사 후"},{"k":"d","sp":["이여름"],"role":"","x":"아, 왜 난 너처럼 이야기를 잘 하지 못할까. 어쨌든, 널 이제 그만 좀.. 고문했으면 좋겠다. 지루해. 여긴 너무 지루해."}],"pos":["Y:ch","I:cage"],"role":{}},{"id":"2-1-02","t":"이름이 감옥에 던져짐","pl":2,"light":["문에 집중할 수 있도록 핀 조명"],"sound":["없음"],"meaning":"여름이 박지철에게 엄지를 들어 보이는 행동이 이상하게 가볍다. 지금은 이유를 모르지만 곧 의미가 드러난다. 머리를 쓰다듬으려다 잘 안 되는 여름의 서툰 동작은 형이 동생을 챙기려는 모습이다.","lines":[{"k":"a","x":"( 옆방 문의 자물쇠가 열리는 소리. 여름이 듣는다. 여름의 방문이 따지는 소리가 들린다. 지철이 문을 열고 피가 흥건히 묻은 이름을 던져 넣는다. )","tag":"씬 시작"},{"k":"d","sp":["박지철"],"role":"","x":"금방 다시 올게, 저녁은 먹고 해야 할 거 아니야."},{"k":"a","x":"( 여름이 엄지손가락을 치켜세운다. 지철이 나가서 문을 잠그고는 떠난다. 여름이 이름을 쳐다본다. 이름은 바닥에서 떨고 있다. 이름에게 다가가 머리를 쓰다듬어 주려 하지만 잘 안 된다. 다시 의자에 앉는다. )","tag":"이 대사 후"}],"pos":["Y:ch","I:cageF","J:xr>cageF"],"role":{}},{"id":"2-1-03","t":"재회 — “난 고문 안 당했는데”","pl":2,"light":["(직전 씬 조명 유지) 문에 집중할 수 있도록 핀 조명"],"sound":["없음"],"meaning":"1막에서 관객이 믿던 ‘고문당하는 형’이 깨지는 첫 번째 반전이다. 비명이 형이 시킨 대로 지른 연기였다는 것이 밝혀진다. 하지만 여름의 ‘맹세’가 말장난이라는 건 아직 관객도 이름도 모른다.","lines":[{"k":"d","sp":["이여름"],"role":"","x":"안녕~"},{"k":"a","x":"( 이름이 고개를 들어 본다. 기어가서는 여름의 다리를 안는다. 여름이 뚫어져라 밑으로 내려다보며, 어색해한다. )","tag":"이 대사 후"},{"k":"d","sp":["이여름"],"role":"","x":"뭐하는 거야?"},{"k":"d","sp":["이이름"],"role":"","x":"형 다리 잡고 있잖아."},{"k":"d","sp":["이여름"],"role":"","x":"허. (사이) 왜?"},{"k":"d","sp":["이이름"],"role":"","x":"나도 몰라, 아파서 그래! 아플 때 형 다리 좀 잡으면 안 되는 거야?"},{"k":"d","sp":["이여름"],"role":"","x":"물론 되지. 그냥 좀 웃겨서"},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 형은 그래 좀 어때?"},{"k":"d","sp":["이여름"],"role":"","x":"좋아. 지루하긴 하지만. 맞아, 아까 막 소리 지르던데. 뭐하고 있었던 거야? 널 고문한 거야?"},{"k":"d","sp":["이이름"],"role":"","x":"응."},{"k":"a","x":"(혀를 찬다. 사이)","tag":"대사 중"},{"k":"d","sp":["이여름"],"role":"","x":"(혀를 찬다. 사이) 아팠어?"},{"k":"a","x":"( 이름이 여름의 다리를 놓는다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"형, 아프지 않다면, 고문이라고 하기 힘들겠지?"},{"k":"d","sp":["이여름"],"role":"","x":"엄청 아파 보여 지금."},{"k":"d","sp":["이이름"],"role":"","x":"형도 아팠어?"},{"k":"d","sp":["이여름"],"role":"","x":"뭐가?"},{"k":"d","sp":["이이름"],"role":"","x":"고문당했을 때 말이야"},{"k":"d","sp":["이여름"],"role":"","x":"난 고문 안 당했는데"},{"k":"d","sp":["이이름"],"role":"","x":"뭐?"},{"k":"a","x":"( 이름이 처음으로 고개를 돌려 형을 쳐다본다, 어디에도 상처나 멍은 없다. )","tag":"이 대사 후"},{"k":"d","sp":["이여름"],"role":"","x":"그 아저씨가 나한테 고문을 할 거라고 했어, 근데, 생각해 보니까 정말 아프겠더라고, 그럼 안 되잖아. 그래서 아저씨 원하는 거 다 내가 대답해 준다고 했지."},{"k":"d","sp":["이이름"],"role":"","x":"그럼 비명은 왜 지른 거야?"},{"k":"d","sp":["이여름"],"role":"","x":"그 아저씨가 시켰어. 정말 잘 한다고 칭찬도 받았는걸."},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 그 아이들을 죽인 건 아니라고 말해봐. 목숨 걸고 맹세해보라고"},{"k":"d","sp":["이여름"],"role":"","x":"그 아이들 안 죽였어, 목숨 걸고 맹세해."},{"k":"a","x":"( 이름이 긴 한숨을 쉰다. 형의 다리를 다시 안는다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"혹시 사인 같은 건 안 했어?"},{"k":"d","sp":["이여름"],"role":"","x":"어? 나 사인 같은 거 할 줄 몰라."},{"k":"d","sp":["이이름"],"role":"","x":"그럼 우리에게도 아직 희망이 있는 거야."},{"k":"d","sp":["이여름"],"role":"","x":"무슨 희망?"}],"pos":["Y:ch","I:flr>ch"],"role":{}},{"id":"2-1-04","t":"이름의 추리 — “이야기의 첫 번째 법칙”","pl":2,"light":["(직전 씬 조명 유지) 문에 집중할 수 있도록 핀 조명"],"sound":["없음"],"meaning":"이름이 형을 구하려고 짜낸 논리가 곧 이 나라의 ‘보도’가 경찰 손에 있다는 비판이 된다. 이름의 생각이 곧 이 극의 질문(무엇이 진실인가)이다. 다만 이름은 자기가 맞다고 믿고 있어서 곧 큰 충격을 받는다.","lines":[{"k":"a","x":"대본에 명시된 동선·행동 지문 없음","tag":"씬 시작"},{"k":"d","sp":["이이름"],"role":"","x":"여기서 아이들을 살해한 혐의로 사형당하지 않고 나갈 희망."},{"k":"d","sp":["이여름"],"role":"","x":"오. 아이들을 살해한 혐의로 사형당하지 않고 어떻게 나가는데?"},{"k":"d","sp":["이이름"],"role":"","x":"그들이 가진 혐의는 형이 했다는 그 자백하고, 우리 집에서 나왔다는 그것밖에 없는 거라고."},{"k":"d","sp":["이여름"],"role":"","x":"그게 뭔데?"},{"k":"d","sp":["이이름"],"role":"","x":"그놈들이 상자에 넣어온 발가락들. 아니야, 잠깐만, 그러니까 그게 발가락이라고 말한 건 그놈들이야. 그렇게 발가락처럼 생기지도 않았던데. 그래 모르는 거야. 젠장, (사이) 그 새끼가 형을 고문했다고 했어. 손에 피까지 묻혀서 들어왔었다고. 근데 형한테 손끝 하나 안 댔다며?"},{"k":"d","sp":["이여름"],"role":"","x":"응, 손끝 하나 안 댔고, 초코바는 하나 줬어. 껍질은 아저씨 주머니에 몰래 넣었지. 바닥에 버리면 안 되니까!"},{"k":"d","sp":["이이름"],"role":"","x":"우리가 멍청해서 당한 거야. 그놈들한테 한 방 먹은 거라고. 그들이 말하는 건 전부 거짓말이야."},{"k":"d","sp":["이여름"],"role":"","x":"왜?"},{"k":"d","sp":["이이름"],"role":"","x":"이건 이야기를 만드는 거랑 똑같은 거야!"},{"k":"d","sp":["이여름"],"role":"","x":"그래"},{"k":"d","sp":["이이름"],"role":"","x":"만약에 한 남자가 형한테 와서 당신 어머니가 죽었다고 말했다 쳐봐."},{"k":"d","sp":["이여름"],"role":"","x":"나도 우리 엄마가 돌아가신 건 알아."},{"k":"d","sp":["이이름"],"role":"","x":"아니, 그게 아니라 이야기 속에서. 한 남자가 다른 남자한테 가서 '당신 어머니가 죽었다'고 말했다 치자. 그럼 우린 정말 이 남자의 엄마가 죽었는지 알 수 있을까?"},{"k":"d","sp":["이여름"],"role":"","x":"그럼."},{"k":"d","sp":["이이름"],"role":"","x":"아니야, 모르는 거야."},{"k":"d","sp":["이여름"],"role":"","x":"아니야, 모르는 거야."},{"k":"d","sp":["이이름"],"role":"","x":"우리가 알 수 있는 건, 한 사람이 다른 사람한테 가서 '당신 엄마가 죽었다'고 말했다는 사실 하나밖에 없는 거야. 알 수 있는 건 그게 전부야. 이야기의 첫 번째 법칙 - 쓰인 것을 전부 믿어서는 안 된다."},{"k":"d","sp":["이여름"],"role":"","x":"쓰인 것을 전부 믿으면 안 된다. 난 신문도 안 보는데."},{"k":"d","sp":["이이름"],"role":"","x":"그래, 그래서 형은 세상 사람들보다 한 발 앞서 나갈 수 있는 거야."},{"k":"d","sp":["이여름"],"role":"","x":"무슨 말을 하고 싶어 하는 건지는 하나도 모르겠지만, 너 지금 되게 웃기다."},{"k":"d","sp":["이이름"],"role":"","x":"한 남자가 '방금 니 형이 세 명의 아이들을 살해했다고 자백했고, 이건 형 방에서 나온 그 아이들의 발가락이야'라고 한다면 뭘 알 수 있을까?"},{"k":"d","sp":["이여름"],"role":"","x":"아하~ 알겠다!"},{"k":"d","sp":["이이름"],"role":"","x":"형이 정말 아이들을 죽였다는 사실을 알 수 있을까?"},{"k":"d","sp":["이여름"],"role":"","x":"아니."},{"k":"d","sp":["이이름"],"role":"","x":"그렇지, 그럼 형이 정말 아이들을 죽였다는 사실을 자백했다는 사실은 알 수 있을까?"},{"k":"d","sp":["이여름"],"role":"","x":"아니."},{"k":"d","sp":["이이름"],"role":"","x":"그래그래, 그럼 그 집에서 아이들의 발가락이 나왔다는 사실을 알 수 있을까? 아니야. 그럼... 아니.. 세상에"},{"k":"d","sp":["이여름"],"role":"","x":"왜 그래?"},{"k":"d","sp":["이이름"],"role":"","x":"우린 죽은 아이들이 있는지 조차 알 수 없는 거야"},{"k":"d","sp":["이여름"],"role":"","x":"신문에 났다는데"},{"k":"d","sp":["이이름"],"role":"","x":"신문은 누구 손에 있지?"},{"k":"d","sp":["이여름"],"role":"","x":"경찰들. 오! 너 되게 똑똑하다."}],"pos":["Y:ch","I:flr"],"role":{}},{"id":"2-1-05","t":"새 소재의 발견과 “사인 하지 마”","pl":2,"light":["\"아니! 세상에!\"에서 이름을 비추는 조명을 순간적으로 조금 밝게 → 다음 대사 \"전체주의 국가의 한 작가가…\"부터 다시 원래 조명으로 복귀.","(이이름이 작가로서 새로운 이야기의 소재를 발견하는 순간)"],"sound":["없음"],"meaning":"죽을 위기에서도 이야기를 먼저 떠올리는 이름의 집착이 가장 잘 보이는 장면이다. 이름이 말한 ‘새 소재’는 사실 지금 두 사람과 관객이 보고 있는 이 극의 줄거리와 똑같다.","lines":[{"k":"d","sp":["이이름"],"role":"","x":"아니! 세상에! 전체주의 국가의 한 작가가 자신이 쓴 작품에 나오는 어두운 이야기와 그 동네 아이들의 살해사건과의 유사성으로 인해 심문을 받는다. 하지만 아이들의 살해 사건 같은 건 존재하지도 않았다. (사이) 이건 정말 멋진 소재야. 한 시간 안에 사형당하지만 않아도 멋진 이야기를 하나 만들 수 있을 텐데. (사이) 형, 내 말 잘 들어. 그놈들이 형한테 무슨 얘길 해도 사인만은 절대 하면 안 돼. 알았어?"},{"k":"d","sp":["이여름"],"role":"","x":"그들이 무슨 얘길 하더라도 난 사인하지 않을 거야. 절대 사인만은 하지 않는다. (사이) 근데, 니 이름은?"},{"k":"a","x":"(웃으며)","tag":"대사 중"},{"k":"d","sp":["이이름"],"role":"","x":"(웃으며) 내 이름은 특히 더 안 돼. 내 이름도 절대 안 돼!"},{"k":"d","sp":["이여름"],"role":"","x":"'난 아이들을 많~이 죽였습니다.' 성 이 이름 이름 사인 하!"},{"k":"d","sp":["이이름"],"role":"","x":"진짜... 형..."},{"k":"d","sp":["이여름"],"role":"","x":"'내 형, 이여름과는 특히 아무 연관도 없습니다, 눈곱만큼도' 이이름 사인 하!"},{"k":"d","sp":["이이름"],"role":"","x":"그럼 형은 나한테 아주 혼나는 줄 알아..."},{"k":"d","sp":["이여름"],"role":"","x":"혼내지 마..."}],"pos":["Y:ch","I:flr"],"role":{}},{"id":"2-1-06","t":"포옹, 머리 가려움, 이야기 청하기","pl":2,"light":["따뜻한 조명 전환만 유지.","( 두 사람이 안자마자 이이름이 \"아! 씨~ 형!\"이라고 말해야 해서 효과음이나 음악이 템포를 방해할 수 있음.)"],"sound":["가족애가 느껴지는 따뜻한 음악"],"meaning":"두 형제가 가장 가까워 보이는 장면이라 바로 뒤에 올 충격이 더 아프다. 머리가 가려운 것을 말하면 아픔이 사라진다는 이름의 말은 형에 대한 애정이 담긴 대사다.","lines":[{"k":"a","x":"( 이름이 형을 안는다. 여름도 같이 안는다. 하지만 너무 세게 안아 이름의 상처가 아파온다. )","tag":"씬 시작"},{"k":"d","sp":["이이름"],"role":"","x":"아! 씨~ 형!"},{"k":"d","sp":["이여름"],"role":"","x":"미안해"},{"k":"d","sp":["이이름"],"role":"","x":"괜찮아 (사이) 형, 걱정 마. 괜찮을 거야. 우리만 잘하면 여길 나갈 수 있어."},{"k":"d","sp":["이여름"],"role":"","x":"오늘 왜 이렇게 머리가 가렵지? 왠지 모르겠어. 그 파우더 남은 거 없어?"},{"k":"d","sp":["이이름"],"role":"","x":"없어. 형이 다 썼잖아."},{"k":"d","sp":["이여름"],"role":"","x":"음.. 근데 집에 가지러 갈 수도 없잖아. 어떡하지?"},{"k":"d","sp":["이이름"],"role":"","x":"못 가지."},{"k":"d","sp":["이여름"],"role":"","x":"그럼 머리가 계속 가려울 텐데."},{"k":"d","sp":["이이름"],"role":"","x":"머리가 가려울 때마다 계속 말해줘. 그 말만 들어도 왠지 아픔이 사라지는 것 같아."},{"k":"d","sp":["이여름"],"role":"","x":"진짜? 와! 아니야, 바보같이 굴지 좀 마. 머리가 가려운데 어떻게 아픔이 사라질 수 있어."},{"k":"d","sp":["이이름"],"role":"","x":"누구 머리냐에 따라 달라지는 거야."},{"k":"d","sp":["이여름"],"role":"","x":"뭐? 씨! 네가 있으니까 참아볼게. 근데 진짜 가렵다. 아~ (사이) 야, 이야기 하나만 들려줘. 그럼 잊을 수 있을 것 같아."},{"k":"d","sp":["이이름"],"role":"","x":"그래, 머리 가려운 거 잊을 수 있게 해줄게.. 무슨 이야기 듣고 싶어?"},{"k":"d","sp":["이여름"],"role":"","x":"음. 초록 돼지 얘기"},{"k":"a","x":"(어린아이 발음)","tag":"대사 중"},{"k":"d","sp":["이이름"],"role":"","x":"(어린아이 발음) 에이, 그건 너무 유치하잖아"},{"k":"a","x":"(어린아이 발음)","tag":"대사 중"},{"k":"a","x":"(보통 발음)","tag":"대사 중"},{"k":"d","sp":["이여름"],"role":"","x":"(어린아이 발음) 유치하지 않아 (보통 발음), 좋은 얘기야. '작은 초록 돼지 이야기' 그게 생각이 잘 안 나서 기억하려고 하고 있었어."},{"k":"d","sp":["이이름"],"role":"","x":"그래도 다른 이야기를 하나 해줄게, 뭐가 좋을까?"},{"k":"d","sp":["이여름"],"role":"","x":"그럼 필로우맨 해줘"},{"k":"a","x":"(웃는다)","tag":"대사 중"},{"k":"d","sp":["이이름"],"role":"","x":"(웃는다) 왜 그 이야기야?"},{"k":"a","x":"( 여름이 어깨를 으쓱한다. )","tag":"이 대사 후"}],"pos":["Y:ch","I:flr"],"role":{}},{"id":"2-1-07","t":"「필로우맨」 전반 — 베개 사나이와 행복한 소녀","pl":2,"light":["감옥 전체는 어둡지만 두 사람과 매트리스를 중심으로 볼 수 있도록 살짝 밝게"],"sound":["아주 희미한 저음과 바람 소리는 이야기 시작 직전에만 짧게 사용하고, 낭독 중에는 줄이기.","(감옥 안에서 둘만의 이야기로 넘어갈 수 있도록)"],"meaning":"이 이야기는 ‘불행을 막기 위해 아이의 죽음을 돕는’ 이야기다. 곧 이름이 이 이야기와 비슷한 행동을 하게 된다. 여름이 지루해하며 마지막만 듣고 싶어 하는 모습은 여름의 천진함을 보여 준다.","lines":[{"k":"d","sp":["이이름"],"role":"","x":"그건 아주 아주 오래된 이야기인데."},{"k":"d","sp":["이여름"],"role":"","x":"응, 아주 아주 오래된 이야기 해줘"},{"k":"d","sp":["이이름"],"role":"","x":"아주 오래전, 온몸이 분홍색 베개로 만들어진 거대한 남자가 살았어. 단추 눈에 언제나 웃는 얼굴. 바로 필로우맨이야."},{"k":"d","sp":["이여름"],"role":"","x":"베개라. 이름아, 너도 필로우맨처럼 한번 웃어봐."},{"k":"a","x":"(이름이 크게 웃자 여름이 이름의 볼을 만져본다.)","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"사람들에게 안도감을 주려고 늘 웃었어. 세상에서 가장 슬픈 일을 해야 했거든."},{"k":"a","x":"(들뜬 목소리로)","tag":"대사 중"},{"k":"d","sp":["이여름"],"role":"","x":"(들뜬 목소리로) 야~ 이제 시작이다."},{"k":"d","sp":["이이름"],"role":"","x":"필로우맨은 불행을 견디지 못해 죽으려는 사람을 찾아가 안아주며 말했어. \"잠깐만.\" 그러면 시간이 거꾸로 흘러, 아직 불행을 모르던 어린 시절로 돌아갔지. 그곳에서 앞으로 닥칠 고통을 피하도록 아이의 죽음을 도와주는 게 그의 일이었어."},{"k":"a","x":"(이름이 여름을 향해 몸을 조금 기울인다.)","tag":"이 대사 후"},{"k":"d","sp":["이여름"],"role":"","x":"그럼 아이들은 전부 필로우맨의 말을 들었어?"},{"k":"d","sp":["이이름"],"role":"","x":"아니. 한 행복한 소녀는 필로우맨의 말을 믿지 않았어. \"전 지금 행복해요. 앞으로도 그럴 거예요!\" 필로우맨은 울면서 돌아갔지. 하지만 소녀는 끔찍한 세월을 보냈고, 스물한 살이 되어 다시 필로우맨을 만났어. \"왜 그때 날 설득하지 못했어요?\" 필로우맨이 말했지. \" 넌 그때 너무 행복했어.\" 소녀는 대답했어. \"난 한 번도 행복해 본 적이 없어. 단 한 번도.\""},{"k":"a","x":"(여름이 웃음을 거두고 이름을 바라본다.)","tag":"이 대사 후"},{"k":"a","x":"(잠시 침묵한다.)","tag":"이 대사 후"},{"k":"d","sp":["이여름"],"role":"","x":"음, 야. 그냥 마지막 부분으로 넘어가면 안 될까? 이야기가 너무 지루하다."},{"k":"d","sp":["이이름"],"role":"","x":"이런 식으로 나오면 얘기 안 해준다!"},{"k":"d","sp":["이여름"],"role":"","x":"미안해. 근데 마지막 부분으로 넘어가자. 응?"}],"pos":["I:bedL","Y:bedR"],"role":{}},{"id":"2-1-08","t":"「필로우맨」 후반 — 불길과 비명","pl":2,"light":["① 어두운 붉은 조명 ON.","② 붉은 조명 OFF"],"sound":["\"필로우맨의 눈에서 크고 끈적끈적한 눈물이 떨어졌고\" 부분에 느린 물방울 소리 2~3회 추가 → \"다음날 밤 소녀의 방에…\"로 넘어가기 전에 OFF."],"meaning":"이 이야기의 결론은 ‘불행을 막으려는 죽음이 오히려 더 큰 비명이 되었다’는 것이다. 이름이 이 이야기를 들려준 뒤 형에게 하는 행동과 구조가 닮아 보이게 만든다. 여름은 이 이야기를 가장 좋아한다고 말한다.","lines":[{"k":"d","sp":["이이름"],"role":"","x":"(사이) 필로우맨은 늘 울었어. 성공하면 아이가 죽고, 실패하면 아이가 불행해졌으니까. 결국 마지막으로 한 번만 더 일하고 끝내기로 했지. 그리고 강가로 향했어."},{"k":"d","sp":["이여름"],"role":"","x":"난 이 부분이 제일 좋아."},{"k":"d","sp":["이이름"],"role":"","x":"강가엔 자동차, 장난감 강아지, 만화경이 있었어. 그때 한 소년이 나타났지. 바로 필로우맨 자신의 어린 시절, 필로우보이였어. 둘은 장난감을 가지고 놀았고, 필로우맨은 소년에게 앞으로 겪을 모든 불행을 들려줬지. 남을 돕고 싶었던 필로우보이는 그 말을 이해했어. 하지만 그 불행을 피하려고 스스로 몸에 불을 붙였지."},{"k":"a","x":"(이름이 바닥에 놓인 장난감을 가리키듯 손을 뻗는다.)","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"필로우보이는 불길 속에서도 웃고 있었어. 그 모습을 보며 필로우맨도 서서히 사라졌지. 그런데 마지막 순간, 끔찍한 소리가 들렸어."},{"k":"a","x":"(잠시 침묵한다.)","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"비명이었어. 필로우맨이 죽음을 도왔던 아이들이 모두 다시 살아나, 피했던 불행을 겪고 있었거든. 그 끝없는 비명이 필로우맨이 마지막으로 들은 소리였어."},{"k":"a","x":"(이름이 말을 멈추고 잠시 고개를 숙인다.)","tag":"이 대사 후"},{"k":"d","sp":["이여름"],"role":"","x":"음... 그럼 필로우맨은 그냥 사라진 거야?"},{"k":"d","sp":["이이름"],"role":"","x":"그냥 서서히 사라졌어. 마치 존재하지 않았던 것처럼."},{"k":"d","sp":["이여름"],"role":"","x":"천국으로?"},{"k":"d","sp":["이이름"],"role":"","x":"아니, 어딘가로. 허공으로..."},{"k":"d","sp":["이여름"],"role":"","x":"난 필로우맨이 좋아. 내가 제일 좋아하는 이야기야."}],"pos":["I:bedL","Y:bedR"],"role":{}},{"id":"2-1-09","t":"여름의 고백 — “발가락을 넣은 상자”","pl":2,"light":["① 이야기 전용 조명 OFF → 감옥 조명으로 복귀하되 짧은 붉은빛으로 반전 강조.","② 이이름의 얼굴이 더 창백하게 보이도록 약한 푸른 조명 추가 → 이름이 고개를 끄덕인 후 원래 감옥 조명으로 복귀."],"sound":["“정말 잘 숨겼다고 생각했는데” 이후 충격음은 1회만 사용"],"meaning":"관객이 믿어 온 ‘형은 죄가 없다’가 한 번에 깨지는 가장 큰 반전이다. ‘네 목숨을 걸고’ 같은 말장난을 이용해 속이는 것은 순수해 보이는 여름이 오히려 더 무섭게 보이게 만든다.","lines":[{"k":"d","sp":["이이름"],"role":"","x":"제일 좋아하기에는 좀 우울하긴 하지. 아, 가려운 머리는 괜찮아?"},{"k":"a","x":"(머리를 흔드며)","tag":"대사 중"},{"k":"d","sp":["이여름"],"role":"","x":"어 씨, 말하기 전까지는 괜찮았는데, 왜 기억나게 해. 아~ (머리를 흔드며) 음. 근데 그래도 잘 모르겠어."},{"k":"d","sp":["이이름"],"role":"","x":"뭘? 뭘 모르겠는데. '필로우맨'?"},{"k":"d","sp":["이여름"],"role":"","x":"아니, 내가 굉장히 잘 숨긴 줄 알았거든."},{"k":"d","sp":["이이름"],"role":"","x":"뭘 잘 숨겨?"},{"k":"d","sp":["이여름"],"role":"","x":"발가락을 넣은 그 상자. 정말 잘 숨겼다고 생각했는데."},{"k":"d","sp":["이여름"],"role":"","x":"처음엔 옷장에 숨겼는데 냄새가 나서 초록 돼지 이야기 상자에 옮겼어. 넌 오래된 이야기 상자는 잘 안 보잖아. 곰팡이가 다 먹어줄 줄 알았는데. 아까 그 상자에 곰팡이가 많지 않았어?"},{"k":"a","x":"( 이름이 끄덕인다. 표정이 마치 생명이 다 빠져 나간 사람 같다. )","tag":"이 대사 후"},{"k":"d","sp":["이여름"],"role":"","x":"경찰 아저씨들이 데리고 다니는 그 냄새 잘 맡는 개를 썼나봐. 내가 진짜 머리를 잘 써서 숨긴 거였는데. 나 머리 잘 썼지? 어. 네 이야기 상자, 창고에 있는지 한참 됐잖아."},{"k":"d","sp":["이이름"],"role":"","x":"형 좀 전에 나한테 말했잖아. 그 아이들을 죽인 게 아니라고. 나한테 거짓말한 거야?"},{"k":"d","sp":["이여름"],"role":"","x":"아니야. 난 그 아저씨가 와서 그 아이들을 죽였다고 자백하지 않으면, 고문한다고 하길래, 내가 죽였다고 말했다 그랬지. 내가 아이들을 실제로 안 죽였다고 말한 건 아니잖아. 나 죽였어 그 아이들"},{"k":"d","sp":["이이름"],"role":"","x":"나한테 맹세까지 했어, 목숨 걸고. 그 아이들을 죽인 게 아니라고"},{"k":"d","sp":["이여름"],"role":"","x":"아, 그거! 그건... 니 목숨을 걸고 맹세한 거야. 내 목숨을 걸라고 하진 않았잖아. 흐흐 나 똑똑하지. 이이름~ 미안해"},{"k":"a","x":"( 이름이 매트리스 쪽으로 뒷걸음질친다. )","tag":"이 대사 후"}],"pos":["I:flr>bedL","Y:ch"],"role":{}},{"id":"2-1-10","t":"아이들에게 한 일 — “이야기를 시험해 본 거야”","pl":2,"light":["(직전 씬 조명 유지) 이이름의 얼굴이 더 창백하게 보이도록 약한 푸른 조명 추가 → 이름이 고개를 끄덕인 후 원래 감옥 조명으로 복귀."],"sound":["없음"],"meaning":"여름이 악의 없이 이야기를 ‘시험’했다는 점이 오싹하다. ‘이야기가 폭력을 불러올 수 있는가’라는 이 극의 가장 큰 질문이 인물의 입으로 처음 직접 나온다. 여름의 ‘예쁜 이야기는 없었다’는 대답은 이름 스스로도 반박하기 어렵다.","lines":[{"k":"d","sp":["이여름"],"role":"","x":"뭐, 그러면 안 되는 건 알았지만 신기했어. 그 남자아이, 네 이야기랑 똑같더라. 발가락을 잘라도 비명 한 번 안 지르고 날 보더라고. 엄마한테 보내달라던데, 결국 조용해졌어. 여자애는 사과 조각을 안 먹으려고 울어댔어. 면도날을 넣느라 고생했는데 말이야. 억지로 먹이니까 금세 조용해지더라. (사이) 근데 옷에 묻은 피는 잘 안 지워져. 내가 빨아줄까? 이제 잘하는데."},{"k":"a","x":"( 이름이 여름에게서 한 걸음 더 물러난다. )","tag":"이 대사 후"},{"k":"a","x":"(사이, 속삭이듯이)","tag":"대사 중"},{"k":"d","sp":["이이름"],"role":"","x":"(사이, 속삭이듯이) 뭐 때문에 그런 짓을 한 거야?"},{"k":"d","sp":["이여름"],"role":"","x":"뭐라는 거야, 말을 똑바로 해야지"},{"k":"a","x":"(울며)","tag":"대사 중"},{"k":"d","sp":["이이름"],"role":"","x":"(울며) 뭐 때문에 그런 짓을 한 거냐고?"},{"k":"d","sp":["이여름"],"role":"","x":"울지 마 이름아, 울지 마."},{"k":"a","x":"( 여름이 가서 동생을 안는다. 이름이 혐오감에 치를 떨며 뿌리친다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"왜 그랬어?"},{"k":"d","sp":["이여름"],"role":"","x":"어? 니가 그러라고 그랬잖아"},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 내가 뭐?"},{"k":"d","sp":["이여름"],"role":"","x":"니가 나한테 그러라고 그랬잖아"},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 내가 형한테 숙제하라고, 매일 밤 자기 전에 꼭 이빨 닦고 자라고 그랬지, 언제 /"},{"k":"d","sp":["이여름"],"role":"","x":"나 매일 밤 이빨 잘 닦아 /"},{"k":"d","sp":["이이름"],"role":"","x":"내가 언제 형한테 조그만 아이들을 다 찢어 갈기고 다니라고 했어?"},{"k":"d","sp":["이여름"],"role":"","x":"찢어 갈긴 적 없어. 찢어 갈기려면 이렇게..."},{"k":"a","x":"( 여름이 누군가를 찢어 갈기는 동작을 취한다. )","tag":"이 대사 후"},{"k":"d","sp":["이여름"],"role":"","x":"난 그렇게 한 게 아니고. 이렇게"},{"k":"a","x":"( 여름이 한칼에 발가락을 내리치고, 발가락들을 주어서는 던지는 동작을 취한다. )","tag":"이 대사 후"},{"k":"d","sp":["이여름"],"role":"","x":"또..."},{"k":"a","x":"( 여름이 목으로 사과 조각을 넣어서는 꿀꺽 삼키는 시늉을 한다. )","tag":"이 대사 후"},{"k":"d","sp":["이여름"],"role":"","x":"찢어 갈기다니, 그건 너무 심한 표현이야. 니가 이야기 안 했으면 그런 짓은 하지도 않았을 거야. 그러니까 혼자 억울한 척하지 마. 니가 나한테 들려주는 이야기는 다 누군가가 다른 사람한테 끔찍한 짓을 하는 거잖아. 난 그냥 그 이야기들이 가능한지 시험해 본 거밖에 없어. 내 생각에는 불가능한 것 같았거든. (사이) 근데 그거 알아? 생각보단 하나도 안 힘들더라고"},{"k":"d","sp":["이이름"],"role":"","x":"왜 예쁜 이야기들도 있잖아. 왜 그런 건 시험 안 해봤어?"},{"k":"d","sp":["이여름"],"role":"","x":"예쁜 게 어디 있었어?"},{"k":"d","sp":["이이름"],"role":"","x":"형은 가학적인 변태, 정신병자야! 아이들을 죽이면서 돌아다니는 게 재밌지? 세상에서 가장 아름답고 예쁜 이야기들만 들려줬었어도 형은 애들을 죽였을 거야."},{"k":"d","sp":["이여름"],"role":"","x":"그래? 근데 그건 모르지. 왜냐면 넌 그런 이야기는 못하니까. (사이) 그리고 난 뭐 재밌어서 그런 줄 알아? 나도 정말 기분 나빴다고. 죽이려고 한 것도 아니야. 그냥 발가락을 잘라보고, 면도날 먹여본 게 전부라고."},{"k":"d","sp":["이이름"],"role":"","x":"그럼 형은 어린 아이의 발가락을 다 자르고, 목에 면도날을 쑤셔 넣고도 아이들이 멀쩡할 줄 알았다는 거야?"},{"k":"d","sp":["이여름"],"role":"","x":"이젠 알았잖아. 그만해."},{"k":"a","x":"( 여름 머리를 쥐어뜯는다. 이 상황에서 벗어날 방법을 강구해 보려고. )","tag":"이 대사 후"}],"pos":["I:bedL","Y:flr"],"role":{}},{"id":"2-1-11","t":"“난 사실대로 말했어” — 그리고 ‘그냥 종이’","pl":2,"light":["(직전 씬 조명 유지) 이이름의 얼굴이 더 창백하게 보이도록 약한 푸른 조명 추가 → 이름이 고개를 끄덕인 후 원래 감옥 조명으로 복귀."],"sound":["없음"],"meaning":"이름이 가장 소중하게 여기는 것을 여름이 ‘그냥 종이’라고 부르자 이름이 폭력으로 폭발한다. 이름이 형에게 처음으로 몸으로 폭력을 쓰는 순간이다. 여름의 단순한 말이 이름의 가장 아픈 곳을 건드린 것이다.","lines":[{"k":"d","sp":["이여름"],"role":"","x":"그 고문하겠다던 아저씨는 확실히 내 편이던데 뭐. 그 아저씨도 이건 다 니 잘못이라고 그랬어."},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 뭐라고 얘기 했는데?"},{"k":"d","sp":["이여름"],"role":"","x":"사실대로"},{"k":"d","sp":["이이름"],"role":"","x":"그러니까 사실 중에 어떤 부분"},{"k":"d","sp":["이여름"],"role":"","x":"그냥 사실대로, 내가 아이들한테 한 짓 전부랑, 그게 다 니가 나한테 들려준 이야기대로 한 거라고."},{"k":"d","sp":["이이름"],"role":"","x":"그걸 저 형사들한테 이야기했다고?"},{"k":"d","sp":["이여름"],"role":"","x":"응, 그래, 그냥 진실만"},{"k":"d","sp":["이이름"],"role":"","x":"형, 그건 진실이 아니야."},{"k":"d","sp":["이여름"],"role":"","x":"진실이야."},{"k":"d","sp":["이이름"],"role":"","x":"아니라니까"},{"k":"d","sp":["이여름"],"role":"","x":"니가 아이들 죽이는 이야기를 쓴 건 사실이잖아."},{"k":"d","sp":["이이름"],"role":"","x":"그건 그렇지만..."},{"k":"d","sp":["이여름"],"role":"","x":"니가 그 이야기를 나한테 들려줬잖아."},{"k":"d","sp":["이이름"],"role":"","x":"그래, 그건 맞는데..."},{"k":"d","sp":["이여름"],"role":"","x":"그래, 난 니가 뭐가 진실이 아니라는 건지 도대체 모르겠어. 방금 전 그 필로우맨 이야기도, 평생 아이들을 찾아다니며 죽이고 태우고 그랬다는 거잖아. 물론 그 필로우맨이 마음에 안 든다는 거는 아냐, 훌륭한 사람이지, 엄청엄청. 있잖아, 생각해보니까 나랑 비슷한 것 같은데"},{"k":"d","sp":["이이름"],"role":"","x":"뭐가 형 같은데?"},{"k":"d","sp":["이여름"],"role":"","x":"아이들 죽여주는 거"},{"k":"d","sp":["이이름"],"role":"","x":"형, 그 아이들은 불행한 인생을 살다가 어차피 끔찍한 죽음을 맞이할 사람들이었다고"},{"k":"d","sp":["이여름"],"role":"","x":"맞아, 모든 아이들은 다 불행한 인생을 살게 되니까. 그러니까 빨리 죽여주는 게 꼭 나쁜 건 아니지."},{"k":"d","sp":["이이름"],"role":"","x":"모든 아이들이 다 불행한 삶을 사는 건 아냐."},{"k":"d","sp":["이여름"],"role":"","x":"음.. 흠... 넌 어려서부터 불행한 삶을 살았잖아? 불행했지. 그래.. 음.. 그럼 나는 불행한 삶을 살지 않았나? 나도 불행했어. 둘 중에 둘이면 백 프로 아닌가?"},{"k":"d","sp":["이이름"],"role":"","x":"필로우맨은 자신에게 주어진 일을 정말 싫어했던, 사려 깊고 따듯한 인물이었어. 형은 모든 면에서 그 반대잖아."},{"k":"d","sp":["이여름"],"role":"","x":"그러니까 (사이) 필로우맨은 꽤 잘 쓴 이야기라고 말하고 싶은 거지? 맞아, 니가 쓴 거 중 최고지. 넌 유명해질 거야. 언젠가는 아주 유명한 작가가 될지도 몰라. 안 그래?"},{"k":"d","sp":["이이름"],"role":"","x":"우린 한 시간 반 뒤면 사형될 거야"},{"k":"d","sp":["이여름"],"role":"","x":"그럼 유명한 작가가 되긴 글렀네."},{"k":"d","sp":["이이름"],"role":"","x":"저 새끼들이 우릴 완전히 짓밟으려고 하고 있어. 우리만 죽이는 게 아니라 내 이야기까지도 모두 없애버릴지도 몰라. 전부 다"},{"k":"d","sp":["이여름"],"role":"","x":"우리만 걱정하면 되겠는데, 그 이야기들은 다 필요 없으니까."},{"k":"d","sp":["이이름"],"role":"","x":"뭐?"},{"k":"d","sp":["이여름"],"role":"","x":"왜, 그건 그냥 종이잖아"},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 그냥 뭐라고?"},{"k":"a","x":"(종이를 집어 팔랑팔랑 흔들며)","tag":"대사 중"},{"k":"d","sp":["이여름"],"role":"","x":"그냥 종이라고 (종이를 집어 팔랑팔랑 흔들며)"},{"k":"a","x":"( 이름이 여름의 머리를 잡아 바닥에다가 세게 내동댕이친다. 여름은 동생의 행동에 놀라 고통을 느낄 정신도 없다. 자기 머리에서 피가 나는 것을 본다. )","tag":"이 대사 후"}],"pos":["I:bedL","Y:flr"],"role":{}},{"id":"2-1-12","t":"“너도 엄마 아빠랑 똑같아!”","pl":2,"light":["(직전 씬 조명 유지) 이이름의 얼굴이 더 창백하게 보이도록 약한 푸른 조명 추가 → 이름이 고개를 끄덕인 후 원래 감옥 조명으로 복귀."],"sound":["없음"],"meaning":"서로가 서로의 부모를 닮았다고 말하는, 가장 아픈 말다툼이다. 이름이 형을 ‘부모의 복제품’이라고 부르는 순간 이름 스스로도 선을 넘는다. “난 일곱 살이 아니야”라는 말은 어렸을 때 형의 비명을 듣기만 했던 자신을 말한다.","lines":[{"k":"d","sp":["이이름"],"role":"","x":"만약 저들이 지금이라도 와서 형과 나 그리고 내 이야기 중 둘을 태워야 한다고 말한다면, 일단 형부터 태워 죽여 버리라고 할 거야. 다음은 나, 난 내 이야기를 살릴 거야."},{"k":"d","sp":["이여름"],"role":"","x":"내 머리를 바닥에다가 던졌어?"},{"k":"d","sp":["이이름"],"role":"","x":"그래서"},{"k":"d","sp":["이여름"],"role":"","x":"내 머리를 바닥에다가 던졌냐고!"},{"k":"d","sp":["이이름"],"role":"","x":"그래 던졌어 그래서 뭐"},{"k":"d","sp":["이여름"],"role":"","x":"너도 엄마아빠랑 똑같아!"},{"k":"a","x":"(웃으며)","tag":"대사 중"},{"k":"d","sp":["이이름"],"role":"","x":"(웃으며) 다시 말해봐?!"},{"k":"d","sp":["이여름"],"role":"","x":"너도 엄마아빠랑 똑같다고. 때리고 소리 지르고!"},{"k":"d","sp":["이이름"],"role":"","x":"내가 엄마아빠랑 똑같다고? 어디 한 번 정리 좀 해보자 /"},{"k":"d","sp":["이여름"],"role":"","x":"그만해."},{"k":"d","sp":["이이름"],"role":"","x":"우리 엄마아빠는 자기 자식을 방에다가 가두고 칠 년 동안 고문했던 사람들이었어. 형은? 형은 어린 소년의 발가락을 다 잘라 피 흘려 죽게 했고, 작은 소녀의 목에 억지로 면도날을 집어넣어 죽였어. 또 세 번째 아이에게 무슨 짓을 해서 죽였는지 하느님만 아시겠지만... 그런데 형이 아니라 내가 엄마 아빠랑 똑같다고. 형 머리를 바닥에 한 번 던져서?"},{"k":"d","sp":["이여름"],"role":"","x":"그래 똑같아, 완전히 똑같아."},{"k":"d","sp":["이이름"],"role":"","x":"이제야 형을 좀 알 것 같다. 형이 왜 그렇게 됐는지 이제 이해가 돼."},{"k":"d","sp":["이여름"],"role":"","x":"그래, 넌 날 좀 이해해야 돼."},{"k":"d","sp":["이이름"],"role":"","x":"아빠 엄마가 하늘에서 우릴 지금 내려보고 있다면, 아주 행복해 할 거야. 형이 그들이 원하던 그런 자식으로 완벽하게 자라 줬으니까..."},{"k":"d","sp":["이여름"],"role":"","x":"그러지마..."},{"k":"d","sp":["이이름"],"role":"","x":"정말 자랑스러워하실 거야. 형은 그들의 완벽한 복제품 같으니까. 형도 안경 쓰고 염소수염을 길러보지. 죽은 우리 아빠처럼 말이야."},{"k":"d","sp":["이여름"],"role":"","x":"조용히 해!"},{"k":"a","x":"(엄마 말투를 흉내 낸다.)","tag":"대사 중"},{"k":"d","sp":["이이름"],"role":"","x":"아니면 다이아몬드를 많이 하거나 엄마처럼. (엄마 말투를 흉내 낸다.) 말도 이런 식으로 하고.. 내 아들~"},{"k":"d","sp":["이여름"],"role":"","x":"조용히 안 하면 죽여 버릴 거야!!"},{"k":"d","sp":["이이름"],"role":"","x":"형이 날 어떻게 죽일 건데? 난 일곱 살이 아니야"},{"k":"d","sp":["이여름"],"role":"","x":"난 아무도 다치게 하고 싶지 않았어. 이야기를 시험해 본 죄밖에 없다고."}],"pos":["I:bedL","Y:flr"],"role":{}},{"id":"2-1-13","t":"세 번째 아이 — 「어린 예수」와 소원의 우물","pl":2,"light":["(직전 씬 조명 유지) 이이름의 얼굴이 더 창백하게 보이도록 약한 푸른 조명 추가 → 이름이 고개를 끄덕인 후 원래 감옥 조명으로 복귀."],"sound":["없음"],"meaning":"여름이 칭찬하는 말투로 말하는 것이 이름을 더 크게 무너뜨린다. 여기서 말하는 ‘세 번째 아이를 어떻게 죽였는가’는 3막에서 크게 뒤집힌다.","lines":[{"k":"d","sp":["이이름"],"role":"","x":"도대체 세 번째 아이한텐 무슨 짓을 했어?"},{"k":"d","sp":["이여름"],"role":"","x":"말 안 해. 기분을 이렇게 다 망쳐놓고. 내 머리도 던지고 /"},{"k":"d","sp":["이이름"],"role":"","x":"저놈들이 고문하면, 바로 다 불 거면서."},{"k":"d","sp":["이여름"],"role":"","x":"참을 수 있어."},{"k":"d","sp":["이이름"],"role":"","x":"형이 참긴 뭘 참아."},{"k":"a","x":"(낮게)","tag":"대사 중"},{"k":"d","sp":["이여름"],"role":"","x":"(낮게) 넌 고문이 어떤 건지 하나도 몰라."},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 그래 모른다. 몰라"},{"k":"d","sp":["이여름"],"role":"","x":"니가 옆방에서 비명소리를 지를 때 무슨 생각을 했는지 알아? 칠 년 동안 니가 옆방에서 들려오는 내 비명을 들으며 어땠는지 알 것 같았어. 하나 알려줄게. 니 방이 훨씬 편해."},{"k":"d","sp":["이이름"],"role":"","x":"그건 나도 알아..."},{"k":"d","sp":["이여름"],"role":"","x":"겨우 한 시간 고문당하고 이렇게 울고, 엄살 떨면서. 평생 한 번 당해봐."},{"k":"d","sp":["이이름"],"role":"","x":"그렇다고 사람을 죽여?"},{"k":"d","sp":["이여름"],"role":"","x":"너도 죽였잖아 두 명이나! 그건 괜찮고?"},{"k":"d","sp":["이이름"],"role":"","x":"난 칠년 동안 자식을 고문한 사람들을 죽인 거야. 형은 아무 잘못도 없는 어린 아이 셋을 죽인 거잖아. 그건 엄청난 차이야"},{"k":"d","sp":["이여름"],"role":"","x":"그 아이들이 아무 죄가 없다고 누가 그래? 그 소녀는 처음부터 아주 속물이던데 뭐. 아마 개미들도 몇천 마리는 죽였을걸."},{"k":"d","sp":["이이름"],"role":"","x":"세 번째 아이는 어떻게 죽였어? 말 좀 해봐. 그 아이도 이야기대로 죽인거야?"},{"k":"d","sp":["이여름"],"role":"","x":"응"},{"k":"d","sp":["이이름"],"role":"","x":"어느 이야기?"},{"k":"d","sp":["이여름"],"role":"","x":"들으면 안 좋아할 텐데."},{"k":"d","sp":["이이름"],"role":"","x":"화 안 낼게 말해봐."},{"k":"d","sp":["이여름"],"role":"","x":"화낼 거 같은데, 음... 어린 여자애였고... 아 그거야. '작은 예수 이야기'"},{"k":"a","x":"( 이름이 여름을 한동안 보다가 자신의 얼굴을 손으로 가린다. 자신이 쓴 이야기의 끔찍한 정황들을 기억해 보더니 서서히 울기 시작한다. 여름이 뭔가를 이야기하려고 하지만, 여름이 조용히 울고 있자, 말을 꺼내지 못한다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"왜 하필이면 그 이야기야?"},{"k":"a","x":"(어깨를 들썩하며)","tag":"대사 중"},{"k":"d","sp":["이여름"],"role":"","x":"(어깨를 들썩하며) 멋진 이야기니까. 넌 참 좋은 작가야. 다른 사람이 뭐라 그래도 신경 쓸 거 없어."},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 그 아인 어딨어?"},{"k":"d","sp":["이여름"],"role":"","x":"네가 엄마 아빠를 묻은 바로 그 장소. 소원의 우물 뒤에."},{"k":"d","sp":["이이름"],"role":"","x":"그 쓰레기 같은 곳에!"},{"k":"d","sp":["이여름"],"role":"","x":"맞아, 별로지."},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 시간은 오래 안 끌었지?"},{"k":"d","sp":["이여름"],"role":"","x":"뭐 적당히."}],"pos":["I:bedL","Y:bedR"],"role":{}},{"id":"2-1-14","t":"천국과 옛집 — 이름의 가장 아픈 말","pl":2,"light":["(직전 씬 조명 유지) 이이름의 얼굴이 더 창백하게 보이도록 약한 푸른 조명 추가 → 이름이 고개를 끄덕인 후 원래 감옥 조명으로 복귀."],"sound":["없음"],"meaning":"이름이 형을 ‘사랑했다’고 과거형으로 말해 형을 가장 아프게 찌르는 장면이다. 이 말에 대한 ‘용서’ 이야기가 뒤에서 이어진다.","lines":[{"k":"a","x":"( 이름이 다시 울기 시작한다. 여름이 이름의 어깨에 손을 올려놓는다. )","tag":"씬 시작"},{"k":"d","sp":["이여름"],"role":"","x":"울지 마. 야~. 괜찮을 거야"},{"k":"d","sp":["이이름"],"role":"","x":"아니 괜찮긴 뭐가 괜찮아? 도대체 어떻게 괜찮아질 수가 있어?"},{"k":"d","sp":["이여름"],"role":"","x":"글쎄, 다들 이런 때는 이 말을 하던데. 우릴 따로 죽일까? 꼭 같이 해줬으면 좋겠는데. 난 혼자 죽긴 정말 싫어."},{"k":"d","sp":["이이름"],"role":"","x":"난 아무 죄도 없어!"},{"k":"d","sp":["이여름"],"role":"","x":"야, 이제 그러지 좀 마. 정말 짜증나려고 그래. 아, 천국은 어떤 곳일까? 하나님하고 놀고, 장난도 치고, 달리기 시합도 하고.."},{"k":"d","sp":["이이름"],"role":"","x":"천국? 형 죽으면 어디로 가는지 알고 싶어?"},{"k":"d","sp":["이여름"],"role":"","x":"어딘데? 기분 안 좋다고 끔찍한 데라고 둘러대진 마."},{"k":"d","sp":["이이름"],"role":"","x":"형은 죽으면 우리가 같이 살던 옛날 집으로 돌아갈 거야. 엄마 아빠는 언제나 그랬던 것처럼 형을 고문해 주겠지. 예전과 다른 점은 내가 형을 구할 수 없다는 거야. 왜냐면 난 그곳에 없을 거거든. 난 불쌍한 아이들을 찢어 갈기고 다니지 않았으니까."},{"k":"d","sp":["이여름"],"role":"","x":"어떻게 나한테 그런 말을 할 수가 있어? 다시는 나한테 말도 걸지 마! 한마디도 안 할 거니까!"},{"k":"d","sp":["이이름"],"role":"","x":"그러던가. 그럼 이제 사형당할 때까지 조용히 앉아서 기다리면 되겠네."},{"k":"d","sp":["이여름"],"role":"","x":"내가 끔찍한 얘기는 하지 말라고까지 했는데, 그렇게 부탁까지 했는데. 넌 다 알면서 내 기분이 어떨지 다 알면서"},{"k":"d","sp":["이이름"],"role":"","x":"한때 형을 정말 사랑했는데"},{"k":"d","sp":["이여름"],"role":"","x":"(사이) 했다니... 그게 무슨 말이야? 그럼 이제 사랑 안 한다는 거야? 그건 더 심한 말이잖아. 어떻게 그렇게 심한 말을 또 할 수가 있어. 진짜!"},{"k":"d","sp":["이이름"],"role":"","x":"조용히 기다리기나 하자고."},{"k":"d","sp":["이여름"],"role":"","x":"난 조용히 기다리려고 하는데, 니가 자꾸 심한 말을 하는 거잖아. (사이) 내 말 안 들려? 오 그러셔, 조용히 기다리는 중이신가 보지. 좋아"}],"pos":["I:bedL","Y:bedR"],"role":{}},{"id":"2-1-15","t":"‘작가와 작가의 형제’의 결말과 해피엔딩","pl":2,"light":["(직전 씬 조명 유지) 이이름의 얼굴이 더 창백하게 보이도록 약한 푸른 조명 추가 → 이름이 고개를 끄덕인 후 원래 감옥 조명으로 복귀."],"sound":["없음"],"meaning":"이 극에서 ‘해피엔딩’이 무엇인지 처음으로 서로 다르게 말하는 장면이다. 마지막 대사 “이건 해피엔딩이야, 그치?”가 이 대화의 답처럼 들린다. 이름이 ‘이야기가 전부’라고 말하자 여름이 “내가 있잖아”라고 대답하는 것이 가장 아픈 한마디다.","lines":[{"k":"a","x":"( 사이, 여름 머리를 긁는다. 사이 )","tag":"씬 시작"},{"k":"d","sp":["이여름"],"role":"","x":"죽기 전에 꼭 할 말이 좀 있어. 얼마 전에 '작가와 작가의 형제'? 그 쓰레기 같은 이야기 읽었는데 정말 심하더라. 내가 여태껏 읽어본 것 중 제일 그지 같은 이야기야."},{"k":"d","sp":["이여름"],"role":"","x":"내가 죽고 엄마 아빠가 살았다고? 그런 거짓말을 왜 써? 완전히 멍청이가 쓴 쓰레기 아니야."},{"k":"d","sp":["이이름"],"role":"","x":"지금 살인마한테 문학 강의까지 들어야 하나."},{"k":"d","sp":["이여름"],"role":"","x":"왜 끝을 해피엔딩으로 끝내지 않았어? 진짜처럼. 내 이야기는 해피엔딩이었잖아. 니가 날 구했고. 나쁜 엄마 아빠를 죽여줬잖아. 그거야말로 해피엔딩이지."},{"k":"d","sp":["이이름"],"role":"","x":"그리곤 어떻게 됐지?"},{"k":"d","sp":["이여름"],"role":"","x":"그리곤, 엄마 아빠를 소원의 우물 뒤에 묻었지."},{"k":"d","sp":["이이름"],"role":"","x":"그 다음엔?"},{"k":"d","sp":["이여름"],"role":"","x":"그 다음이라? 어..."},{"k":"d","sp":["이이름"],"role":"","x":"그 다음엔? 그러니까 삼주 전에는 무슨 일이 있었지?"},{"k":"d","sp":["이여름"],"role":"","x":"아, 그때 아이들을 죽였어."},{"k":"d","sp":["이이름"],"role":"","x":"아이들을 죽였지. 그래, 그게 어떻게 좆같은 해피엔딩이 되냐고? 그 다음엔 잡혀서 이제 사형당하는 거야. 형만 죽는 게 아니라, 아무런 잘못도 없는 동생까지 끌고 들어가서 같이 사형당하는 게, 그게 어떻게 해피엔딩이냐고?"},{"k":"d","sp":["이여름"],"role":"","x":"내가 죽어서 혼자 썩어가는 건? 그것도 해피엔딩이 아니야!"},{"k":"d","sp":["이이름"],"role":"","x":"해피엔딩이야."},{"k":"a","x":"(거의 울면서)","tag":"대사 중"},{"k":"d","sp":["이여름"],"role":"","x":"(거의 울면서) 죽어서 혼자 썩어간다는 게 도대체 어떻게 해피엔딩이 돼?"},{"k":"d","sp":["이이름"],"role":"","x":"형이 죽었을 때 형 손에 남겨진 게 뭐였어? 이야기야 형, 내가 쓴 것과는 비교도 안 되는 엄청난 이야기. 제목을 잘 봐 '작가와 작가의 형제' 거기서 작가는 내가 아니라 형이었던 거야, 난 작가의 형제고. 그게 바로 형을 위해 만든 나의 해피엔딩이라고."},{"k":"d","sp":["이여름"],"role":"","x":"하지만 난 죽었잖아"},{"k":"d","sp":["이이름"],"role":"","x":"사느냐 죽느냐에 대한 이야기가 아니야. 뭘 남기고 가느냐에 대한 이야기지."},{"k":"d","sp":["이여름"],"role":"","x":"아 몰라."},{"k":"d","sp":["이이름"],"role":"","x":"지금도 날 죽이는 건 상관없어. 아무 상관없다고. 하지만 내 이야기들은 죽이면 안 돼. 난 이야기를 살려야겠어. 그 이야기들은 나한텐 전부라고."},{"k":"d","sp":["이여름"],"role":"","x":"(사이) 내가 있잖아"},{"k":"a","x":"( 이름이 잠시 형을 쳐다보더니, 슬프게 고개를 떨군다. 여름이 울며 고개를 돌린다. )","tag":"이 대사 후"}],"pos":["I:bedL","Y:bedR"],"role":{}},{"id":"2-1-16","t":"거짓 약속과 ‘안전한 이야기’ 고르기","pl":2,"light":["무대 구석에 아주 희미한 초록빛을 1회 켰다가 끄기"],"sound":["없음"],"meaning":"3막의 가장 큰 반전의 씨앗이다. ‘초록’, ‘초록색 페인트’, ‘안전한 이야기’가 모두 이 대화에 나온다. 관객은 여기서는 별 뜻 없는 농담으로 듣게 된다. 이름이 “태워 버릴게”라고 거짓말하는 것도 앞으로 이야기가 어떻게 되는지를 생각하면 의미심장하다.","lines":[{"k":"d","sp":["이여름"],"role":"","x":"그럼, 그 '작가와 작가의 형제'의 끝은 내가 말한 대로 엄마 아빠가 죽고 내가 원반대회에서 일등 하는 걸로 바꾸기로 해, 그러기로 하는 거다? 그리고 옛날 이야기는 태워버려, 아무도 그 이상한 이야기를 읽지 않게."},{"k":"d","sp":["이이름"],"role":"","x":"그래 형, 태워 버릴게."},{"k":"d","sp":["이여름"],"role":"","x":"정말?"},{"k":"d","sp":["이이름"],"role":"","x":"정말"},{"k":"d","sp":["이여름"],"role":"","x":"우와, 생각보다 쉽게 바꿔주네. 그렇다면, 내 생각에 태워야 할 이야기들이 더 많은 거 같아. 아니 내가 뭐 너한테 이래라 저래라 하고 싶은 마음은 없지만, 좀 이상하고 변태적인 것들 있잖아."},{"k":"d","sp":["이이름"],"role":"","x":"그냥 다 태워 버리지 그래. 뭘 수고스럽게 골라."},{"k":"d","sp":["이여름"],"role":"","x":"아니야, 그럼 안 되지. 태워버리다니. 사람들이 읽었을 때 아이들을 죽이고 다니게 될 만할 그런 이야기들만 골라내면 돼. 그리고 골라내는 일도 그렇게 어렵지는 않을 거 같아. 사람들이 읽고 아이들을 죽이지 않을 만한 이야기는 두 개 정도밖에 없으니까. 그지?"},{"k":"d","sp":["이이름"],"role":"","x":"그러셔?"},{"k":"d","sp":["이여름"],"role":"","x":"왜 그 초록 돼지 이야기, 그건 좋은 이야기야. 그걸 읽고서 아이들을 죽이고 돌아다닐 사람은 없을 테니까, 어.. 그리고... (사이) 음... (사이) 그게 다인가 보다, 하나 '작은 초록 돼지'"},{"k":"d","sp":["이이름"],"role":"","x":"더는 없어?"},{"k":"d","sp":["이여름"],"role":"","x":"응, 없어. 안전을 최우선으로 생각한다면 말이야. 물론 읽고 아이들을 죽이고 돌아다니지 않을 이야기는 더 있겠지, 하지만 대부분 불구로는 만들고 돌아다닐 이야기들이거든. 그런 건 혹시 모르니까 빼는 게 좋겠다. 그러면 남은 게 어, '작은 초록 돼지' 하나네. 물론 이야기를 읽고 누군가가 아이들을 초록색 페인트로 칠하고 다닐지는 모르지만, 하~ 그 정도면 큰 문제는 아니니까"},{"k":"d","sp":["이이름"],"role":"","x":"내 이야기에는 아무 문제없어. 형이 고른 이야기가 제일 끔찍한 것들만 아니었다면 말이야. 처음 읽은 세 개를 골라 실행에 옮긴 거는 아니잖아. 그 변태적인 취향에 가장 적합한 이야기 세 개를 고르셨겠지."},{"k":"d","sp":["이여름"],"role":"","x":"그럼. 니가 한 번 골라봐! 뭐가 멀쩡한 이야기인지"},{"k":"d","sp":["이이름"],"role":"","x":"근데 왜 하필이면 꼭 '어린 예수'였냐고?"},{"k":"d","sp":["이여름"],"role":"","x":"야, 그만해 좀. 이미 엎질러진 물을 담을 수는 없는 거야. 나 졸려. 머리 가려운 거만 잊어버릴 수 있으면 잘 수 있을 거 같은데. 미치겠다."},{"k":"a","x":"( 여름이 매트리스에 눕는다. )","tag":"이 대사 후"}],"pos":["I:bedL","Y:bedR"],"role":{}},{"id":"2-1-17","t":"“곧 평생 자게 될 텐데”","pl":2,"light":["“곧 평생 자게 될 텐데” 이후 전체 조명이 3초 동안 서서히 어두워짐’","(다만 배우의 얼굴은 최소한 보일 수 있게 함)"],"sound":["① 매우 낮고 느린 음악","(이름이 형을 죽이는 것을 암시하는 듯한)","② 매우 작고 틱틱거리는 소리의 음향"],"meaning":"이름이 형을 죽이기로 마음을 먹은 순간이다. ‘평생 잔다’는 말이 형의 죽음을 미리 말하는 것처럼 쓰인다. 여름은 이름의 이야기가 아직 필요해서 용서를 이야기의 대가로 내건다.","lines":[{"k":"d","sp":["이이름"],"role":"","x":"자려고?"},{"k":"d","sp":["이여름"],"role":"","x":"응"},{"k":"d","sp":["이이름"],"role":"","x":"곧 평생 자게 될 텐데."},{"k":"d","sp":["이여름"],"role":"","x":"이름아."},{"k":"d","sp":["이이름"],"role":"","x":"왜?"},{"k":"d","sp":["이여름"],"role":"","x":"이야기 하나만 해줘"},{"k":"d","sp":["이이름"],"role":"","x":"내 이야기를 다 태우는 게 좋겠다며"},{"k":"d","sp":["이여름"],"role":"","x":"초록 돼지 이야기 해줘. 그건 안 태울 거니까. 이야기 해주면 용서해 줄게."},{"k":"d","sp":["이이름"],"role":"","x":"뭘 용서하는데?"},{"k":"d","sp":["이여름"],"role":"","x":"나한테 심한 말 한 거"},{"k":"d","sp":["이이름"],"role":"","x":"(사이) 생각이 가물가물한다 어떻게 시작했었는지"},{"k":"d","sp":["이여름"],"role":"","x":"잘 생각해봐. 기억 날거야. 첫 번째 단어는 '옛날' 이고 두 번째 단어는 '옛적' 그리고 세 번째 단어는 '머나먼' 아.. 네 번째 단어가 뭐더라?"},{"k":"d","sp":["이이름"],"role":"","x":"형은 아주 똑똑한 멍청이구나."},{"k":"d","sp":["이여름"],"role":"","x":"아무튼 '옛날 옛적, 머나먼~' 이렇게 시작 했어."},{"k":"d","sp":["이이름"],"role":"","x":"그래, 편하게 누워서 들어..."},{"k":"a","x":"( 여름이 베개를 머리맡에 놓고 눕는다. )","tag":"이 대사 후"},{"k":"d","sp":["이여름"],"role":"","x":"옛날 생각난다. 딱 이렇게 누워서 이야기를 들었는데"}],"pos":["I:bedL","Y:bedR"],"role":{}},{"id":"2-1-18","t":"「작은 초록 돼지」 이야기를 들려주다","pl":2,"light":["(직전 씬 조명 유지) “곧 평생 자게 될 텐데” 이후 전체 조명이 3초 동안 서서히 어두워짐’","(다만 배우의 얼굴은 최소한 보일 수 있게 함)"],"sound":["죽음 직전의 고요한 느낌, 완전한 정적."],"meaning":"이름이 형에게 들려주는 마지막 이야기가 폭력이 없는 이야기다. ‘다른 것이 남는 이야기’라는 점이 이름과 형제의 처지와 겹친다. 이 이야기를 하는 사이에 가장 조용하게 죽음을 준비한다.","lines":[{"k":"d","sp":["이이름"],"role":"","x":"옛날 옛적, 머나먼 땅의 어느 농장에 아주 특별한 작은 돼지가 살고 있었어."},{"k":"d","sp":["이여름"],"role":"","x":"초록색이야~"},{"k":"d","sp":["이이름"],"role":"","x":"그래. 농장에 혼자 초록색인 돼지가 있었어. 자긴 그 모습이 좋았지만 다른 돼지들은 싫어했지. 결국 농부들이 그를 헛간으로 끌고 갔어."},{"k":"a","x":"(여름이 몸을 돌려 이름을 바라본다.)","tag":"이 대사 후"},{"k":"a","x":"(조용히)","tag":"대사 중"},{"k":"d","sp":["이여름"],"role":"","x":"(조용히) 나쁜 새끼들..."},{"k":"d","sp":["이이름"],"role":"","x":"농부들은 돼지를 분홍색 페인트 통에 넣었어. 그 페인트는 씻기지도, 다른 색이 덧칠되지도 않았지. 초록 돼지가 울며 기도했어. \"제발 다른 돼지들과 똑같이 만들지 말아주세요. 전 다른 게 좋아요.\" 하지만 이미 온몸이 분홍색이었어."},{"k":"d","sp":["이여름"],"role":"","x":"눈물로도 지워지지 않았겠네?"},{"k":"d","sp":["이이름"],"role":"","x":"그날 밤, 농장에 초록색 비가 내렸어. 한번 묻으면 절대 지워지지 않는 페인트 같은 비였지."},{"k":"a","x":"( 여름이 천천히 눈을 감는다. )","tag":"이 대사 후"},{"k":"a","x":"( 이름이 여름을 바라본다. 여름은 잠이 들어 있다. )","tag":"이 대사 후"},{"k":"a","x":"( 이름이 목소리를 낮춰 이야기를 이어간다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"다음 날, 모든 돼지가 초록색으로 변해 있었어. 딱 한 마리, 분홍 돼지만 빼고. 농부들이 칠한 페인트 위엔 초록색이 덧칠되지 않았거든."},{"k":"a","x":"( 잠시 침묵한다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"모두가 당황해 울 때 분홍 돼지만 미소 지었어. 자신은 여전히 남들과 다른 특별한 돼지였으니까."},{"k":"a","x":"(이름이 원고를 내려놓듯 손을 천천히 내린다.)","tag":"이 대사 후"},{"k":"a","x":"(이름이 잠든 여름의 머리를 쓰다듬는다.)","tag":"이 대사 후"},{"k":"a","x":"(울며)","tag":"대사 중"},{"k":"d","sp":["이이름"],"role":"","x":"이 이야기 좋아하지, 형? 발가락도 면도날도 없는 아름다운 이야기. (사이) 형, 형은 잘못한 거 없어. (울며) 잘 자. 내가 금방 따라갈게."}],"pos":["I:bedL","Y:bedR"],"role":{}},{"id":"2-1-19","t":"형의 죽음과 자백 선언 — 인터미션","pl":2,"light":["① 이이름이 베개를 드는 순간부터 조명 서서히 감소. 형을 죽이는 동작이 진행되는 동안 어둡게 유지하되, 완전히 암전하지는 않음.","② 암전"],"sound":["초침 효과음 + 배경음악은 몽환적인 음악으로"],"meaning":"1막 2장에서 부모를 베개로 죽인 방법을 형에게 똑같이 쓴다. 이름은 ‘이야기를 지키기 위해’ 형을 죽이고 거짓 자백을 하겠다는 선택을 한다. 초침 소리는 1막 시작에서 쓴 소리가 다시 돌아온 것이다.","lines":[{"k":"a","x":"( 이름이 베개를 들어 여름의 얼굴을 누르기 시작한다. 여름이 몸을 떨자, 이름이 여름 몸 전체를 눌러 앉아서 베개를 더 더욱 세게 누른다. 시간이 지날수록 여름의 떨림이 잦아든다. 좀 더 시간이 지나자 여름이 죽는다. 이름이 형이 죽었다는 것을 확신하자, 베개를 빼주고는 눈을 감긴다, 문 쪽으로 가더니 문을 요란하게 두드린다. )","tag":"씬 시작"},{"k":"m","x":"인터미션"},{"k":"d","sp":["이이름"],"role":"","x":"형사님들! (사이) 반장님?! 죄를 자백하겠습니다. 여섯 명을 살해한 혐의를 인정합니다. (사이) 단, 한 가지 조건이 있습니다. (사이) 제 이야기들에 관련된 겁니다."}],"pos":["I:bedL","Y:bedR"],"role":{}},{"id":"2-2-01","t":"소녀가 ‘예수의 딸’이라 믿다","pl":3,"light":["동화처럼 밝은 햇살 느낌의 조명"],"sound":["발랄한 음악이지만 시끄럽지 않도록"],"meaning":"어두운 감옥에서 갑자기 밝고 장난기 있는 동화로 바뀐다. 그래서 관객의 마음이 풀렸다가 다시 당하게 된다. 같은 배우들이 착한 부모와 폭력적인 양부모를 모두 연기하는 점은 ‘사랑과 고문을 같이 하는 부모’라는 이 극의 이미지를 다시 보여 준다.","lines":[{"k":"a","x":"( 이름이 이야기를 들려주면, 그 이야기를 한 소녀와 부모들이 무대에서 그대로 보여준다. 착한 부모에서 양부모로 바뀔 때 약간의 의상변화가 있다. 물론 배우는 같은 배우들이 연기한다. )","tag":"씬 시작"},{"k":"d","sp":["이이름"],"role":"","x":"옛날 옛적, 너무 멀지 않은 어떤 곳에, 한 작은 소녀가 살았습니다. 소녀의 착한 부모들이 아이를 종교적으로 키운 것은 아니었지만, 소녀는 언젠가부터 자신이 예수의 딸이라고 믿기 시작했습니다."},{"k":"a","x":"( 소녀는 뭔가 잘못된 수염을 붙이고, 샌들을 신고 있다. 소녀가 여러 가지 것들에 축복을 내리는 듯한 동작을 취한다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"소녀는 항상 턱수염을 붙이고, 샌들만 신고 다녔습니다. 그리고 모두가 기피하는 사람들을 찾아가 위로하고 축복했습니다. 부모는 그럴 때마다 소녀의 손을 잡고 집으로 데려 왔지만, 소녀는 항상 발을 동동 구르며 소리를 질러댔습니다. 부모가 그러는 아이를 꾸중하면,"},{"k":"d","sp":["한재권","박지철"],"role":"부모들","x":"예수님은 이렇게 발을 동동 구르고, 엄마 아빠한테 소리 지르고 그러지 않으셨어."},{"k":"d","sp":["이이름"],"role":"","x":"소녀는 말했죠. '그건 옛날 예수야! 세상이 얼마나 달라졌는데!' 그러던 어느 날 소녀가 이틀이나 사라졌습니다. 부모는 한 목사에게서 전화를 받았죠. '교회에 와서 아이를 데려가 주세요. 더는 감당할 수 없습니다.'"}],"pos":["I:nar","Y:cof","R:tb1","J:tb2"],"role":{"I":"이야기 낭독자","Y":"소녀(마리아)","R":"좋은 아빠","J":"좋은 엄마"}},{"id":"2-2-02","t":"부모의 사고","pl":3,"light":["부모가 피를 흘리기 시작하면 조명이 서서히 아웃된다."],"sound":["미끄러지는 바퀴 소리, 트럭과 충돌음."],"meaning":"소녀를 아끼던 부모가 허무하게 사라지는 순간이다. 이 장면은 폭력적인 양부모에게 가는 이야기를 이어 주는 연결 역할을 한다.","lines":[{"k":"a","x":"( 부모가 가슴을 쓸어내리며 안도한다. 소녀를 데리러 무대 밖으로 향한다. )","tag":"씬 시작"},{"k":"d","sp":["이이름"],"role":"","x":"부모는 그들이 뭐라고 하든 괜찮았습니다. 딸이 살아있다는 사실이 중요한 것이었으니까요. 딸을 다시 볼 수 있다는 생각에 서두른 나머지, 그들은 미끄러져 맞은 편 트럭과 정면충돌했고, 그 자리에서 즉사했습니다."},{"k":"d","sp":["이이름"],"role":"","x":"소녀는 부모 소식을 들었습니다. 만약에 예수님이 사고로 부모를 잃었다면 어떻게 하셨을까 한 번 고민하더니, 정확히 딱 한 방울의 눈물만을 흘렸습니다."}],"pos":["I:nar","Y:cof","R:tb1>xr","J:tb2>xr"],"role":{"I":"이야기 낭독자","Y":"소녀(마리아)","R":"좋은 아빠","J":"좋은 엄마"}},{"id":"2-2-03","t":"양부모와 맹인","pl":3,"light":["따뜻한 색을 없애고 -> 딱딱한 백색이나 차가운 빛"],"sound":["없음"],"meaning":"소녀의 호의가 곧바로 신고당하는 장면이다. 선의가 오히려 벌을 받는 이 이야기의 규칙이 여기서 시작된다. 소녀가 ‘드디어 깨달으셨군요’라고 대답하는 장면은 웃음과 섬뜩함이 함께 있다.","lines":[{"k":"d","sp":["이이름"],"role":"","x":"그녀는 정부에 의해 숲 속에 사는 한 폭력적인 양부모에게 보내졌죠."},{"k":"a","x":"( 비열해 보이는 양부모가 등장한다. 소녀의 손을 일부러 세게 잡아 아프게 한다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"물론 정부도 양부모의 폭력적인 성향까지는 몰랐습니다. 양부모는 종교를 싫어했으며, 그 중에도 특히 예수를 증오했습니다. 물론 소녀도 그 증오를 피할 순 없었죠."},{"k":"a","x":"( 양부모가 소녀의 턱수염을 떼서 버린다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"소녀는 양부모에게 학대를 당하면서도 그들을 용서했습니다. 맨발로 교회에 갔다가 쫓겨나고, 집에서는 날마다 매를 맞았죠. 그러면서도 자신을 더 강하게 해 줄 시련이라며 웃었습니다. 그러던 어느 날 길에서 한 맹인을 만났습니다."},{"k":"a","x":"( 이름이 맹인을 연기한다. 그녀가 먼지를 닦은 후 침을 섞어 맹인의 눈꺼풀에 발라준다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"소녀는 자신의 침과 먼지와 섞어 맹인의 눈꺼풀에 발라 주었습니다. 맹인은 경찰에게 소녀가 자신의 눈에 먼지와 침을 발랐다고 신고했고, 양부모가 경찰서에서 소녀를 데리고 집으로 돌아와서는..."},{"k":"d","sp":["한재권","박지철"],"role":"양부모","x":"너 진짜 예수가 되고 싶은 거니?"},{"k":"d","sp":["이이름"],"role":"","x":"그러자 소녀는 대답했습니다. '드디어 그걸 깨달으셨군요!' (사이) 양부모는 한동안 소녀를 노려보았습니다. 이건 불행의 시작에 불과했죠."}],"pos":["I:nar>crL","Y:cof","R:xr>cofF","J:xr>cofF"],"role":{"I":"낭독자·맹인","Y":"소녀(마리아)","R":"양아빠","J":"양엄마"}},{"id":"2-2-04","t":"철조망 왕관, 채찍, 십자가, 창","pl":3,"light":["붉어지는 조명"],"sound":["없음"],"meaning":"‘아직도 ~ 하고 싶니?’라는 똑같은 질문이 반복되는 구조가 취조실에서 되풀이되던 질문과 닮아 있다. 소녀는 질문에 굴복하지 않는 대답으로 끝까지 버틴다.","lines":[{"k":"a","x":"( 앞으로 나오는 끔찍한 상황들을 모두 무대에서 보여준다. )","tag":"씬 시작"},{"k":"d","sp":["이이름"],"role":"","x":"양 엄마는 가시 면류관을 제대로 만들 만큼 부지런하지 못했죠. 그래서 대신 철조망을 얽은 왕관을 머리 깊숙이 씌웠고, 아빠는 고양이 꼬리 아홉 개로 만든 채찍으로 몇 시간 동안 계속 때렸습니다. 소녀가 쓰러졌다 의식을 되찾자 물었죠..."},{"k":"d","sp":["한재권","박지철"],"role":"양부모","x":"아직도 예수가 되고 싶니?"},{"k":"d","sp":["이이름"],"role":"","x":"너무 아파서 기절할 뻔 했지만, 약해 보이고 싶지 않았기에 한 번 더 고통을 삼켰고, 양부모의 눈을 보며 다시 말했습니다. '예. 그럼요'"},{"k":"a","x":"( 양부모가 십자가를 세워 소녀를 십자가에 못 박는다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"양부모는 십자가에 소녀의 손과 발을 못으로 박기 시작했고, 검은 벽에 꼿꼿이 세워 놓고는 텔레비전을 보기 시작했죠. 저녁 내내 볼 만한 프로그램을 다 보고 나서야 텔레비전을 끄고, 창을 날카롭게 갈며 다시 소녀에게 물었습니다."},{"k":"d","sp":["한재권","박지철"],"role":"양부모","x":"아직도 예수가 되고 싶니?"},{"k":"d","sp":["이이름"],"role":"","x":"그러자 소녀는 다시 고통을 삼키고, 깊은 숨을 들이마시더니 말했습니다. '난 예수가 되고 싶은 게 아냐, 내가 씨발 진짜 예수야' (사이) 부모는 소녀의 허리에 창을 꽂았습니다."},{"k":"a","x":"( 창을 꽂는다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"그들은 소녀가 그렇게 죽어가게 내버려두고는 침실로 들어가 잤습니다."},{"k":"a","x":"( 소녀의 머리가 떨어진다. 아침이 돌아오자 양부모가 돌아온다. )","tag":"이 대사 후"}],"pos":["I:nar","Y:cr","R:crL","J:crR"],"role":{"I":"이야기 낭독자","Y":"소녀(마리아)","R":"양아빠","J":"양엄마"}},{"id":"2-2-05","t":"관 속의 사흘","pl":4,"light":["암전","(2막 2장의 동화가 끝난 후, 3막의 첫 취조실 장면이 켜질 때 기존 차가운 백색 조명으로 확실히 복귀.)"],"sound":["없음"],"meaning":"이 이야기의 끝은 구원이 아니라 ‘지나가는 사람’이다. 소녀가 조용히 사라지는 마지막은 3막에서 벙어리 소녀가 ‘살아 있었나 죽었나’라는 질문을 관객이 떠올리게 만든다. 이 이야기는 이름이 형을 죽이고 형사들에게 넘기는 마지막 이야기이기도 하다.","lines":[{"k":"d","sp":["이이름"],"role":"","x":"다음날 아침, 그녀가 아직도 살아있다는 사실에 꽤나 놀랐죠..."},{"k":"a","x":"( 소녀가 서서히 고개를 든다. 못 박힌 손을 흔들며 부모를 향해 인사한다. 부모는 소녀를 십자가에서 빼준다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"...그들은 소녀를 십자가에서 내려 준 후, 관에 넣어 산 채로 매장하기로 합니다. 그 관 안에는 길어야 삼 일 정도 겨우 살 수 있을 만큼의 공기만 있었습니다..."},{"k":"d","sp":["한재권","박지철"],"role":"양부모","x":"니가 만약 예수라면 사흘 후에 꼭 부활하거라. 할 수 있겠지?"},{"k":"d","sp":["이이름"],"role":"","x":"소녀는 잠시 생각에 잠기더니, 얼굴에 미소를 띠며 속삭였습니다. '바로 그거야, 바로 그거' (사이) 소녀는 기다리고, 기다리고, 또 기다렸습니다."},{"k":"a","x":"( 관에 조명이 어슴푸레 밝아진다. 소녀가 관 뚜껑을 손톱으로 긁는다. 이름이 걸어서 그 위를 지나간다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"삼 일 후, 숲 속을 산책하던 한 남자가 있었습니다. 그의 발에 새로 만들어진 이 작은 무덤이 채였지만, 이 남자는 앞을 볼 수 없었던 관계로 그냥 지나칩니다. 뼈로 뚜껑을 긁는 그 끔찍한 소리를 뒤로 하고, 남자는 슬프게도 멀어져 갔습니다. 그가 멀어질수록 그 소리는 점점 작아졌고, 서서히 아주 서서히 사라져 갔습니다. 아무도 없는 텅 빈, 텅 빈 저 숲 속으로, 검디검은 그늘 저 편으로 영원히..."}],"pos":["I:nar>cofF","Y:cof","R:cr","J:cr"],"role":{"I":"이야기 낭독자","Y":"소녀(마리아)","R":"좋은 아빠","J":"좋은 엄마"}},{"id":"3-01","t":"자백서를 쓰는 이름","pl":5,"light":["취조실은 어둡고 차가운 백색 조명으로 보여줌","(앞의 동화가 끝나고 현실로 되돌아온다는 느낌을 주도록)"],"sound":["없음"],"meaning":"이름이 형을 죽인 직후 쓰는 자백서다. 이야기를 지키기 위해 이름이 내놓는 대가다. ‘여섯 명’의 숫자가 이 장면에서 한 번 정리되어 관객 머릿속에 남는다.","lines":[{"k":"a","x":"( 경찰 취조실. 이름이 급하게 글씨를 써내려간다. 앉아 있는 재권에게 자신이 쓴 첫 번째 장을 건넨다. 지철은 서서 담배를 피우고 있다. )","tag":"씬 시작"},{"k":"d","sp":["한재권"],"role":"","x":"'여섯 명의 살인을 모두 자백합니다. 세 명은 단독으로, 세 명은 형 이여름과 함께 제 이야기를 따라 범행했습니다. 마지막으로 형을 베개로 질식시켰습니다.' 흠, 형을 지독하게 아끼셨군. '벙어리 소녀의 살인은 사흘 전으로, 소녀는…'"},{"k":"d","sp":["박지철"],"role":"","x":"(사이) 소녀는 뭐요?"},{"k":"d","sp":["한재권"],"role":"","x":"이게 페이지의 끝이야"},{"k":"d","sp":["박지철"],"role":"","x":"펜 좀 빨리 굴려, 씹할 놈아"}],"pos":["I:ts","R:tr","J:jw"],"role":{}},{"id":"3-02","t":"“시험 보는 줄 아나” — 「어린 예수」를 찾아 읽음","pl":5,"light":["(직전 씬 조명 유지) 취조실은 어둡고 차가운 백색 조명으로 보여줌","(앞의 동화가 끝나고 현실로 되돌아온다는 느낌을 주도록)"],"sound":["없음"],"meaning":"한재권이 「어린 예수」를 읽고 ‘역겨워하다가 슬퍼진다’는 괄호 설명이 있다. 한재권도 이야기에 마음이 흔들린다는 단서다. 이름이 자기 글을 본능적으로 가리는 동작은 이야기를 쓰는 사람의 습관이 몸에 배어 있음을 보여 준다.","lines":[{"k":"a","x":"( 지철이 맞은편 이름의 글을 보려고 목을 꺾는다. 이름은 거의 본능적으로 자신이 쓰던 글을 가린다. 지철이 그의 머리를 한 대 때린다. )","tag":"씬 시작"},{"k":"d","sp":["박지철"],"role":"","x":"이 새끼가 지금 무슨 시험 보는 줄 아나!"},{"k":"a","x":"( 지철이 이름의 어깨 너머로 읽는다. )","tag":"이 대사 후"},{"k":"d","sp":["박지철"],"role":"","x":"'\"어린 예수\"라는 이야기에 따라 죽였습니다.' 어린 예수 이야기가 뭐야? 그건 못 읽어본 이야기인거 같은데... 반장님 아세요?"},{"k":"a","x":"(역겨워하다가, 슬퍼진다)","tag":"대사 중"},{"k":"d","sp":["한재권"],"role":"","x":"(역겨워하다가, 슬퍼진다) 어, 읽었어."},{"k":"a","x":"( 지철이 파일 상자를 훑다가, 어린 예수 이야기를 찾는다. )","tag":"이 대사 후"},{"k":"a","x":"( 지철이 이야기를 읽기 시작한다. 이름은 재권의 따가운 시선을 느끼며 잠시 그를 쳐다본다. 재권에게 두 번째 페이지를 건네고, 다시 글을 쓴다. )","tag":"이 대사 후"}],"pos":["I:ts","R:tr","J:jw>boxR"],"role":{}},{"id":"3-03","t":"시체의 위치와 지도, 총 점검","pl":5,"light":["(직전 씬 조명 유지) 취조실은 어둡고 차가운 백색 조명으로 보여줌","(앞의 동화가 끝나고 현실로 되돌아온다는 느낌을 주도록)"],"sound":["없음"],"meaning":"한재권이 총을 점검하는 모습은 이름의 처형이 이미 준비되고 있다는 신호다. 이름이 시체가 묻힌 곳을 정확히 말하자 형사들은 이름을 진짜 범인으로 믿게 된다.","lines":[{"k":"d","sp":["한재권"],"role":"","x":"시체는 어디다 뒀나?"},{"k":"d","sp":["이이름"],"role":"","x":"지도에 그렸습니다. 저희 집 뒤로 50미터 정도 가면, 비무 숲 속에 소원의 우물이 있습니다. 그 소원의 우물 바로 뒤를 파보시면 거기 어른 시체 두 구와 함께 묻혀 있을 겁니다."},{"k":"d","sp":["한재권"],"role":"","x":"어른 시체 두 구는 또 뭐고?"},{"k":"d","sp":["이이름"],"role":"","x":"그것도 이제 곧 쓰려던 참입니다."},{"k":"a","x":"( 재권이 총을 점검한다. 이름이 알아채지만, 일단 계속 써내려 간다. )","tag":"이 대사 후"},{"k":"a","x":"(박지철에게)","tag":"대사 중"},{"k":"d","sp":["한재권"],"role":"","x":"(박지철에게) 어디까지 읽었나?"},{"k":"d","sp":["박지철"],"role":"","x":"수염 붙이고 샌들을 신고 다녔다는 부분이요"},{"k":"d","sp":["한재권"],"role":"","x":"박 형사, 만약에 아이를 어떻게 죽였는지가 궁금한 거면 결말만 보면 되지. (사이) 감식반한테 연락해서 빨리 출동하라고 해. 시신 수습하고, 바로 부검 넘기라고. 갈 길이 멀다."},{"k":"a","x":"( 재권이 이름이 준 지도를 가지고 퇴장한다. )","tag":"이 대사 후"}],"pos":["I:ts","R:tr>xr","J:boxR"],"role":{}},{"id":"3-04","t":"박지철이 「어린 예수」 결말을 읽고 훌쩍임, 첨부 자백과 약속","pl":5,"light":["(직전 씬 조명 유지) 취조실은 어둡고 차가운 백색 조명으로 보여줌","(앞의 동화가 끝나고 현실로 되돌아온다는 느낌을 주도록)"],"sound":["없음"],"meaning":"이름이 이 모든 것을 ‘약속’에 걸고 있다는 점이 분명해지는 장면이다. 이름이 쓴 ‘형과 함께 아이들을 죽였다’는 부분은 나중에 거짓으로 밝혀진다. 박지철이 눈물까지 흘리면서도 이름을 혐오하는 모습은 이 인물의 복잡함을 보여 준다.","lines":[{"k":"a","x":"( 지철은 결말을 읽고 눈가를 비비며 훌쩍인다. 이름은 한 번 쳐다보고는 다시 써내려 간다. 지철은 혐오감에 치를 떤다. )","tag":"씬 시작"},{"k":"d","sp":["박지철"],"role":"","x":"세상에 너 같은 인간이 왜 존재해야 하는 거니?"},{"k":"a","x":"( 이름이 쓰던 페이지를 마치고, 새 종이에 다시 쓰기 시작한다. 이름이 첫 번째 장을 읽는다. )","tag":"이 대사 후"},{"k":"d","sp":["박지철"],"role":"","x":"'\"강가의 한 마을 이야기\", 첨부에 따른 것으로 제 형이 발가락을 자를 때 제가 소년의 다리를 잡아 주었습니다. (사이) \"작은 사과맨\", 첨부에 따라 제 형이 사람모양으로 작게 조각한 면도날 넣은 사과를 입에 넣을 때 제가 역시 소녀의 입을 열어 주었습니다.' (사이) 널 죽이고 나서 정말 너의 이 변태적인 이야기들을 다 태우지 않을 거라고 믿는 거냐?"},{"k":"d","sp":["이이름"],"role":"","x":"전 모든 것을 약속대로 진실에 입각해서 자백했습니다. 당신들도 약속대로 제 이야기를 사건 파일과 함께 보관했다가 오십 년 후에 세상에 발표해 주리라 믿습니다."},{"k":"d","sp":["박지철"],"role":"","x":"뭘 믿고 우리가 약속을 지킬 거라 생각하지?"},{"k":"d","sp":["이이름"],"role":"","x":"존경할 만한 분들이라 믿습니다."},{"k":"d","sp":["박지철"],"role":"","x":"존경해, 좆나 존경해?"},{"k":"a","x":"(종이를 품고 움츠러든다)","tag":"대사 중"},{"k":"d","sp":["이이름"],"role":"","x":"(종이를 품고 움츠러든다) 저 이거 다 쓰고 나서 때리시면 안 될까요? 이제 곧 엄마 아빠 죽인 부분을 써야 하거든요"}],"pos":["I:ts","J:tm"],"role":{}},{"id":"3-05","t":"엄마 아빠를 죽인 이유 — ‘자전적인 이야기’","pl":5,"light":["(직전 씬 조명 유지) 취조실은 어둡고 차가운 백색 조명으로 보여줌","(앞의 동화가 끝나고 현실로 되돌아온다는 느낌을 주도록)"],"sound":["없음"],"meaning":"이름이 가장 숨겨 온 진실을 처음으로 형사들에게 직접 말하는 장면이다. 이름이 캐비닛에 가서 안을 확인하는 동작은 대본에 이유가 적혀 있지 않다. 뒤에 파일 맨 뒤에서 이름이 남긴 마지막 장이 발견된다는 점과 이어서 볼 수도 있다.","lines":[{"k":"a","x":"( 이름이 계속 쓴다. 지철이 담배에 불을 붙인다. )","tag":"씬 시작"},{"k":"d","sp":["박지철"],"role":"","x":"엄마 아빠도 죽였어?"},{"k":"a","x":"( 이름이 고개를 끄덕인다. )","tag":"이 대사 후"},{"k":"d","sp":["박지철"],"role":"","x":"... 왜 그랬어?"},{"k":"d","sp":["이이름"],"role":"","x":"음... 제 이야기 중에 '작가와 작가의 형제'라는 작품이 있습니다. 읽어 보셨는지는 잘 모르겠지만"},{"k":"d","sp":["박지철"],"role":"","x":"봤어"},{"k":"d","sp":["이이름"],"role":"","x":"전 자전적인 글을 쓰는 사람들이야말로 가장 한심한 작자들이라고 생각합니다. 자기가 아는 것만 쓰는 사람들은 항상 아는 이야기밖에 쓸 줄 모르죠. 뭘 꾸며내기엔 너무도 멍청한 꼴통들이니까, 하지만 제 이야기 중에도 전부가 다 꾸며낸 것만은 아닌, 말하자면 자전적인 이야기가 하나 있습니다. 그게 바로 '작가와 작가의 형제'입니다."},{"k":"d","sp":["박지철"],"role":"","x":"... (사이) 부모들이 고문하기 시작했을 때가 언제였는데?"},{"k":"d","sp":["이이름"],"role":"","x":"형은 여덟 살, 전 일곱 살"},{"k":"d","sp":["박지철"],"role":"","x":"얼마나 당했는데?"},{"k":"d","sp":["이이름"],"role":"","x":"칠년이요"},{"k":"d","sp":["박지철"],"role":"","x":"넌 칠년 내내 그 소리를 들은 거고?"},{"k":"d","sp":["이이름"],"role":"","x":"처음에는 잘 몰랐습니다. 무슨 소리인지, 나중에야 알았죠."},{"k":"d","sp":["박지철"],"role":"","x":"그래서 부모를 죽였나?"},{"k":"a","x":"( 이름이 고개를 끄덕인다. 자백서의 마지막 장을 지철에게 넘긴다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"형과 같은 방법으로요. 그리고는 집 뒤에 있는 소원의 우물가에 묻었죠. 그 벙어리 소녀가 매장된 곳도 그 장소입니다."},{"k":"a","x":"( 이름이 파일이 정리된 캐비닛에 가서 안을 확인한다. )","tag":"이 대사 후"}],"pos":["I:ts>boxR","J:tm"],"role":{}},{"id":"3-06","t":"박지철의 신념 — 전기 고문기를 꺼내다","pl":5,"light":["고문기가 눈에 띄도록 조명을 비춤"],"sound":["없음"],"meaning":"박지철이 ‘아이를 지킨다’는 믿음으로 폭력을 정당화하는 장면이다. 이 신념은 이름이 아이를 해쳤다고 믿는 동안은 강하지만, 이름이 사실은 해치지 않았다는 것이 드러나면 흔들린다.","lines":[{"k":"d","sp":["박지철"],"role":"","x":"너의 그 어린 시절은 법정에서 너에게 유리한 변론으로 작용할 수 있을 거야. 우리가 법정에서 하는 엿 같은 과정을 건너뛰고, 여기서 바로 패죽이지 않았을 때 이야기이긴 하지만."},{"k":"d","sp":["이이름"],"role":"","x":"약속만 지켜준다면, 절 바로 죽여도 상관없어요. 제 이야기들만 안전하게 보호해 주신다면."},{"k":"d","sp":["박지철"],"role":"","x":"우릴 믿고 싶으면 한 번 믿어봐"},{"k":"d","sp":["이이름"],"role":"","x":"믿어요."},{"k":"d","sp":["박지철"],"role":"","x":"우릴 뭘 보고 믿나?"},{"k":"d","sp":["이이름"],"role":"","x":"모르겠습니다. 하지만 왠지 형사님은 믿음이 가요. 설명하긴 좀 힘들지만"},{"k":"d","sp":["박지철"],"role":"","x":"이번엔 내 얘길 해볼까? 난 너처럼 애들한테 손대는 인간이 제일 싫어. 그래서 매일 아침 전기 고문기부터 점검하지. 죄가 없는 놈이라도 한 번 당하고 나면 아이들에게 소리조차 못 지를 테니까. 난 그게 애들을 지키는 일이라고 생각해. 내가 늙으면 살아남은 아이들이 과자를 들고 와서 고맙다고 하겠지. (사이) 하지만 넌 다르잖아. 네가 쓴 이야기대로 정말 아이를 해쳤어. 그런 널 그냥 둘 순 없다고!"},{"k":"a","x":"( 지철이 캐비닛에서 무섭게 생긴 큰 건전지와 전기 고문 기계를 꺼낸다. )","tag":"이 대사 후"},{"k":"d","sp":["박지철"],"role":"","x":"... 니 엄마 아빠가 너랑 니 형한테 무슨 짓을 했건 내 알 바 아냐. 좆까, 니 부모들도 나한테 걸렸으면, 씹할, 죽을 때까지 고문당했을 거니까. 적어도 네 고통을 다른 아이들에게까지 넘기진 말았어야지. 네가 당한 잘못이, 네가 저지른 잘못을 지워주진 않는다고. 알아? 와서 무릎 꿇어. 건전지 좀 연결해야 되니까."},{"k":"a","x":"( 이름이 뒤로 물러선다. )","tag":"이 대사 후"},{"k":"d","sp":["이이름"],"role":"","x":"아까 많이 했잖아요 /"},{"k":"d","sp":["박지철"],"role":"","x":"와서 무릎 꿇으라고."}],"pos":["I:ts>cl","J:boxR>tm"],"role":{}},{"id":"3-07","t":"한재권 등장 — 박지철 놀리기","pl":5,"light":["(직전 씬 조명 유지) 고문기가 눈에 띄도록 조명을 비춤"],"so
